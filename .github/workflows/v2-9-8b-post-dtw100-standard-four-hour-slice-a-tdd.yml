name: V2-9.8B post-DTW100 standard four-hour Slice A TDD

on:
  pull_request:

permissions:
  contents: write

env:
  PYTHONPATH: src

jobs:
  patch:
    if: contains(github.event.pull_request.title, 'APPLY standard four-hour Slice A')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply reviewed Slice A patch
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "${BASE_REF}"
          git show FETCH_HEAD:scripts/standard_four_hour_slice_a_patch.py > /tmp/slice_a_patch.py
          python -m py_compile /tmp/slice_a_patch.py
          python /tmp/slice_a_patch.py
          python -m py_compile \
            src/printer_v1/scheduler/token_local_continuation.py \
            src/printer_v1/operator_cli/one_token_4h_runtime.py \
            tests/test_v2_9_7d_4a_token_local_selective_continuation.py \
            tests/test_post_dtw100_first_hour_lifecycle_policy.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_policy_capacity.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/printer_v1/scheduler/token_local_continuation.py \
            src/printer_v1/operator_cli/one_token_4h_runtime.py \
            tests/test_v2_9_7d_4a_token_local_selective_continuation.py \
            tests/test_post_dtw100_first_hour_lifecycle_policy.py
          git commit -m 'Adopt standard first-four-hour policy foundation'
          git push origin HEAD:${TARGET_BRANCH}

  focused:
    if: ${{ !contains(github.event.pull_request.title, 'APPLY standard four-hour Slice A') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile policy/capacity owners
        run: |
          python -m py_compile \
            src/printer_v1/scheduler/token_local_continuation.py \
            src/printer_v1/operator_cli/one_token_4h_runtime.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_policy_capacity.py
      - name: Focused Slice A proof
        run: |
          python -m unittest -v \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_policy_capacity \
            tests.test_v2_9_7d_4a_token_local_selective_continuation \
            tests.test_post_dtw100_first_hour_lifecycle_policy \
            tests.test_v2_6_1_snapshot_cadence_continuity
