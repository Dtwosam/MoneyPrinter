name: V2-9.8B zero-attempt opening-plan RED

on:
  push:
    branches:
      - assistant/red-v2-9-8b-zero-attempt-opening-plan

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Prove zero-attempt opening-plan regression
        run: |
          python -m pytest -q tests/test_v2_9_8b_zero_attempt_after_opening_plan.py
