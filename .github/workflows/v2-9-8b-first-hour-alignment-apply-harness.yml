name: V2-9.8B checkpoint 1 replay guard patcher

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.pull_request.title, 'APPLY checkpoint1 replay guard')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Remove premature global handoff state guard
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/printer_v1/operator_cli/operational_selective_1h.py')
          text = path.read_text(encoding='utf-8')
          old = '''    allowed_pre_handoff_states = {
        "SELECTED", "WINDOW_15M_ACTIVE", "WINDOW_15M_CLOSED"
    }
    for slot in slots:
        token_state = str(slot.get("token_state") or "")
        if token_state not in allowed_pre_handoff_states:
            raise Selective1hError(
                f"pre-handoff token state conflict for {slot['token_slot_id']}: {token_state}"
            )

'''
          if text.count(old) != 1:
              raise SystemExit(f'guard drift: expected one block, found {text.count(old)}')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          python -m py_compile \
            src/printer_v1/operator_cli/campaign_ownership.py \
            src/printer_v1/operator_cli/operational_selective_1h.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/printer_v1/operator_cli/operational_selective_1h.py
          git commit -m 'Preserve first-hour handoff replay idempotency'
          git push origin HEAD:${TARGET_BRANCH}
