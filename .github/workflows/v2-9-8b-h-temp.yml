name: V2-9.8B H temporary verification

on:
  push:
    branches:
      - v2-9-8b-h-ci-dev

permissions:
  contents: write
  issues: write

jobs:
  h-implement-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-9-8b-h-ci-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: install
        name: Install Printer
        run: python -m pip install -e .
      - id: patch
        name: Apply narrow H repair
        run: |
          python - <<'PY'
          from pathlib import Path

          prod = Path('src/printer_v1/operator_cli/operational_selective_1h.py')
          text = prod.read_text()
          old = '''        reconcile_15m_campaign_window(\n            connection,\n            campaign_window_id=campaign_window_id,\n            promotion=promotion,\n            now=stamp,\n        )\n        safety = load_authoritative_window_safety(\n            db_path,\n            campaign_id=campaign_id,\n            run_id=run_id,\n            cycle_id=cycle_id,\n            token_slot_id=token_slot_id,\n            window_id=campaign_window_id,\n        )\n'''
          new = '''        reconcile_15m_campaign_window(\n            connection,\n            campaign_window_id=campaign_window_id,\n            promotion=promotion,\n            now=stamp,\n        )\n        predecessor_close = connection.execute(\n            "SELECT window_end_at FROM printer_memory_windows WHERE id=?",\n            (memory_window_id,),\n        ).fetchone()\n        if predecessor_close is None or not predecessor_close["window_end_at"]:\n            raise Selective1hError(\n                f"15m predecessor lacks authoritative window_end_at: {memory_window_id}"\n            )\n        safety = load_authoritative_window_safety(\n            db_path,\n            campaign_id=campaign_id,\n            run_id=run_id,\n            cycle_id=cycle_id,\n            token_slot_id=token_slot_id,\n            window_id=campaign_window_id,\n            memory_window_close_cutoff=str(predecessor_close["window_end_at"]),\n        )\n'''
          if text.count(old) != 1:
              raise SystemExit('production patch anchor mismatch')
          prod.write_text(text.replace(old, new, 1))

          test = Path('tests/test_v2_9_8b_operational_selective_1h.py')
          text = test.read_text()
          old = '''                    id,token_id,pair_id,window_kind,opened_at,closed_at,\n                    memory_status,data_quality_label,window_status,\n                    memory_quality_label,outcome_label,do_not_train,\n                    snapshot_end_id,supporting_context_json\n                ) VALUES (?,?,?,'WINDOW_15M',?,?,?,?, 'WINDOW_CLOSED',?,?,?,?,?)'''
          new = '''                    id,token_id,pair_id,window_kind,opened_at,closed_at,\n                    memory_status,data_quality_label,window_status,\n                    memory_quality_label,outcome_label,do_not_train,\n                    snapshot_end_id,supporting_context_json,window_start_at,window_end_at\n                ) VALUES (?,?,?,'WINDOW_15M',?,?,?,?, 'WINDOW_CLOSED',?,?,?,?,?,?,?)'''
          if text.count(old) != 1:
              raise SystemExit('fixture column patch anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''                    closing_snapshot_id,\n                    json.dumps(ctx),\n                ),'''
          new = '''                    closing_snapshot_id,\n                    json.dumps(ctx),\n                    _iso(T0),\n                    _iso(T15),\n                ),'''
          if text.count(old) != 1:
              raise SystemExit('fixture value patch anchor mismatch')
          test.write_text(text.replace(old, new, 1))
          PY
      - id: htest
        name: H focused proof
        run: python -m unittest discover -s tests -p 'test_v2_9_8b_h_continuation_cutoff.py' -v
      - id: regression
        name: Selective 1h regression
        run: python -m unittest discover -s tests -p 'test_v2_9_8b_operational_selective_1h.py' -v
      - id: compile
        name: Compile changed production file
        run: python -m py_compile src/printer_v1/operator_cli/operational_selective_1h.py
      - id: diffcheck
        name: Diff check
        run: git diff --check
      - id: commit
        name: Commit verified H repair
        run: |
          git config user.name 'Printer H verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add src/printer_v1/operator_cli/operational_selective_1h.py tests/test_v2_9_8b_operational_selective_1h.py tests/test_v2_9_8b_h_continuation_cutoff.py
          git commit -m 'Repair predecessor-bound continuation cutoff [skip ci]'
          git push origin HEAD:v2-9-8b-h-ci-dev
      - name: Report verification outcome to draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL: ${{ steps.install.outcome }}
          PATCH: ${{ steps.patch.outcome }}
          HTEST: ${{ steps.htest.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          DIFFCHECK: ${{ steps.diffcheck.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
        run: |
          gh api repos/${{ github.repository }}/issues/183/comments \
            -f body="H_CI_RESULT install=$INSTALL patch=$PATCH htest=$HTEST regression=$REGRESSION compile=$COMPILE diffcheck=$DIFFCHECK commit=$COMMIT source_sha=${{ github.sha }}"
