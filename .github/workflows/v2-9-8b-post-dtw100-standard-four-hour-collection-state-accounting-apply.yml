name: V2-9.8B post-DTW100 standard four-hour collection state accounting apply

on:
  pull_request:

permissions:
  contents: write

env:
  PYTHONPATH: src

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify disposable trigger and exact RED parent
        run: |
          echo "TRIGGER_HEAD=$(git rev-parse HEAD)"
          echo "RED_PARENT=$(git rev-parse HEAD^)"
          test "$(git rev-parse HEAD^)" = "403169301eb2cd6f026457e7852d527806b2bac8"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/v2-9-8b-post-dtw100-standard-four-hour-collection-state-accounting-apply-trigger.txt"
          git checkout 403169301eb2cd6f026457e7852d527806b2bac8
          test "$(git rev-parse HEAD)" = "403169301eb2cd6f026457e7852d527806b2bac8"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Apply narrow one-file repair
        run: |
          git fetch origin agent/v2-9-8b-post-dtw100-standard-four-hour-collection-state-accounting-apply-base --depth=1
          git show FETCH_HEAD:.github/scripts/apply_standard_four_hour_collection_state_accounting.py > /tmp/apply_standard_four_hour_collection_state_accounting.py
          git show FETCH_HEAD:.github/scripts/fix_standard_four_hour_collection_failure_branches.py > /tmp/fix_standard_four_hour_collection_failure_branches.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply_standard_four_hour_collection_state_accounting.py')
          text = path.read_text()
          marker = '# 9. Extend both token-local failure branches to reconcile exact long lifecycle only.'
          if marker not in text:
              raise SystemExit('primary patcher terminal-section marker missing')
          path.write_text(text.split(marker, 1)[0] + '\npath.write_text(text)\n')
          PY
          python /tmp/apply_standard_four_hour_collection_state_accounting.py
          python /tmp/fix_standard_four_hour_collection_failure_branches.py
          test "$(git diff --name-only)" = "src/printer_v1/operator_cli/one_command_15m_factory.py"
          git diff --check
      - name: Compile
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_collection_state_accounting.py
      - name: Focused GREEN verification
        run: |
          python -m unittest -v \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_collection_state_accounting \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning \
            tests.test_v2_9_8b_post_dtw100_checkpoint3_remaining_45m_collection \
            tests.test_v2_9_8b_campaign_scheduler_ownership_schema_migration
      - name: Preserve capability locks and scope
        run: |
          python - <<'PY'
          from printer_v1.operator_cli.one_token_4h_runtime import runtime_budget
          from printer_v1.snapshots.cadence_policy import get_policy
          for lane in ('TRACK_FAST', 'TRACK_NORMAL'):
              assert runtime_budget(lane)['enabled_for_real_collection'] is False
              assert get_policy('WINDOW_4H', lane).enabled_for_real_collection is False
          for window in ('WINDOW_12H', 'WINDOW_24H'):
              for lane in ('TRACK_FAST', 'TRACK_NORMAL'):
                  assert get_policy(window, lane).enabled_for_real_collection is False
          PY
          test "$(git diff --name-only)" = "src/printer_v1/operator_cli/one_command_15m_factory.py"
          git diff --check
      - name: Commit production-only repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/printer_v1/operator_cli/one_command_15m_factory.py
          git commit -m "Repair standard four-hour collection state accounting"
          git push origin HEAD:agent/v2-9-8b-post-dtw100-standard-four-hour-campaign-integration-implementation
