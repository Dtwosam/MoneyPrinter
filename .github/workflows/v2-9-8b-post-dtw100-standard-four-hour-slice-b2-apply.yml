name: V2-9.8B post-DTW100 standard four-hour Slice B2 apply

on:
  pull_request:

permissions:
  contents: write

env:
  PYTHONPATH: src

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify disposable trigger and exact B2 RED parent
        run: |
          echo "TRIGGER_HEAD=$(git rev-parse HEAD)"
          echo "RED_PARENT=$(git rev-parse HEAD^)"
          test "$(git rev-parse HEAD^)" = "9bb5fd2ef16cfd549434e01d8ea2538aa2856968"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/v2-9-8b-post-dtw100-standard-four-hour-slice-b2-apply-trigger.txt"
          git checkout 9bb5fd2ef16cfd549434e01d8ea2538aa2856968
          test "$(git rev-parse HEAD)" = "9bb5fd2ef16cfd549434e01d8ea2538aa2856968"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Apply narrow B2 production patch
        run: |
          git fetch origin agent/v2-9-8b-post-dtw100-standard-four-hour-slice-b2-apply-base --depth=1
          git show FETCH_HEAD:.github/scripts/apply_standard_four_hour_b2.py > /tmp/apply_standard_four_hour_b2.py
          python /tmp/apply_standard_four_hour_b2.py
          test "$(git diff --name-only | sort)" = $'src/printer_v1/operator_cli/campaign_ownership.py\nsrc/printer_v1/operator_cli/one_token_4h_runtime.py'
          git diff --check
      - name: Compile
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/campaign_ownership.py \
            src/printer_v1/operator_cli/one_token_4h_runtime.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning.py
      - name: Focused B2 GREEN verification
        run: |
          python -m unittest -v \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_campaign_handoff \
            tests.test_v2_9_8b_campaign_scheduler_ownership_schema_migration
      - name: Preserve legacy one-token planning contract
        run: |
          python -m unittest -v \
            tests.test_v2_8_1_one_token_4h_runtime.OneToken4hRuntimeTests.test_budget_and_plans_are_exact_and_real_collection_is_explicit \
            tests.test_v2_8_1_one_token_4h_runtime.OneToken4hRuntimeTests.test_current_run_plan_is_exact_fixed_and_replay_safe \
            tests.test_v2_8_1_one_token_4h_runtime.OneToken4hRuntimeTests.test_partial_replay_plan_stops_safely \
            tests.test_v2_8_1_one_token_4h_runtime.OneToken4hRuntimeTests.test_wrong_run_or_consumed_predecessor_is_rejected
      - name: Preserve capability locks and diff scope
        run: |
          python - <<'PY'
          from printer_v1.operator_cli.one_token_4h_runtime import runtime_budget
          from printer_v1.snapshots.cadence_policy import get_policy
          for lane in ('TRACK_FAST', 'TRACK_NORMAL'):
              assert runtime_budget(lane)['enabled_for_real_collection'] is False
              assert get_policy('WINDOW_4H', lane).enabled_for_real_collection is False
          for window in ('WINDOW_12H', 'WINDOW_24H'):
              for lane in ('TRACK_FAST', 'TRACK_NORMAL'):
                  assert get_policy(window, lane).enabled_for_real_collection is False
          PY
          test "$(git diff --name-only | sort)" = $'src/printer_v1/operator_cli/campaign_ownership.py\nsrc/printer_v1/operator_cli/one_token_4h_runtime.py'
          git diff --check
      - name: Commit production-only B2 change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/printer_v1/operator_cli/campaign_ownership.py \
            src/printer_v1/operator_cli/one_token_4h_runtime.py
          git commit -m "Implement standard four-hour campaign planning"
          git push origin HEAD:agent/v2-9-8b-post-dtw100-standard-four-hour-campaign-integration-implementation
