name: Checkpoint 8 real consumer RED

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  real-consumer-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile harness
        run: python -m py_compile scripts/v2_9_8b_checkpoint8_controlling_public_composition_proof.py
      - name: Run real-consumer compatibility REDs
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest -q tests/test_v2_9_8b_window_15m_checkpoint8_real_consumer_compatibility.py
