name: V2-9.8B historical dual-artifact-root RED

on:
  push:
    branches:
      - agent/v2-9-8b-historical-dual-artifact-root-repair-implementation

jobs:
  focused-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - name: Focused RED
        run: python -m pytest -q tests/test_v2_9_8b_historical_dual_artifact_root_repair.py
