name: V2-9.8B historical lease-path baseline check

on:
  push:
    branches:
      - agent/v2-9-8b-historical-lease-path-disposable-proof-repair

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 01245f9d699ce01b534135287feaf1790c4a4a6b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_v2_9_7e_1_insufficient_pool_terminal_cleanup.py::InsufficientPoolTerminalCleanupTests::test_insufficient_pool_cleanup_report_replay
