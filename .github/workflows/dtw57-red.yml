name: DTW-57 Durable Reconstruction RED

on:
  pull_request:
    branches:
      - tmp/dtw57-red-orchestration
    types: [opened]

permissions:
  contents: read

env:
  DTW57_RED_HEAD: 5b16371ee2373e81a163ad664f8730845b2ee901
  DTW57_DESIGN_HEAD: 3142b767eacad579409a5128c9fe3b9f9cfc1b4f

jobs:
  deterministic-red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DTW57_RED_HEAD }}
          fetch-depth: 2

      - name: Verify exact test-only RED delta
        run: |
          test "$(git rev-parse HEAD)" = "$DTW57_RED_HEAD"
          git diff --check "$DTW57_DESIGN_HEAD" "$DTW57_RED_HEAD"
          FILES="$(git diff --name-only "$DTW57_DESIGN_HEAD" "$DTW57_RED_HEAD")"
          test "$FILES" = "tests/test_v2_9_8b_window_15m_checkpoint8_dtw57_durable_reconstruction_red.py"
          test -z "$(git diff --name-only "$DTW57_DESIGN_HEAD" "$DTW57_RED_HEAD" -- src scripts)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Printer V1 and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile RED fixture
        run: |
          python -m py_compile tests/test_v2_9_8b_window_15m_checkpoint8_dtw57_durable_reconstruction_red.py

      - name: Execute DTW-57 RED only
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -uo pipefail
          set +e
          pytest -q tests/test_v2_9_8b_window_15m_checkpoint8_dtw57_durable_reconstruction_red.py 2>&1 | tee /tmp/dtw57-red.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "DTW57_PYTEST_RC=$RC"
          test "$RC" -ne 0
          if grep -Eq "ERROR at setup|ERROR collecting|SyntaxError|sqlite3\.IntegrityError" /tmp/dtw57-red.log; then
            echo "DTW57_INVALID_RED_SETUP_OR_FIXTURE_ERROR"
            exit 1
          fi
          echo "DTW57_RED_OBSERVED"
