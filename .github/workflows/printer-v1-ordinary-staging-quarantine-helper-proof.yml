name: Printer V1 ordinary staging quarantine helper proof

on:
  pull_request:
    branches:
      - agent/v2-9-8b-post-dtw100-ordinary-staging-residue-audit-proof-base

permissions:
  contents: read

jobs:
  helper-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 170a4af97ac1e32036aa1133fa97431f5d3c8927
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile helper
        run: python -m py_compile scripts/Repair-PrinterV1-PostDTW100-OrdinaryStagingResidue.py
      - name: Prove bounded quarantine contract
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('scripts/Repair-PrinterV1-PostDTW100-OrdinaryStagingResidue.py')
          text = path.read_text(encoding='utf-8')
          module = ast.parse(text)
          for value in (
              'shutil.rmtree', 'os.unlink', '.unlink(', 'sqlite3.connect',
              'apply_authorization_once', 'run_standard_four_hour_campaign(',
              'urllib', 'requests.', 'httpx', 'aiohttp',
          ):
              assert value not in text, value
          assert 'os.rename(source, target)' in text
          assert 'EXPECTED_DB_SHA256' in text
          assert 'QUARANTINE_PARENT' in text
          assert 'quarantine_directory_creations' in text
          assert 'quarantine_renames' in text
          assert 'deletions": 0' in text
          assert 'authoritative_database_writes": 0' in text
          assert 'source_calls": 0' in text
          assert 'scheduler_runtime_calls": 0' in text
          assert 'authorization_created": False' in text
          assert 'canonical_application_mutations": 0' in text
          assert 'authorization_package_mutations": 0' in text

          expected = {
              'V2_9_8B_WINDOW_15M_AUTH_20260802T112358Z-8c6effa328cd4a6fa05b5e2e016a273d': None,
              'V2_9_8B_WINDOW_15M_AUTH_20260803T204800Z-bae5318756834afa8218bc1874e712fd': 'd1705ced3a8629ad87a2745a78ec0940b77494e0a6177b0e8192fe7659e098b1',
              'V2_9_8B_WINDOW_15M_AUTH_20260804T214901Z-c1b4d8360ddb485dbbeadfb0f5773c46': '76beaa565e716c82fd3cf4bf5a4e96206246bfc905029b5cf5d63196ffa84e90',
              'V2_9_8B_WINDOW_15M_AUTH_20260806T005252Z-3778d27807ff40edac6e9ac961b78ea9': 'd010dc1b2e7f8d220cb81aefd2f8474d7b35de1cc4618f8daa2675ee8ff1d9a1',
              'V2_9_8B_WINDOW_15M_AUTH_20260806T005252Z-f47145e2df5b41bea6e44475c8c464ba': '47d76219c47e4dbe77d2901f089b3fc4604c6cd3835841188cfb479ca82ead04',
              'index-restoration-premarker': None,
              'sim-preauth': None,
          }
          found = None
          for node in module.body:
              if isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name) and node.target.id == 'EXPECTED_STAGING':
                  found = ast.literal_eval(node.value)
          assert found == expected
          PY
      - name: Prove exact implementation-only net delta
        run: |
          set -euo pipefail
          files="$(git diff --name-only 3395e0db1f3f2bd5e3e89fc26e4b5ba4ffeede0d..170a4af97ac1e32036aa1133fa97431f5d3c8927)"
          test "$files" = "scripts/Repair-PrinterV1-PostDTW100-OrdinaryStagingResidue.py"
          git diff --check 3395e0db1f3f2bd5e3e89fc26e4b5ba4ffeede0d..170a4af97ac1e32036aa1133fa97431f5d3c8927
