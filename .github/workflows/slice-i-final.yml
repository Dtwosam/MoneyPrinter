name: Slice I final verification

on:
  pull_request:
    branches: [v2-9-8b-i-final-ci-base]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - name: Focused Slice I proof
        run: |
          PYTHONPATH=src python -m pytest -q \
            tests/test_v2_9_8b_slice_i_corrective.py \
            tests/test_v2_9_8b_slice_i_selected_slot_holder.py \
            tests/test_v2_9_7e_19_holder_evidence_clean_memory_repair.py \
            tests/test_v2_9_7e_48_holder_condition_memory_quality_separation.py \
            tests/test_v2_9_7d_7b_4d_combined_discovery_executor.py \
            tests/test_v2_9_8b_h_continuation_cutoff.py
      - name: Structural checks
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/authoritative_live_operational_campaign.py \
            src/printer_v1/operator_cli/later_cycle_graduated_supply.py \
            src/printer_v1/discovery/combined_executor.py
          git diff --check f5bafa39405e214484d2064bf593cc9ad58b46c8..HEAD
          PYTHONPATH=src python - <<'PY'
          from printer_v1.db.migrate import canonical_migration_names
          from printer_v1.operator_cli.holder_reliability_budget_control import (
              OPERATION_CEILING,
              HOLDER_WORST_CASE_TRANSPORT_OPERATIONS,
              PERMANENT_HOLDER_STAGE_TRANSPORT_CEILING,
          )
          names = list(canonical_migration_names())
          assert len(names) == 58, len(names)
          assert names[-1].startswith('058'), names[-1]
          assert OPERATION_CEILING == 45
          assert HOLDER_WORST_CASE_TRANSPORT_OPERATIONS == 5
          assert PERMANENT_HOLDER_STAGE_TRANSPORT_CEILING == 8
          PY
