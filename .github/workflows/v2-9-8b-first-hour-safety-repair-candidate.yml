name: V2-9.8B first-hour safety repair candidate

on:
  push:
    branches:
      - agent/v2-9-8b-first-hour-safety-repair-candidate

permissions:
  contents: write

jobs:
  apply-and-prove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: agent/v2-9-8b-first-hour-safety-repair-candidate
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact scoped repair
        run: python scripts/apply_v2_9_8b_first_hour_safety_repair_candidate.py

      - name: Compile touched modules
        run: >-
          python -m compileall -q
          src/printer_v1/operator_cli/first_hour_safety_binding.py
          src/printer_v1/operator_cli/one_command_15m_factory.py
          src/printer_v1/operator_cli/one_token_4h_runtime.py
          src/printer_v1/operator_cli/operational_standard_4h.py
          src/printer_v1/sources/measured_transport.py

      - name: Run focused bounded offline proof
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover -s tests
          -p 'test_v2_9_8b_first_hour_safety_provenance_repair.py' -v

      - name: Publish only proven repair
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/apply_v2_9_8b_first_hour_safety_repair_candidate.py
          git rm .github/workflows/v2-9-8b-first-hour-safety-repair-candidate.yml
          git add \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            src/printer_v1/operator_cli/operational_standard_4h.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement and prove first-hour safety provenance repair'
          git push origin HEAD:agent/v2-9-8b-first-hour-safety-repair-candidate
