name: V2-9.8B post-DTW100 standard four-hour integration proof

on:
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact head and compile
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python -m py_compile \
            src/printer_v1/scheduler/token_local_continuation.py \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            src/printer_v1/operator_cli/one_token_4h_runtime.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_campaign_handoff.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_collection_state_accounting.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_close_memory_terminal_reconciliation.py
      - name: Run standard-four-hour integration contract
        run: |
          python -m unittest -v \
            tests.test_post_dtw100_first_hour_lifecycle_policy \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_policy_capacity \
            tests.test_v2_9_7d_4a_token_local_selective_continuation \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_campaign_handoff \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_collection_state_accounting \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_close_memory_terminal_reconciliation \
            tests.test_v2_9_8b_post_dtw100_checkpoint4_1h_close_boundary \
            tests.test_v2_9_8b_post_dtw100_checkpoint5_1h_memory_construction \
            tests.test_v2_9_8b_operational_selective_1h \
            tests.test_v2_8_1_one_token_4h_runtime
      - name: Prove derived ceilings no later windows and capability locks
        run: |
          python - <<'PY'
          from printer_v1.operator_cli.one_token_4h_runtime import (
              runtime_budget,
              standard_two_token_lifecycle_budget,
          )
          from printer_v1.snapshots.cadence_policy import get_policy
          from tests.test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning import (
              StandardFourHourCampaignPlanningTests,
          )

          expected = {
              ('TRACK_FAST', 'TRACK_FAST'): (230, 210),
              ('TRACK_FAST', 'TRACK_NORMAL'): (182, 162),
              ('TRACK_NORMAL', 'TRACK_NORMAL'): (134, 114),
          }
          for lanes, ceilings in expected.items():
              budget = standard_two_token_lifecycle_budget(lanes)
              assert budget['request_ceiling'] == ceilings[0], (lanes, budget)
              assert budget['scheduler_ceiling'] == ceilings[1], (lanes, budget)
              assert budget['automatic_retries'] == 0
              assert budget['endpoint_rotation'] is False
              assert budget['real_collection_enabled'] is False

          helper = StandardFourHourCampaignPlanningTests()
          fx, candidates = helper._prepared()
          try:
              result = helper._plan(fx, candidates)
              assert result['planned'] is True
              assert result['planned_jobs'] == 92
              later = fx.connection.execute(
                  """SELECT COUNT(*) FROM printer_memory_factory_campaign_windows
                     WHERE campaign_id='campaign-1h' AND run_id='run-1h'
                       AND cycle_id='cycle-1h'
                       AND window_kind IN ('WINDOW_12H','WINDOW_24H')"""
              ).fetchone()[0]
              assert int(later) == 0
          finally:
              fx.close()

          for lane in ('TRACK_FAST', 'TRACK_NORMAL'):
              assert runtime_budget(lane)['enabled_for_real_collection'] is False
              assert get_policy('WINDOW_4H', lane).enabled_for_real_collection is False
          for window in ('WINDOW_12H', 'WINDOW_24H'):
              for lane in ('TRACK_FAST', 'TRACK_NORMAL'):
                  assert get_policy(window, lane).enabled_for_real_collection is False
          PY
          git diff --check
