name: Printer V1 standard 4h eligible-subset apply

on:
  pull_request:
    branches:
      - agent/v2-9-8b-post-dtw100-standard-four-hour-eligible-subset-apply-base

permissions:
  contents: write

jobs:
  apply-and-green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout disposable apply base
        uses: actions/checkout@v4
        with:
          ref: agent/v2-9-8b-post-dtw100-standard-four-hour-eligible-subset-apply-base
          fetch-depth: 0

      - name: Preserve patcher and checkout exact durable RED head
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/apply_standard_four_hour_eligible_subset_patch.py /tmp/apply_subset_patch.py
          git checkout --detach d14e5e557e4a9f69366c41bdd4a45b25a5caea90
          test "$(git rev-parse HEAD)" = "d14e5e557e4a9f69366c41bdd4a45b25a5caea90"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply approved three-file patch
        run: python /tmp/apply_subset_patch.py

      - name: Assert production-only patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/actual-files.txt
          printf '%s\n' \
            src/printer_v1/operator_cli/campaign_ownership.py \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            src/printer_v1/operator_cli/one_token_4h_runtime.py \
            | sort > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Install project
        run: python -m pip install -e .

      - name: Compile directly affected modules
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/campaign_ownership.py \
            src/printer_v1/operator_cli/one_token_4h_runtime.py \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_eligible_subset.py

      - name: Run directly affected GREEN suite
        run: |
          python -m unittest -v \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_eligible_subset \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_campaign_handoff \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_policy_capacity \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_collection_state_accounting \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_close_memory_terminal_reconciliation \
            tests.test_v2_9_7d_4a_token_local_selective_continuation

      - name: Assert capability locks
        run: |
          python - <<'PY'
          from printer_v1.operator_cli.one_token_4h_runtime import runtime_budget
          from printer_v1.snapshots.cadence_policy import get_policy

          for lane in ("TRACK_FAST", "TRACK_NORMAL"):
              assert runtime_budget(lane)["enabled_for_real_collection"] is False
              for window_kind in ("WINDOW_4H", "WINDOW_12H", "WINDOW_24H"):
                  policy = get_policy(window_kind, lane)
                  assert policy is not None
                  assert policy.enabled_for_real_collection is False
          PY
          git diff --check

      - name: Create production-only candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Printer V1 TDD Runner"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/printer_v1/operator_cli/campaign_ownership.py \
            src/printer_v1/operator_cli/one_token_4h_runtime.py \
            src/printer_v1/operator_cli/one_command_15m_factory.py
          git commit -m "Repair standard four-hour eligible subset composition"
          git push --force origin HEAD:refs/heads/agent/v2-9-8b-post-dtw100-standard-four-hour-eligible-subset-candidate
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
