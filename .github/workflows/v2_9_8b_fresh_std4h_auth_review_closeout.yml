name: V2-9.8B fresh Standard-4H authorization review closeout

on:
  push:
    branches:
      - governance/v2-9-8b-fresh-std4h-authorization-review-closeout

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify baseline ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ba75c76b16cf1b5a2b44ec27822733e161b10abc HEAD

      - name: Apply governance closeout
        run: |
          set -euo pipefail
          python tools/_tmp_v2_9_8b_fresh_std4h_auth_review_closeout.py
          git rm -f tools/_tmp_v2_9_8b_fresh_std4h_auth_review_closeout.py
          git rm -f .github/workflows/v2_9_8b_fresh_std4h_auth_review_closeout.yml
          git add AGENTS.md CURRENT_HANDOFF.md docs/printer-v1-v2-9-8b-fresh-exact-head-exact-db-standard-4h-authorization-preparation-independent-review-closeout.md

      - name: Verify exact net scope
        run: |
          set -euo pipefail
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only ba75c76b16cf1b5a2b44ec27822733e161b10abc -- | sort)
          expected=(
            AGENTS.md
            CURRENT_HANDOFF.md
            docs/printer-v1-v2-9-8b-fresh-exact-head-exact-db-standard-4h-authorization-preparation-independent-review-closeout.md
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Commit governance closeout
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Governance CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Close fresh Standard-4H authorization preparation review"
          git push origin HEAD:governance/v2-9-8b-fresh-std4h-authorization-review-closeout
