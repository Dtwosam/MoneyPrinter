name: V2-9.8B cooperative later-cycle repair proof

on:
  push:
    branches:
      - agent/v2-9-8b-cooperative-later-cycle-repair

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Printer package
        run: python -m pip install -e .
      - name: Run focused cooperative later-cycle repair proof
        run: python -m unittest discover -s tests -p 'test_v2_9_8b_cooperative_later_cycle_repair.py' -v
