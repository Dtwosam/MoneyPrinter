name: Cycle2 pre4h budget scope proof

on:
  push:
    branches:
      - agent/tmp-cycle2-pre4h-budget-scope-proof

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - name: Run focused RED proof
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: timeout 90s python -m pytest -q tests/test_v2_9_8b_multicycle_pre4h_budget_scope.py
