name: V2-9.8B migration063 schema RED

on:
  push:
    branches:
      - assistant/red-v2-9-8b-migration063-schema-gate

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Prove current schema contract is stale
        run: |
          python -m pytest -q \
            tests/test_v2_9_8b_post_lane4_schema_gate_coherence.py \
            tests/test_v2_9_8b_pre_lifecycle_schema_gate_coherence.py \
            tests/test_v2_9_8b_pre_authorization_migration_ledger_drift_guard.py \
            tests/test_v2_9_8b_four_token_proof_zero_state_gate.py
