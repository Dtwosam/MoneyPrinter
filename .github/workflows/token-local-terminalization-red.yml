name: token-local-terminalization-red
on:
  push:
    branches:
      - repair/v2-9-8b-token-local-terminalization
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project test dependencies
        run: python -m pip install -e '.[test]'
      - name: Prove expected RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_v2_9_8b_token_local_15m_terminalization_repair.py > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo 'RED proof unexpectedly passed before implementation'
            exit 1
          fi
          grep -q '_terminalize_owned_15m_token_failure' /tmp/red.log
          echo 'EXPECTED_RED_PROVEN'
