name: DTW-61 Fixture Repair 2

on:
  pull_request:
    branches:
      - tmp/dtw61-red-orchestration
    types: [opened]

permissions:
  contents: write

env:
  TARGET_BRANCH: agent/v2-9-8b-window-15m-checkpoint-8-dtw61-identity-presence-red
  EXPECTED_HEAD: d529c830d63fae6a4d49b1e3aa1af83a705e91e0
  BASE_FIXTURE: tests/test_v2_9_8b_window_15m_checkpoint8_dtw57_durable_reconstruction_red.py
  RED_TEST: tests/test_v2_9_8b_window_15m_checkpoint8_dtw61_required_identity_presence_red.py

jobs:
  repair-test-fixture:
    if: github.event.pull_request.head.ref == 'tmp/dtw61-fixture-fix2-trigger'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout orchestration helper
        uses: actions/checkout@v4
        with:
          ref: tmp/dtw61-red-orchestration
          path: orchestration
          fetch-depth: 1

      - name: Checkout target RED branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: target
          fetch-depth: 5

      - name: Verify exact target head and apply test-only patch
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python "$GITHUB_WORKSPACE/orchestration/.github/dtw61_fixture_fix.py"

      - name: Verify test-only scope and compile
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          FILES="$(git diff --name-only)"
          test "$(printf '%s\n' "$FILES" | sort)" = "$(printf '%s\n%s\n' "$BASE_FIXTURE" "$RED_TEST" | sort)"
          test -z "$(git diff --name-only -- src scripts)"
          git diff --check
          python -m py_compile "$BASE_FIXTURE" "$RED_TEST"

      - name: Commit corrected RED fixture
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BASE_FIXTURE" "$RED_TEST"
          git commit -m "Repair DTW-61 terminal report fixture construction"
          git push origin "HEAD:$TARGET_BRANCH"
