name: Printer V1 standard 4h Slice C baseline proof

on:
  pull_request:
    branches:
      - agent/v2-9-8b-post-dtw100-standard-four-hour-activation-slice-c-baseline-proof-base

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5430a48a1f683b6182b4664023dc6b1f21ead26e
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Current first-hour close contract
        run: python -m unittest -v tests.test_v2_9_8b_post_dtw100_checkpoint4_1h_close_boundary
      - name: Current token-local continuation contract
        run: python -m unittest -v tests.test_v2_9_7d_4a_token_local_selective_continuation
      - name: Historical one-token 4h baseline
        continue-on-error: true
        run: python -m unittest -v tests.test_v2_8_1_one_token_4h_runtime
      - name: Record cadence state
        run: |
          python - <<'PY'
          from printer_v1.operator_cli.one_token_4h_runtime import runtime_budget
          for lane in ('TRACK_FAST','TRACK_NORMAL'):
              print(lane, runtime_budget(lane)['enabled_for_real_collection'])
          PY
