name: Temporary PR191 exception compatibility proof
on:
  push:
    branches:
      - agent/v2-9-8b-cycle2-historical-proof-carrier-provenance-repair
jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - name: Compatibility regression
        run: >-
          python -m pytest -q
          tests/test_v2_9_8b_cycle2_historical_proof_carrier_repair.py
      - name: Compile production modules
        run: >-
          python -m py_compile
          src/printer_v1/operator_cli/graduated_supply_front_door.py
          src/printer_v1/operator_cli/_graduated_supply_front_door_base.py
          src/printer_v1/scheduler/scheduler.py
          src/printer_v1/scheduler/_scheduler_base.py
      - name: Diff hygiene
        run: git diff --check HEAD^1 HEAD
