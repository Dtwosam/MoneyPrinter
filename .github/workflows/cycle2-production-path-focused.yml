name: Cycle-2 production-path focused verification

on:
  push:
    branches:
      - agent/v2-9-8b-cycle2-frozen-lane-atomic-claim-proof

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - name: Compile Cycle-2 production owners
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/authoritative_live_operational_campaign.py \
            src/printer_v1/operator_cli/pre_admission_discovery_attempt.py \
            src/printer_v1/operator_cli/multi_cycle_campaign_coordinator.py \
            src/printer_v1/discovery/pre_admission_materialization.py \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            src/printer_v1/operator_cli/cadence_authority.py
      - name: Run focused Cycle-2 production path
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest -q \
            tests/test_v2_9_8b_pre_admission_later_cycle_callback.py \
            tests/test_v2_9_8b_pre_admission_atomic_cycle2_consumption.py \
            tests/test_v2_9_8b_callback_consume_materialize_integration.py \
            tests/test_v2_9_8b_four_token_gate_d_factory_boundary.py \
            tests/test_v2_9_8b_cadence_authority_final_corrective.py \
            tests/test_v2_9_8b_four_token_factory_wake_ordering.py \
            tests/test_v2_9_8b_4_2_2_orchestration_correctness.py
