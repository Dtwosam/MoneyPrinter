name: V2-9.8B exact residue disposable proof
on:
  push:
    branches:
      - review/v2-9-8b-interrupted-four-token-exact-residue-ci
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install pytest
          python -m pip install -e .
      - name: Exact disposable proof
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/src" python -m pytest -q \
            tests/test_v2_9_8b_interrupted_four_token_704f53472011_residue_reconciliation.py \
            tests/test_v2_9_8b_interrupted_cycle2_parent_interrupt_cleanup.py \
            tests/test_v2_9_8b_interrupted_four_token_followup_repair.py \
            tests/test_v2_9_8b_pre_admission_terminal_cleanup_repair.py \
            tests/test_v2_9_8b_shared_terminal_pre_lifecycle_zero_attempt.py
          PYTHONPATH="$PWD/src" python -m py_compile \
            src/printer_v1/operator_cli/interrupted_four_token_704f53472011_residue_reconciliation.py
          git diff --check
