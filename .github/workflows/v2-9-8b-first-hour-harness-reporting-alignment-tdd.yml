name: V2-9.8B first-hour harness reporting alignment TDD

on:
  pull_request:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile focused owners
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/operational_selective_1h.py \
            src/printer_v1/operator_cli/e2z_clean_memory_creation.py \
            src/printer_v1/memory/clean_object_promotion.py \
            tests/test_v2_9_8b_standard_first_hour_harness_reporting_alignment.py
      - name: Focused first-hour harness reporting proof
        run: |
          python -m unittest -v tests.test_v2_9_8b_standard_first_hour_harness_reporting_alignment
