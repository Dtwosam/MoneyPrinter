name: Multicycle standard4h reporting budget

on:
  push:
    branches:
      - agent/tmp-multicycle-standard4h-reporting-budget

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - name: Focused reporting budget proof
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: timeout 90s python -m pytest -q tests/test_v2_9_8b_multicycle_standard4h_reporting_budget.py
