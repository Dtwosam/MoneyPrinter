name: Checkpoint 8 blocked repair offline commit

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  checkpoint8-offline-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Reuse proven A/B patch generator
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/checkpoint8-blocked-repair-offline-ci-v2.yml').read_text()
          marker = "      - name: Apply proof-only A/B repair if absent\n        run: |\n          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          patch_program = textwrap.dedent(workflow[start:end])
          exec(compile(patch_program, '<checkpoint8-offline-ab-patch>', 'exec'), {})
          PY
      - name: Compile proof harness
        run: python -m py_compile scripts/v2_9_8b_checkpoint8_controlling_public_composition_proof.py
      - name: Run blocked-proof repair tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest -q tests/test_v2_9_8b_window_15m_checkpoint8_blocked_proof_repair.py
      - name: Run focused Checkpoint 8 regression gate
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest -q tests/test_v2_9_8b_window_15m_checkpoint8_*.py
      - name: Verify offline-only workflow and diff
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/checkpoint8-blocked-repair-offline-commit.yml').read_text()
          harness_command = "python " + "scripts/v2_9_8b_checkpoint8_controlling_" + "public_composition_proof.py"
          proof_flag = "--" + "proof-root"
          assert harness_command not in workflow
          assert proof_flag not in workflow
          print('CHECKPOINT8_BLOCKED_REPAIR_OFFLINE_NO_PROOF_GUARD_PASS')
          PY
          git diff --check
      - name: Commit proven proof-only repair
        run: |
          if git diff --quiet -- scripts/v2_9_8b_checkpoint8_controlling_public_composition_proof.py; then
            echo "CHECKPOINT8_BLOCKED_REPAIR_AB_NO_NEW_DIFF"
            exit 0
          fi
          git config user.name "Checkpoint 8 Offline Repair"
          git config user.email "checkpoint8-offline-repair@example.invalid"
          git add scripts/v2_9_8b_checkpoint8_controlling_public_composition_proof.py
          git commit -m "Repair Checkpoint 8 migration fixture and terminal identity"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
