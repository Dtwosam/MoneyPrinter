name: assistant-continuation-owner-fix

on:
  push:

permissions:
  contents: write

env:
  PYTHONPATH: src

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Write focused RED tests
        run: python .github/assistant_continuation_owner_fix.py tests
      - name: Prove behavioral RED
        shell: bash
        run: |
          mkdir -p proof-logs
          set +e
          python -m pytest -q tests/test_v2_9_8b_continuation_owner_truth.py > proof-logs/red-continuation.log 2>&1
          status=$?
          set -e
          cat proof-logs/red-continuation.log
          if [ "$status" -eq 0 ]; then
            echo "RED phase unexpectedly passed"
            exit 1
          fi
      - name: Apply narrow production patch
        run: python .github/assistant_continuation_owner_fix.py patch
      - name: GREEN focused verification
        shell: bash
        run: |
          set +e
          failed=0
          python -m pytest -q tests/test_v2_9_8b_continuation_owner_truth.py > proof-logs/green-continuation.log 2>&1 || failed=1
          python -m pytest -q tests/test_v2_9_8b_refresh_coverage_carry.py > proof-logs/green-refresh.log 2>&1 || failed=1
          python -m pytest -q tests/test_v2_9_8b_freeze_ready_wiring_completion.py > proof-logs/green-wiring.log 2>&1 || failed=1
          python -m pytest -q tests/test_v2_9_8b_freeze_ready_candidate_supply_reliability.py > proof-logs/green-reliability.log 2>&1 || failed=1
          python -m py_compile \
            src/printer_v1/discovery/eligible_token_supply.py \
            src/printer_v1/discovery/pre_lifecycle_temporal_acquisition.py \
            src/printer_v1/operator_cli/pre_lifecycle_persistent_refresh_owner.py \
            src/printer_v1/operator_cli/authoritative_live_operational_campaign.py \
            tests/test_v2_9_8b_continuation_owner_truth.py > proof-logs/pycompile.log 2>&1 || failed=1
          git diff --check > proof-logs/diff-check.log 2>&1 || failed=1
          for f in proof-logs/*; do echo "===== $f ====="; cat "$f"; done
          exit "$failed"
      - name: Upload proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuation-owner-proof
          path: proof-logs/
      - name: Show diff
        run: git diff --stat && git diff
      - name: Commit verified patch
        shell: bash
        run: |
          rm .github/workflows/assistant-continuation-owner-fix.yml \
             .github/assistant_continuation_owner_fix.py
          git config user.name "ChatGPT Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Delegate pre-lifecycle runtime truth to temporal owner"
          git push origin HEAD:assistant/freeze-ready-candidate-supply
