name: V2-9.8B Baseline Suite

on:
  push:
    branches:
      - agent/v2-9-8b-baseline-suite-verification
  workflow_dispatch:

jobs:
  baseline-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact audited baseline
        uses: actions/checkout@v4
        with:
          ref: 1d0903c7ecb68dc9738f18ee0e5aafcca09c781e
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run full baseline suite
        run: python -m pytest -q
