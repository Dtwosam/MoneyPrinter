name: WINDOW_15M Checkpoint 2 push proof

on:
  push:
    branches:
      - agent/v2-9-8b-window-15m-checkpoint-2-preflight-initialization-harness

permissions:
  contents: write

jobs:
  checkpoint-2-push-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_SHA: 0deba3c06d72499899b9c21bf9e71c89d5c8057c
      STAGED_BRANCH: agent/v2-9-8b-window-15m-checkpoint-2-preflight-initialization-staged
      DIAGNOSTIC_BRANCH: agent/v2-9-8b-window-15m-checkpoint-2-preflight-initialization-diagnostics
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Native authenticated checkout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ./* ./.??* 2>/dev/null || true
          git clone --no-tags \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          git checkout "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Run exact offline Checkpoint 2 proof
        shell: bash
        run: |
          set +e
          set -o pipefail
          bash .ci/window15m_checkpoint2/run_proof.sh 2>&1 | tee /tmp/checkpoint2-proof.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            git reset --hard
            git clean -fd
            git checkout -B "$DIAGNOSTIC_BRANCH" "$GITHUB_SHA"
            mkdir -p operator-runs/checkpoint-2-ci-diagnostics
            {
              echo "exit_code=$code"
              echo "harness_sha=$GITHUB_SHA"
              echo "--- bounded last 500 lines ---"
              tail -n 500 /tmp/checkpoint2-proof.log
            } > operator-runs/checkpoint-2-ci-diagnostics/proof-failure.log
            git config user.name "ChatGPT Checkpoint CI"
            git config user.email "actions@users.noreply.github.com"
            git add operator-runs/checkpoint-2-ci-diagnostics/proof-failure.log
            git commit -m "Record Checkpoint 2 proof failure diagnostics"
            git push --force origin "$DIAGNOSTIC_BRANCH"
          fi
          exit "$code"
