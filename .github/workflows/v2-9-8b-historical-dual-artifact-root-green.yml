name: V2-9.8B historical dual-artifact-root GREEN

on:
  push:
    branches:
      - agent/v2-9-8b-historical-dual-artifact-root-repair-implementation

permissions:
  contents: write

jobs:
  focused-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approved repair
        run: python .github/scripts/apply_v2_9_8b_historical_dual_artifact_root_repair.py
      - run: python -m pip install -e . pytest
      - name: Focused GREEN
        shell: bash
        run: |
          python -m pytest -q \
            tests/test_v2_9_8b_historical_dual_artifact_root_repair.py \
            tests/test_v2_9_8b_historical_dual_artifact_root_sha_guard.py \
            tests/test_v2_9_8b_historical_four_token_reconciliation.py \
            tests/test_v2_9_8b_historical_discovery_batch_residue_repair.py \
            tests/test_v2_9_8b_historical_reconciliation_preflight_safety.py \
            tests/test_v2_9_8b_historical_disposable_lease_path_repair.py
          python -m py_compile src/printer_v1/operator_cli/operational_campaign_recovery.py
          git diff --check
      - name: Commit verified repair and remove temporary verifier
        shell: bash
        run: |
          rm .github/workflows/v2-9-8b-historical-dual-artifact-root-red.yml
          rm .github/workflows/v2-9-8b-historical-dual-artifact-root-green.yml
          rm .github/scripts/apply_v2_9_8b_historical_dual_artifact_root_repair.py
          git config user.name "Printer V1 Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/printer_v1/operator_cli/operational_campaign_recovery.py \
            tests/test_v2_9_8b_historical_four_token_reconciliation.py \
            tests/test_v2_9_8b_historical_dual_artifact_root_repair.py \
            tests/test_v2_9_8b_historical_dual_artifact_root_sha_guard.py \
            .github/workflows/v2-9-8b-historical-dual-artifact-root-red.yml \
            .github/workflows/v2-9-8b-historical-dual-artifact-root-green.yml \
            .github/scripts/apply_v2_9_8b_historical_dual_artifact_root_repair.py
          git diff --cached --check
          git commit -m "Repair historical dual artifact roots"
          git push origin HEAD:agent/v2-9-8b-historical-dual-artifact-root-repair-implementation
