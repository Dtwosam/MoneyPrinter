name: Printer V1 standard 4h rereadiness helper proof

on:
  pull_request:
    branches:
      - agent/v2-9-8b-post-dtw100-standard-four-hour-rereadiness-helper-proof-base

permissions:
  contents: read

jobs:
  helper-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ed396cd75a2d23accb95052cdbed00c51626170a
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile helper
        run: python -m py_compile scripts/Review-PrinterV1-PostDTW100-StandardFourHour-Rereadiness.py
      - name: Prove audit-only helper surface
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('scripts/Review-PrinterV1-PostDTW100-StandardFourHour-Rereadiness.py')
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text)
          imported_modules = set()
          imported_names = set()
          calls = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported_modules.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imported_modules.add(node.module or '')
                  imported_names.update(alias.name for alias in node.names)
              elif isinstance(node, ast.Call):
                  try:
                      calls.append(ast.unparse(node.func))
                  except Exception:
                      pass

          assert 'build_standard_four_hour_preflight' in text
          assert 'apply_authorization_once' not in imported_names
          assert 'run_standard_four_hour_campaign' not in imported_names
          assert 'printer_v1.operator_cli.standard_four_hour_one_shot_wrapper' not in imported_modules
          assert 'sqlite3' not in imported_modules
          assert 'urllib' not in imported_modules
          assert 'requests' not in imported_modules
          assert 'apply_authorization_once' not in calls
          assert 'run_standard_four_hour_campaign' not in calls
          assert 'source_calls": 0' in text
          assert 'scheduler_runtime_calls": 0' in text
          assert 'authoritative_database_writes": 0' in text
          assert 'authorization_created": False' in text
          assert 'printer_runtime_started": False' in text
          assert 'standard_four_hour_started": False' in text
          print('imports:', sorted(imported_modules))
          print('call count:', len(calls))
          PY
      - name: Prove helper is the only durable-branch delta from activation closeout
        run: |
          set -euo pipefail
          files="$(git diff --name-only ab97915704f0999c9d897b5c501acb363f7638bc..ed396cd75a2d23accb95052cdbed00c51626170a)"
          test "$files" = "scripts/Review-PrinterV1-PostDTW100-StandardFourHour-Rereadiness.py"
          git diff --check ab97915704f0999c9d897b5c501acb363f7638bc..ed396cd75a2d23accb95052cdbed00c51626170a
