name: DTW-81 apply scoped repair

on:
  push:
    branches:
      - agent/v2-9-8b-unknown-liquidity-backup-transport-ownership-repair-implementation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-9-8b-unknown-liquidity-backup-transport-ownership-repair-implementation
          fetch-depth: 0
      - name: Apply exact DTW-81 repair
        run: |
          python - <<'PY'
          from pathlib import Path

          availability_path = Path('src/printer_v1/discovery/permanent_discovery_availability.py')
          supply_path = Path('src/printer_v1/discovery/eligible_token_supply.py')

          availability = availability_path.read_text(encoding='utf-8')
          supply = supply_path.read_text(encoding='utf-8')

          helper_anchor = '''def run_bounded_unknown_liquidity_backup(\n'''
          if helper_anchor not in availability:
              raise SystemExit('DTW81_PATCH_BLOCKED: helper anchor missing')
          helper = '''def _seal_unknown_liquidity_backup_stage_evidence(\n    *,\n    ledger: Any,\n    stage_evidence_sink: Any | None,\n    campaign_id: str | None,\n    run_id: str | None,\n    cycle_id: str | None,\n    stage_sequence: int,\n    terminal_status: str,\n    first_terminal_cause: str | None,\n    sealed_at: str,\n    source_request_id: int,\n    source_request_coverage: Mapping[str, Any],\n    measurement_failed: bool,\n) -> dict[str, Any] | None:\n    \"\"\"Seal real backup transports into the campaign owner without invention.\"\"\"\n    if (\n        stage_evidence_sink is None\n        or measurement_failed\n        or int(getattr(ledger, \"source_transport_operations\", 0) or 0) == 0\n    ):\n        return None\n    if not all(str(value or \"\").strip() for value in (campaign_id, run_id, cycle_id)):\n        raise ValueError(\"UNKNOWN_LIQUIDITY_BACKUP_STAGE_REQUIRES_CAMPAIGN_RUN_CYCLE\")\n\n    from printer_v1.sources.campaign_six_unit_accounting import (\n        build_campaign_stage_id,\n        seal_campaign_stage_evidence,\n    )\n\n    sequence = int(stage_sequence)\n    sealed = seal_campaign_stage_evidence(\n        ledger=ledger,\n        stage_id=build_campaign_stage_id(\n            campaign_id=str(campaign_id),\n            run_id=str(run_id),\n            cycle_id=str(cycle_id),\n            stage_kind=\"UNKNOWN_LIQUIDITY_BACKUP\",\n            stage_sequence=sequence,\n        ),\n        stage_kind=\"UNKNOWN_LIQUIDITY_BACKUP\",\n        stage_sequence=sequence,\n        stage_terminal_status=str(terminal_status),\n        stage_first_terminal_cause=first_terminal_cause,\n        campaign_id=str(campaign_id),\n        run_id=str(run_id),\n        cycle_id=str(cycle_id),\n        sealed_at=sealed_at,\n    )\n    sealed = dict(sealed)\n    sealed[\"source_request_ids\"] = [int(source_request_id)]\n    sealed[\"source_request_coverage\"] = [dict(source_request_coverage)]\n    stage_evidence_sink(sealed)\n    return sealed\n\n\n'''
          if '_seal_unknown_liquidity_backup_stage_evidence(' in availability:
              raise SystemExit('DTW81_PATCH_BLOCKED: helper already present')
          availability = availability.replace(helper_anchor, helper + helper_anchor, 1)

          old_signature = '''    geckoterminal_transport_factory: Any | None = None,\n    max_backups: int | None = None,\n) -> dict[str, Any]:\n'''
          new_signature = '''    geckoterminal_transport_factory: Any | None = None,\n    transport_identity_observer: Any | None = None,\n    stage_evidence_sink: Any | None = None,\n    max_backups: int | None = None,\n) -> dict[str, Any]:\n'''
          if availability.count(old_signature) != 1:
              raise SystemExit('DTW81_PATCH_BLOCKED: signature shape mismatch')
          availability = availability.replace(old_signature, new_signature, 1)

          old_report = '''        \"source_request_coverage\": [],\n        \"source_requests\": 0,\n'''
          new_report = '''        \"source_request_coverage\": [],\n        \"sealed_stage_evidence_blocks\": [],\n        \"source_requests\": 0,\n'''
          if availability.count(old_report) < 1:
              raise SystemExit('DTW81_PATCH_BLOCKED: report shape missing')
          # Target the first occurrence after the backup function only.
          backup_start = availability.index('def run_bounded_unknown_liquidity_backup(')
          prefix, tail = availability[:backup_start], availability[backup_start:]
          if tail.count(old_report) < 1:
              raise SystemExit('DTW81_PATCH_BLOCKED: backup report shape missing')
          tail = tail.replace(old_report, new_report, 1)
          availability = prefix + tail

          old_ledger = '''        stage_ledger = MeasuredTransportLedger(\n            campaign_id=campaign_id,\n            run_id=run_id,\n            cycle_id=cycle_id,\n        )\n'''
          new_ledger = '''        stage_ledger = MeasuredTransportLedger(\n            campaign_id=campaign_id,\n            run_id=run_id,\n            cycle_id=cycle_id,\n            on_transport_recorded=transport_identity_observer,\n        )\n'''
          backup_start = availability.index('def run_bounded_unknown_liquidity_backup(')
          prefix, tail = availability[:backup_start], availability[backup_start:]
          if tail.count(old_ledger) != 1:
              raise SystemExit('DTW81_PATCH_BLOCKED: backup ledger shape mismatch')
          tail = tail.replace(old_ledger, new_ledger, 1)
          availability = prefix + tail

          old_outcome = '''        outcome_label = \"LIQUIDITY_UNKNOWN\"\n        liquidity_usd = None\n        quote_mint = str(cand.get(\"quote_mint\") or \"\")\n        venue = str(cand.get(\"venue\") or \"\")\n        base_mint = str(cand.get(\"base_mint\") or mint)\n        if shared_fail:\n            coverage[\"terminal_status\"] = \"BLOCKED\"\n            outcome_label = \"LIQUIDITY_UNKNOWN\"\n'''
          new_outcome = '''        if shared_fail:\n            coverage[\"terminal_status\"] = \"BLOCKED\"\n        sealed_stage = _seal_unknown_liquidity_backup_stage_evidence(\n            ledger=stage_ledger,\n            stage_evidence_sink=stage_evidence_sink,\n            campaign_id=campaign_id,\n            run_id=run_id,\n            cycle_id=cycle_id,\n            stage_sequence=attempted,\n            terminal_status=str(coverage[\"terminal_status\"]),\n            first_terminal_cause=(\n                str(result.failure_type or \"UNKNOWN_LIQUIDITY_BACKUP_SOURCE_UNAVAILABLE\")\n                if shared_fail\n                else None\n            ),\n            sealed_at=now,\n            source_request_id=rid,\n            source_request_coverage=coverage,\n            measurement_failed=measurement_failed,\n        )\n        if sealed_stage is not None:\n            report[\"sealed_stage_evidence_blocks\"].append(sealed_stage)\n\n        outcome_label = \"LIQUIDITY_UNKNOWN\"\n        liquidity_usd = None\n        quote_mint = str(cand.get(\"quote_mint\") or \"\")\n        venue = str(cand.get(\"venue\") or \"\")\n        base_mint = str(cand.get(\"base_mint\") or mint)\n        if shared_fail:\n            outcome_label = \"LIQUIDITY_UNKNOWN\"\n'''
          backup_start = availability.index('def run_bounded_unknown_liquidity_backup(')
          prefix, tail = availability[:backup_start], availability[backup_start:]
          if tail.count(old_outcome) != 1:
              raise SystemExit('DTW81_PATCH_BLOCKED: outcome insertion shape mismatch')
          tail = tail.replace(old_outcome, new_outcome, 1)
          availability = prefix + tail

          old_call = '''                    dexscreener_transport_factory=(\n                        dexscreener_batch_transport_factory\n                    ),\n                )\n'''
          new_call = '''                    dexscreener_transport_factory=(\n                        dexscreener_batch_transport_factory\n                    ),\n                    transport_identity_observer=transport_identity_observer,\n                    stage_evidence_sink=stage_evidence_sink,\n                )\n'''
          marker = 'liquidity_backup_report = run_bounded_unknown_liquidity_backup('
          call_start = supply.index(marker)
          prefix, tail = supply[:call_start], supply[call_start:]
          if tail.count(old_call) < 1:
              raise SystemExit('DTW81_PATCH_BLOCKED: supply call shape mismatch')
          tail = tail.replace(old_call, new_call, 1)
          supply = prefix + tail

          availability_path.write_text(availability, encoding='utf-8')
          supply_path.write_text(supply, encoding='utf-8')
          PY

          python -m py_compile \
            src/printer_v1/discovery/permanent_discovery_availability.py \
            src/printer_v1/discovery/eligible_token_supply.py

          git diff --check
          git diff -- src/printer_v1/discovery/permanent_discovery_availability.py src/printer_v1/discovery/eligible_token_supply.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/printer_v1/discovery/permanent_discovery_availability.py src/printer_v1/discovery/eligible_token_supply.py
          git rm .github/workflows/dtw81-apply-repair.yml
          git commit -m 'Repair unknown liquidity backup transport ownership'
          git push origin HEAD:agent/v2-9-8b-unknown-liquidity-backup-transport-ownership-repair-implementation
