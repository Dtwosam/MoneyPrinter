name: V2-9.8B operator review read-only verification

on:
  push:
    branches:
      - assistant/v2-9-8b-operator-review-readonly-lockout-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-review-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Run report read-only lockout regression
        run: |
          python -m pytest -q \
            tests/test_v2_9_8b_operator_review_readonly_lockout.py \
            tests/test_post_rc_lane_e2u_15m_cycle_closeout_report.py \
            tests/test_post_rc_lane_e2w_5m_linkage_report.py \
            tests/test_post_lane10_lane_v_clean_memory_retrieval_report.py \
            tests/test_post_rc_lane7_clean_memory_retrieval_report.py \
            tests/test_post_rc_lane8a_wait_avoid_no_action_review.py \
            tests/test_post_rc_lane8c_conservative_paper_decision_audit_review.py \
            tests/test_phase19_reporting_operator_review.py \
            tests/test_v2_9_7d_6b_6_final_campaign_report.py
      - name: Compile affected report modules
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/commands.py \
            src/printer_v1/operator_cli/e2u_15m_cycle_closeout_report.py \
            src/printer_v1/operator_cli/e2w_5m_linkage_report.py \
            src/printer_v1/operator_cli/lane_v_clean_memory_retrieval_report.py
      - name: Diff whitespace check
        run: git diff --check fdd774285d72af30c1b41fbb7d72aca320dfe809..HEAD
