name: V2-9.8B refresh evidence sequence repair

on:
  push:
    branches:
      - agent/v2-9-8b-persistent-multisource-fresh-acquisition-implementation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message || '', '[v2-9-8b-skip]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and prove refresh evidence sequence repair
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/v2_9_8b_fix_refresh_stage_sequences.py
          python -m pip install -q -e . pytest
          python -m compileall -q src/printer_v1
          PYTHONPATH=src python -m pytest -q tests/test_v2_9_8b_persistent_multisource_refresh.py tests/test_v2_9_8b_persistent_refresh_owner_proof.py
          git diff --check
          git config user.name "Printer V1 Implementation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/printer_v1/discovery/permanent_discovery_availability.py src/printer_v1/operator_cli/graduated_supply_front_door.py src/printer_v1/discovery/pre_lifecycle_refresh_composition.py tests/test_v2_9_8b_persistent_multisource_refresh.py
          git commit -m "V2-9.8B separate delayed refresh evidence sequences [v2-9-8b-skip]"
          git push origin HEAD:agent/v2-9-8b-persistent-multisource-fresh-acquisition-implementation
