name: V2-9.8B closeout regression sweep

on:
  push:
    branches:
      - agent/v2-9-8b-persistent-multisource-fresh-acquisition-implementation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -e . pytest
          python -m compileall -q src/printer_v1
          PYTHONPATH=src python -m pytest -q \
            --ignore=tests/test_v2_9_8b_window_15m_final_integrated_readiness_repair.py
          git diff --check
