name: V2-9.8B persistent acquisition bounded proof

on:
  push:
    branches:
      - agent/v2-9-8b-persistent-multisource-fresh-acquisition-implementation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run fixture-only proof
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src/printer_v1
          python -m pip install -q pytest
          PYTHONPATH=src python -m pytest -q \
            tests/test_v2_9_8b_persistent_multisource_refresh.py \
            tests/test_v2_9_8b_persistent_refresh_owner_proof.py
          git diff --check
