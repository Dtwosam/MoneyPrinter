name: Cycle-2 opening atomicity proof

on:
  push:
    branches:
      - agent/tmp-cycle2-opening-atomicity-proof

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - name: Compile affected owners
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/campaign_ownership.py \
            src/printer_v1/operator_cli/operational_selective_1h.py \
            src/printer_v1/operator_cli/one_command_15m_factory.py
      - name: Run opening and ownership regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest -q \
            tests/test_v2_9_8b_cycle2_opening_atomicity.py \
            tests/test_v2_9_7d_6b_1_campaign_ownership_schema.py \
            tests/test_v2_9_8b_operational_selective_1h.py \
            tests/test_v2_9_8b_campaign_scheduler_ownership_schema_migration.py \
            tests/test_v2_9_8b_four_token_factory_wake_ordering.py \
            -k "opening_atomicity or campaign_ownership or precreate or scheduler_ownership or time_shifted_pair_ready"
