name: Cycle-2 opening atomicity proof

on:
  push:
    branches:
      - agent/tmp-cycle2-opening-atomicity-proof

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - name: Run Cycle-2 opening atomicity proof
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest -q tests/test_v2_9_8b_cycle2_opening_atomicity.py
