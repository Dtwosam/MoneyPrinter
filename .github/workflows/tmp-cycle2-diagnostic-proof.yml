name: Temporary Cycle2 diagnostic proof
on:
  pull_request:
    branches:
      - agent/tmp-cycle2-diagnostic-proof-base
jobs:
  focused-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_v2_9_8b_cycle2_diagnostic_context_durability.py
