name: Temporary Cycle2 diagnostic proof
on:
  pull_request:
    branches:
      - agent/tmp-cycle2-diagnostic-proof-base
jobs:
  focused-proof:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - name: Compile changed production modules
        run: >-
          python -m py_compile
          src/printer_v1/scheduler/scheduler.py
          src/printer_v1/scheduler/_scheduler_base.py
          src/printer_v1/operator_cli/graduated_supply_front_door.py
      - name: Focused regression proof
        run: >-
          python -m pytest -q
          tests/test_v2_9_8b_cycle2_diagnostic_context_durability.py
          tests/test_v2_9_8b_cycle2_historical_proof_carrier_repair.py
      - name: Scheduler compatibility proof
        run: >-
          python -m pytest -q
          tests/test_phase3_scheduler_resource_governor.py
      - name: Diff hygiene
        run: git diff --check HEAD^1 HEAD
