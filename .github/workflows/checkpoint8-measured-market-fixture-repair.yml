name: Checkpoint 8 Measured Market Fixture Repair

on:
  pull_request:
    branches:
      - agent/v2-9-8b-window-15m-checkpoint-8-measured-market-fixture-audit-repair
    types: [opened, synchronize]

permissions:
  contents: write

env:
  REPAIR_BRANCH: agent/v2-9-8b-window-15m-checkpoint-8-measured-market-fixture-audit-repair
  EXPECTED_DESIGN_HEAD: e1c29324c923e4c5d2391a8e39b5ce51c4022886

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact repair design HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REPAIR_BRANCH }}
          fetch-depth: 2

      - name: Verify repair baseline
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_DESIGN_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Printer V1 and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Apply exact measured-market fixture repair
        run: |
          python - <<'PY'
          from pathlib import Path

          harness_path = Path('scripts/v2_9_8b_checkpoint8_controlling_public_composition_proof.py')
          text = harness_path.read_text(encoding='utf-8')

          helper_anchor = '''def _checkpoint8_market_candidate(candidate: dict[str, Any]) -> dict[str, Any]:\n    return {\n        **candidate,\n        "pool": str(candidate.get("pumpswap_pool") or candidate.get("pool") or ""),\n    }\n\n\n'''
          helper_addition = helper_anchor + '''def _checkpoint8_measured_market_payload(\n    payload: dict[str, Any],\n    *,\n    stage: str,\n    source_name: str,\n    governed_request_kind: str,\n    method_or_endpoint: str,\n    target_category: str,\n    target_identity: str | None,\n) -> dict[str, Any]:\n    """Attach exactly one real-consumer measured identity to one fixture call."""\n    response_bytes = int(payload.get("response_bytes") or 0)\n    normalized_rows = int(payload.get("normalized_rows") or 0)\n    identity = build_transport_identity(\n        stage=stage,\n        source_name=source_name,\n        endpoint_owner=source_name,\n        governed_request_kind=governed_request_kind,\n        method_or_endpoint=method_or_endpoint,\n        within_request_ordinal=1,\n        target_category=target_category,\n        target_identity=target_identity,\n        response_bytes=response_bytes,\n        normalized_rows=normalized_rows,\n    )\n    return {\n        **payload,\n        **measured_payload_fields(\n            (identity,),\n            response_bytes=response_bytes,\n            normalized_rows=normalized_rows,\n        ),\n    }\n\n\n'''
          if text.count(helper_anchor) != 1:
              raise SystemExit(f'helper anchor count={text.count(helper_anchor)}')
          text = text.replace(helper_anchor, helper_addition, 1)

          old = '''        if self.route == "graduated_supply.locator_transport":\n            context = args[0] if args else kwargs.get("context")\n            del context\n            return _checkpoint8_dex_payload(candidates)\n\n'''
          new = '''        if self.route == "graduated_supply.locator_transport":\n            context = args[0] if args else kwargs.get("context")\n            del context\n            return _checkpoint8_measured_market_payload(\n                _checkpoint8_dex_payload(candidates),\n                stage="DEXSCREENER_DISCOVERY",\n                source_name="dexscreener",\n                governed_request_kind="dexscreener_fresh_profiles",\n                method_or_endpoint="GET /token-profiles/latest/v1",\n                target_category="network",\n                target_identity="solana",\n            )\n\n'''
          if text.count(old) != 1:
              raise SystemExit(f'locator anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        if self.route == "graduated_supply.dexscreener_batch_transport_factory":\n            requested = tuple(str(item) for item in (args[0] if args else kwargs.get("token_mints") or ()))\n            chosen = tuple(row for row in candidates if row["mint"] in requested)\n            return self._nested_transport(\n                lambda _context, chosen=chosen: _checkpoint8_dex_payload(chosen)\n            )\n\n'''
          new = '''        if self.route == "graduated_supply.dexscreener_batch_transport_factory":\n            requested = tuple(str(item) for item in (args[0] if args else kwargs.get("token_mints") or ()))\n            chosen = tuple(row for row in candidates if row["mint"] in requested)\n            target_identity = ",".join(sorted(requested))\n            return self._nested_transport(\n                lambda _context, chosen=chosen, target_identity=target_identity: (\n                    _checkpoint8_measured_market_payload(\n                        _checkpoint8_dex_payload(chosen),\n                        stage="MINT_MARKET_BATCH",\n                        source_name="dexscreener",\n                        governed_request_kind="candidate_market_batch",\n                        method_or_endpoint="GET /tokens/v1/solana/{mint_batch}",\n                        target_category="mint_batch",\n                        target_identity=target_identity,\n                    )\n                )\n            )\n\n'''
          if text.count(old) != 1:
              raise SystemExit(f'dex batch anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        if self.route == "graduated_supply.geckoterminal_nomination_transport":\n            context = args[0] if args else kwargs.get("context")\n            del context\n            return _checkpoint8_gecko_list_payload(candidates)\n\n'''
          new = '''        if self.route == "graduated_supply.geckoterminal_nomination_transport":\n            context = args[0] if args else kwargs.get("context")\n            del context\n            return _checkpoint8_measured_market_payload(\n                _checkpoint8_gecko_list_payload(candidates),\n                stage="FRESH_POOL_NOMINATION",\n                source_name="geckoterminal",\n                governed_request_kind="geckoterminal_new_pool_discovery",\n                method_or_endpoint="GET /api/v2/networks/solana/new_pools",\n                target_category="network",\n                target_identity="solana",\n            )\n\n'''
          if text.count(old) != 1:
              raise SystemExit(f'gecko nomination anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        if self.route == "graduated_supply.geckoterminal_reconciliation_transport_factory":\n            mint = str(args[0] if args else kwargs.get("token_mint") or "")\n            candidate = _checkpoint8_candidate_for_mint(mint)\n            chosen = () if candidate is None else (candidate,)\n            return self._nested_transport(\n                lambda _context, chosen=chosen: _checkpoint8_gecko_list_payload(chosen)\n            )\n\n'''
          new = '''        if self.route == "graduated_supply.geckoterminal_reconciliation_transport_factory":\n            mint = str(args[0] if args else kwargs.get("token_mint") or "")\n            candidate = _checkpoint8_candidate_for_mint(mint)\n            chosen = () if candidate is None else (candidate,)\n            return self._nested_transport(\n                lambda _context, chosen=chosen, mint=mint: (\n                    _checkpoint8_measured_market_payload(\n                        _checkpoint8_gecko_list_payload(chosen),\n                        stage="MINT_MARKET_BATCH",\n                        source_name="geckoterminal",\n                        governed_request_kind="candidate_market_batch",\n                        method_or_endpoint="GET /api/v2/networks/solana/tokens/{mint}/pools",\n                        target_category="token_mint",\n                        target_identity=mint,\n                    )\n                )\n            )\n\n'''
          if text.count(old) != 1:
              raise SystemExit(f'gecko recon anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          harness_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_v2_9_8b_window_15m_checkpoint8_real_consumer_compatibility.py')
          text = test_path.read_text(encoding='utf-8')

          old = '''from printer_v1.operator_cli.graduated_supply_front_door import (\n    OPERATIONAL_GRADUATED_SUPPLY_KWARGS,\n)\n'''
          new = '''from printer_v1.operator_cli.graduated_supply_front_door import (\n    OPERATIONAL_GRADUATED_SUPPLY_KWARGS,\n    run_fresh_profile_locator,\n)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'front door import anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = 'from printer_v1.sources.pumpswap import build_pumpswap_adapter\n'
          new = '''from printer_v1.sources.dexscreener import build_dexscreener_adapter\nfrom printer_v1.sources.geckoterminal import build_geckoterminal_adapter\nfrom printer_v1.sources.measured_transport import identities_from_payload\nfrom printer_v1.sources.pumpswap import build_pumpswap_adapter\n'''
          if text.count(old) != 1:
              raise SystemExit(f'source import anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          addition = r'''


def test_checkpoint8_measured_market_fixture_routes_preserve_one_identity_through_adapters(
    tmp_path: Path,
) -> None:
    harness = _load_harness("checkpoint8_measured_market_fixture_routes")
    prepared = _prepared(harness, tmp_path)
    materialized = proof.materialize_disposable_public_composition_execution(
        prepared.runtime
    )
    candidates = harness._checkpoint8_candidate_records()
    mints = tuple(row["mint"] for row in candidates)

    cases = []
    locator = materialized.graduated_supply_kwargs["locator_transport"]
    cases.append((
        build_dexscreener_adapter(enabled=True, fixture_transport=locator),
        _context(
            "dexscreener",
            "dexscreener_fresh_profiles",
            payload={"request_kind": "dexscreener_fresh_profiles", "chain": "solana"},
            ordinal=90,
        ),
        "DEXSCREENER_DISCOVERY",
        "dexscreener",
        "dexscreener_fresh_profiles",
    ))

    dex_batch = materialized.graduated_supply_kwargs[
        "dexscreener_batch_transport_factory"
    ](mints)
    cases.append((
        build_dexscreener_adapter(enabled=True, fixture_transport=dex_batch),
        _context(
            "dexscreener",
            "candidate_market_batch",
            payload={"request_kind": "candidate_market_batch", "chain": "solana", "token_mints": list(mints)},
            ordinal=91,
        ),
        "MINT_MARKET_BATCH",
        "dexscreener",
        "candidate_market_batch",
    ))

    gecko_nomination = materialized.graduated_supply_kwargs[
        "geckoterminal_nomination_transport"
    ]
    cases.append((
        build_geckoterminal_adapter(enabled=True, fixture_transport=gecko_nomination),
        _context(
            "geckoterminal",
            "geckoterminal_new_pool_discovery",
            payload={"request_kind": "geckoterminal_new_pool_discovery", "chain": "solana"},
            ordinal=92,
        ),
        "FRESH_POOL_NOMINATION",
        "geckoterminal",
        "geckoterminal_new_pool_discovery",
    ))

    gecko_reconciliation = materialized.graduated_supply_kwargs[
        "geckoterminal_reconciliation_transport_factory"
    ](mints[0])
    cases.append((
        build_geckoterminal_adapter(enabled=True, fixture_transport=gecko_reconciliation),
        _context(
            "geckoterminal",
            "candidate_market_batch",
            payload={"request_kind": "candidate_market_batch", "chain": "solana", "token_mint": mints[0]},
            ordinal=93,
        ),
        "MINT_MARKET_BATCH",
        "geckoterminal",
        "candidate_market_batch",
    ))

    tripwire = harness.Checkpoint8NetworkTripwire()
    with tripwire:
        for adapter, context, expected_stage, expected_source, expected_kind in cases:
            result = adapter.execute(context)
            assert _accepted_source_result(result)
            identities = identities_from_payload(result.normalized_payload)
            assert len(identities) == 1
            identity = identities[0]
            assert identity.stage == expected_stage
            assert identity.source_name == expected_source
            assert identity.governed_request_kind == expected_kind
            assert identity.response_bytes > 0
            assert identity.normalized_rows > 0

    assert tripwire.attempt_count == 0


def test_checkpoint8_fresh_profile_locator_seals_one_measured_transport(
    tmp_path: Path,
) -> None:
    harness = _load_harness("checkpoint8_fresh_profile_locator_measured")
    prepared = _prepared(harness, tmp_path)
    materialized = proof.materialize_disposable_public_composition_execution(
        prepared.runtime
    )
    sealed = []
    tripwire = harness.Checkpoint8NetworkTripwire()
    with tripwire:
        report = run_fresh_profile_locator(
            prepared.runtime.plan.resolved_db_path,
            transport=materialized.graduated_supply_kwargs["locator_transport"],
            request_key="checkpoint8-fresh-profile-measured",
            now=datetime.now(timezone.utc).isoformat(),
            stage_evidence_sink=sealed.append,
            campaign_id="checkpoint8-campaign",
            run_id="checkpoint8-run",
            cycle_id="checkpoint8-cycle",
            stage_sequence=1,
        )

    assert tripwire.attempt_count == 0
    assert report["status"] == "ok"
    assert report["surfaced_count"] == 2
    assert report["accounting_blocker"] is False
    assert report["source_request_coverage"][0]["transport_identity_count"] == 1
    assert len(sealed) == 1
'''
          marker = 'test_checkpoint8_measured_market_fixture_routes_preserve_one_identity_through_adapters'
          if marker in text:
              raise SystemExit('measured market fixture regression already present')
          test_path.write_text(text.rstrip() + addition.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Verify narrow diff
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              'scripts/v2_9_8b_checkpoint8_controlling_public_composition_proof.py',
              'tests/test_v2_9_8b_window_15m_checkpoint8_real_consumer_compatibility.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == expected, (changed, expected)
          assert not any(path.startswith('src/printer_v1/') for path in changed)
          PY

      - name: Run minimum sufficient offline verification
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m py_compile scripts/v2_9_8b_checkpoint8_controlling_public_composition_proof.py
          python -m py_compile tests/test_v2_9_8b_window_15m_checkpoint8_real_consumer_compatibility.py
          python -m pytest -q tests/test_v2_9_8b_window_15m_checkpoint8_real_consumer_compatibility.py
          python -m pytest -q tests/test_v2_9_8b_window_15m_checkpoint8_*.py
          git diff --check

      - name: Commit repair only after GREEN
        run: |
          git config user.name "Printer V1 Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            scripts/v2_9_8b_checkpoint8_controlling_public_composition_proof.py \
            tests/test_v2_9_8b_window_15m_checkpoint8_real_consumer_compatibility.py
          git commit -m "Repair Checkpoint 8 measured market fixture identities"
          git push origin HEAD:"$REPAIR_BRANCH"
