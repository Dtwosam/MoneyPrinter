name: V2-9.8B historical reconciliation implementation

on:
  push:
    branches:
      - agent/v2-9-8b-historical-execution-reconciliation

permissions:
  contents: write

jobs:
  focused-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply execution-scoped implementation
        shell: bash
        run: |
          python .github/scripts/apply_v2_9_8b_historical_reconciliation.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/printer_v1/operator_cli/operational_campaign_recovery.py')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
      - name: Install focused dependencies
        run: python -m pip install -e . pytest
      - name: Focused GREEN
        shell: bash
        run: |
          python -m pytest -q \
            tests/test_v2_9_8b_historical_four_token_reconciliation.py \
            tests/test_v2_9_8b_shared_terminal_pre_lifecycle_zero_attempt.py \
            tests/test_v2_9_8b_four_token_factory_terminal_integration.py
          python -m py_compile \
            src/printer_v1/operator_cli/operational_campaign_recovery.py \
            src/printer_v1/operator_cli/four_token_factory_adapter.py
          git diff --check
      - name: Commit verified implementation and remove temporary verifier
        shell: bash
        run: |
          rm .github/workflows/v2-9-8b-historical-reconciliation-red.yml
          rm .github/workflows/v2-9-8b-historical-reconciliation-implementation.yml
          rm .github/scripts/apply_v2_9_8b_historical_reconciliation.py
          git config user.name "Printer V1 Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/printer_v1/operator_cli/operational_campaign_recovery.py \
            .github/workflows/v2-9-8b-historical-reconciliation-red.yml \
            .github/workflows/v2-9-8b-historical-reconciliation-implementation.yml \
            .github/scripts/apply_v2_9_8b_historical_reconciliation.py
          git diff --cached --check
          git commit -m "Implement exact historical four-token reconciliation"
          git push origin HEAD:agent/v2-9-8b-historical-execution-reconciliation
