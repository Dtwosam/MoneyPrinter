name: DTW94 holder projection focused TDD

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  focused:
    if: github.base_ref == 'agent/v2-9-8b-dtw94-holder-projection-tdd-runner-base'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify expected RED and persist verdict
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_v2_9_8b_post_dtw94_holder_projection.py' -v > /tmp/dtw94-red.txt 2>&1
          rc=$?
          set -e
          mkdir -p operator-runs/dtw94-holder-projection-tdd
          result=operator-runs/dtw94-holder-projection-tdd/red-verdict.txt
          if [ "$rc" -ne 0 ] \
             && grep -q 'test_concentrated_holder_evidence_is_complete_but_not_future_holder_pass .* FAIL' /tmp/dtw94-red.txt \
             && grep -q 'test_extreme_holder_evidence_is_complete_but_not_future_holder_pass .* FAIL' /tmp/dtw94-red.txt \
             && ! grep -q '^ERROR:' /tmp/dtw94-red.txt; then
            printf '%s\n' 'EXPECTED_RED' 'concentrated projection incorrectly fully_eligible=True' 'extreme projection incorrectly fully_eligible=True' > "$result"
          else
            { printf '%s\n' 'UNEXPECTED_RED_RESULT'; cat /tmp/dtw94-red.txt; } > "$result"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$result"
          if ! git diff --cached --quiet; then
            git commit -m 'Record DTW94 RED proof verdict'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
          test "$(head -n 1 "$result")" = 'EXPECTED_RED'
