name: V2-9.8B post-DTW100 standard four-hour Slice B1 apply

on:
  pull_request:

permissions:
  contents: write

env:
  PYTHONPATH: src

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact implementation baseline
        run: |
          test "$(git rev-parse HEAD)" = "8b9b1226d641018857672b86dd08b154c0e4bde9"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Load and apply disposable B1 patcher
        run: |
          git fetch origin agent/v2-9-8b-post-dtw100-standard-four-hour-slice-b1-apply-base --depth=1
          git show FETCH_HEAD:.github/scripts/apply_standard_four_hour_b1.py > /tmp/apply_standard_four_hour_b1.py
          python /tmp/apply_standard_four_hour_b1.py
          test "$(git diff --name-only)" = "src/printer_v1/operator_cli/campaign_ownership.py"
          git diff --check
      - name: Focused GREEN verification
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/campaign_ownership.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_campaign_handoff.py
          python -m unittest -v \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_campaign_handoff \
            tests.test_v2_9_8b_post_dtw100_checkpoint6_1h_terminal_reconciliation \
            tests.test_v2_9_8b_post_dtw100_checkpoint1_15m_1h_handoff \
            tests.test_v2_9_7d_6b_1_campaign_ownership_schema \
            tests.test_v2_9_8b_operational_selective_1h
          python - <<'PY'
          from printer_v1.snapshots.cadence_policy import get_policy
          for lane in ('TRACK_FAST', 'TRACK_NORMAL'):
              policy = get_policy('WINDOW_4H', lane)
              assert policy is not None
              assert policy.enabled_for_real_collection is False
          PY
          git diff --check
      - name: Commit production-only change
        run: |
          test "$(git diff --name-only)" = "src/printer_v1/operator_cli/campaign_ownership.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/printer_v1/operator_cli/campaign_ownership.py
          git commit -m "Implement standard four-hour campaign handoff"
          git push origin HEAD:agent/v2-9-8b-post-dtw100-standard-four-hour-campaign-integration-implementation
