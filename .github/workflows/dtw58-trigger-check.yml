name: DTW-58 Trigger Check

on:
  pull_request:
    branches:
      - tmp/dtw58-implementation-orchestration

permissions:
  contents: read

jobs:
  trigger-check:
    if: github.event.pull_request.head.ref == 'tmp/dtw58-implementation-trigger'
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm trigger
        run: echo DTW58_TRIGGER_CHECK_PASS
