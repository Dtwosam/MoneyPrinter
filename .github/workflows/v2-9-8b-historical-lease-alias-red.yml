name: V2-9.8B historical lease alias RED

on:
  push:
    branches:
      - agent/v2-9-8b-historical-lease-alias-repair

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: |
          python -m pytest -q tests/test_v2_9_8b_historical_lease_alias_repair.py
