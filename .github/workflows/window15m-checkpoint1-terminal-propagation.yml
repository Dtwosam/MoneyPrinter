name: WINDOW_15M Checkpoint 1 terminal propagation

on:
  pull_request:
    branches:
      - agent/v2-9-8b-window-15m-rolling-blocker-readiness-hardening-design

permissions:
  contents: write

jobs:
  checkpoint-1-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DESIGN_SHA: f1b404ad6463ffab883b5d56133b56a5b45a470c
      STAGED_BRANCH: agent/v2-9-8b-window-15m-checkpoint-1-terminal-propagation-staged
    steps:
      - name: Checkout temporary harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve offline harness scripts
        run: |
          cp .ci/window15m_checkpoint1/write_tests.py /tmp/write_tests.py
          cp .ci/window15m_checkpoint1/apply_repair.py /tmp/apply_repair.py
          cp .ci/window15m_checkpoint1/fix_applicator.py /tmp/fix_applicator.py
          cp .ci/window15m_checkpoint1/write_closeout.py /tmp/write_closeout.py

      - name: Reset executable tree to exact rolling design tip
        run: |
          git checkout --detach "$DESIGN_SHA"
          test "$(git rev-parse HEAD)" = "$DESIGN_SHA"
          test -z "$(git status --porcelain)"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Create disposable migrated fixture database
        run: |
          mkdir -p data
          python - <<'PY'
          from pathlib import Path
          from printer_v1.db import apply_migrations
          apply_migrations(Path("data/printer_v1.sqlite3"))
          PY

      - name: Write Checkpoint 1 regression tests
        run: python /tmp/write_tests.py

      - name: Verify RED on controlling baseline
        shell: bash
        run: |
          set +e
          python -m pytest \
            tests/test_v2_9_8b_window_15m_one_shot_wrapper.py::WrapperImplementationTests::test_27_child_terminal_binding_is_supplied_and_projected \
            -q > /tmp/red.log 2>&1
          code=$?
          set -e
          cat /tmp/red.log
          test "$code" -ne 0
          grep -q 'PRINTER_V1_WINDOW_15M_CHILD_TERMINAL_PATH' /tmp/red.log

      - name: Apply narrow reporting-only repair
        run: |
          python /tmp/fix_applicator.py
          python /tmp/apply_repair.py

      - name: Run focused child and wrapper tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest \
            tests/test_v2_9_8b_window_15m_child_terminal_propagation.py \
            tests/test_v2_9_8b_window_15m_one_shot_wrapper.py \
            -q | tee /tmp/new-tests.log

      - name: Run nearest operational terminal tests
        shell: bash
        run: |
          set -o pipefail
          mapfile -t selected < <(
            find tests -maxdepth 1 -type f -name 'test_*.py' \
              | grep -E '(action_local_terminal|unified_terminal|terminal_truth|operational.*exception|campaign_terminal)' \
              | grep -v 'child_terminal_propagation' \
              | sort \
              | head -n 12 \
              || true
          )
          if [ "${#selected[@]}" -eq 0 ]; then
            echo '0 nearest terminal test files selected' | tee /tmp/nearest-tests.log
          else
            printf 'Selected nearest tests:\n%s\n' "${selected[*]}"
            python -m pytest "${selected[@]}" -q | tee /tmp/nearest-tests.log
          fi

      - name: Compile and diff checks
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/window_15m_child_terminal.py \
            src/printer_v1/operator_cli/window_15m_one_shot_wrapper.py \
            src/printer_v1/operator_cli/operational_memory_factory_command.py \
            src/printer_v1/operator_cli/action_local_terminal_truth.py
          git diff --check
          ! git diff --name-only | grep -E '(^|/)(migrations|scripts)/'
          ! git diff --unified=0 | grep '^+' | grep -E 'urlopen\(|requests\.(get|post)|httpx\.|Start-PrinterV1|OperatorApproved'

      - name: Write checkpoint closeout from fresh evidence
        run: |
          export NEW_TEST_SUMMARY="$(tail -n 1 /tmp/new-tests.log)"
          export NEAREST_TEST_SUMMARY="$(tail -n 1 /tmp/nearest-tests.log)"
          python /tmp/write_closeout.py

      - name: Create clean checkpoint commit from design tip
        shell: bash
        run: |
          git config user.name "ChatGPT Checkpoint CI"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$STAGED_BRANCH"
          git add \
            src/printer_v1/operator_cli/window_15m_child_terminal.py \
            src/printer_v1/operator_cli/window_15m_one_shot_wrapper.py \
            src/printer_v1/operator_cli/operational_memory_factory_command.py \
            tests/test_v2_9_8b_window_15m_child_terminal_propagation.py \
            tests/test_v2_9_8b_window_15m_one_shot_wrapper.py \
            docs/printer-v1-v2-9-8b-window-15m-checkpoint-1-terminal-propagation-closeout.md
          git diff --cached --check
          git commit -m "Harden WINDOW_15M child terminal propagation"
          git push --force origin "$STAGED_BRANCH"
          git rev-parse HEAD
