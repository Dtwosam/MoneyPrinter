name: Checkpoint 8 Fixture Order Repair

on:
  pull_request:
    branches:
      - agent/v2-9-8b-window-15m-checkpoint-8-fresh-reproof-failure-audit-repair
    types: [opened]

permissions:
  contents: write

env:
  REPAIR_BRANCH: agent/v2-9-8b-window-15m-checkpoint-8-fresh-reproof-failure-audit-repair
  EXPECTED_BASE_HEAD: 8612633da618776b735280375e81a084989dea3f

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact repair design HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REPAIR_BRANCH }}
          fetch-depth: 2

      - name: Verify exact baseline
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Printer V1 and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Apply exact proof-only repair
        run: |
          python - <<'PY'
          from pathlib import Path

          harness = Path('scripts/v2_9_8b_checkpoint8_controlling_public_composition_proof.py')
          text = harness.read_text(encoding='utf-8')
          old = '''            expected_mint = ""
            if len(args) >= 2:
                expected_mint = str(args[1] or "")
            elif kwargs.get("expected_mint"):
                expected_mint = str(kwargs["expected_mint"])
            candidate = _checkpoint8_candidate_for_mint(expected_mint)
            if candidate is None:
                raise Checkpoint8ControllingProofError(
                    "CHECKPOINT8_PUMPSWAP_FIXTURE_TARGET_MISSING"
                )
            return self._nested_transport(
'''
          new = '''            expected_mint = ""
            expected_signature = ""
            if len(args) >= 2:
                expected_mint = str(args[0] or "")
                expected_signature = str(args[1] or "")
            elif kwargs.get("expected_mint"):
                expected_mint = str(kwargs["expected_mint"])
                expected_signature = str(kwargs.get("migration_signature") or "")
            candidate = _checkpoint8_candidate_for_mint(expected_mint)
            if candidate is None:
                raise Checkpoint8ControllingProofError(
                    "CHECKPOINT8_PUMPSWAP_FIXTURE_TARGET_MISSING"
                )
            if (
                expected_signature
                and str(candidate.get("migration_signature") or "")
                != expected_signature
            ):
                raise Checkpoint8ControllingProofError(
                    "CHECKPOINT8_PUMPSWAP_FIXTURE_SIGNATURE_MISMATCH"
                )
            return self._nested_transport(
'''
          if text.count(old) != 1:
              raise SystemExit(f'harness replacement count={text.count(old)}')
          harness.write_text(text.replace(old, new, 1), encoding='utf-8')

          compat = Path('src/printer_v1/operator_cli/checkpoint8_real_consumer_compatibility.py')
          text = compat.read_text(encoding='utf-8')
          old = '            transport = verifier(first_signature, first_mint)\n'
          new = '            transport = verifier(first_mint, first_signature)\n'
          if text.count(old) != 1:
              raise SystemExit(f'compat replacement count={text.count(old)}')
          compat.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_v2_9_8b_window_15m_checkpoint8_real_consumer_compatibility.py')
          text = test_path.read_text(encoding='utf-8')
          import_anchor = '''from pathlib import Path

from printer_v1.operator_cli.window_15m_concrete_composition import (
'''
          import_replacement = '''from pathlib import Path

import pytest

from printer_v1.operator_cli import window_15m_disposable_public_composition_proof as proof
from printer_v1.operator_cli.checkpoint8_real_consumer_compatibility import (
    _accepted_source_result,
    _context,
)
from printer_v1.operator_cli.window_15m_concrete_composition import (
'''
          if text.count(import_anchor) != 1:
              raise SystemExit(f'test import anchor count={text.count(import_anchor)}')
          text = text.replace(import_anchor, import_replacement, 1)
          source_anchor = ''')


ROOT = Path(__file__).resolve().parents[1]
'''
          source_replacement = ''')
from printer_v1.sources.pumpswap import build_pumpswap_adapter


ROOT = Path(__file__).resolve().parents[1]
'''
          if text.count(source_anchor) != 1:
              raise SystemExit(f'test source anchor count={text.count(source_anchor)}')
          text = text.replace(source_anchor, source_replacement, 1)
          addition = '''


def test_checkpoint8_pumpswap_verifier_factory_matches_canonical_mint_signature_order(
    tmp_path: Path,
) -> None:
    harness = _load_harness("checkpoint8_verifier_factory_order")
    prepared = _prepared(harness, tmp_path)
    materialized = proof.materialize_disposable_public_composition_execution(
        prepared.runtime
    )
    verifier = materialized.outputs_by_label[
        "exact_pump_pumpswap_graduation_verifier_transport"
    ]
    candidate = harness._checkpoint8_candidate_records()[0]
    mint = candidate["mint"]
    signature = candidate["migration_signature"]
    pool = candidate["pumpswap_pool"]

    transport = verifier(mint, signature)
    adapter = build_pumpswap_adapter(enabled=True, fixture_transport=transport)
    result = adapter.execute(
        _context(
            "pumpswap",
            "pumpswap_onchain_pool_confirmation",
            payload={"expected_mint": mint, "pool_address": pool},
            ordinal=77,
        )
    )
    assert _accepted_source_result(result)

    with pytest.raises(
        harness.Checkpoint8ControllingProofError,
        match="CHECKPOINT8_PUMPSWAP_FIXTURE_TARGET_MISSING",
    ):
        verifier(signature, mint)
'''
          if 'test_checkpoint8_pumpswap_verifier_factory_matches_canonical_mint_signature_order' in text:
              raise SystemExit('regression already present')
          test_path.write_text(text.rstrip() + addition + '\n', encoding='utf-8')
          PY

      - name: Verify narrow diff
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              'scripts/v2_9_8b_checkpoint8_controlling_public_composition_proof.py',
              'src/printer_v1/operator_cli/checkpoint8_real_consumer_compatibility.py',
              'tests/test_v2_9_8b_window_15m_checkpoint8_real_consumer_compatibility.py',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          assert changed == expected, (changed, expected)
          PY

      - name: Run minimum sufficient offline verification
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m py_compile \
            scripts/v2_9_8b_checkpoint8_controlling_public_composition_proof.py \
            src/printer_v1/operator_cli/checkpoint8_real_consumer_compatibility.py
          python -m pytest -q tests/test_v2_9_8b_window_15m_checkpoint8_real_consumer_compatibility.py

      - name: Commit repair only after GREEN
        run: |
          git config user.name "Printer V1 Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            scripts/v2_9_8b_checkpoint8_controlling_public_composition_proof.py \
            src/printer_v1/operator_cli/checkpoint8_real_consumer_compatibility.py \
            tests/test_v2_9_8b_window_15m_checkpoint8_real_consumer_compatibility.py
          git commit -m "Fix Checkpoint 8 verifier fixture argument order"
          git push origin HEAD:"$REPAIR_BRANCH"
