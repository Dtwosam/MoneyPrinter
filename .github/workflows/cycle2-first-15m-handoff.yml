name: Cycle-2 first 15m handoff proof

on:
  push:
    branches:
      - agent/tmp-cycle2-first-15m-handoff-proof

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - name: Compile affected factory test
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            src/printer_v1/operator_cli/operational_selective_1h.py \
            tests/test_v2_9_8b_four_token_factory_wake_ordering.py
      - name: Run real Cycle-2 first-15m handoff proof
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          timeout 240s python -m pytest -q \
            tests/test_v2_9_8b_four_token_factory_wake_ordering.py \
            -k "time_shifted_pair_ready"
