name: V2-9.8B replay-only integration candidate proof

on:
  push:
    branches:
      - assistant/v2-9-8b-replay-only-integration-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Genuine duplicate transport still fails closed
        run: >-
          python -m pytest -q
          tests/test_v2_9_8b_terminal_safety_accounting_finalization.py::test_accounting_rejects_absence_malformed_duplicate_mismatch_and_accepts_explicit_no_work
      - name: Later-cycle replay repair proof
        run: python -m pytest -q tests/test_v2_9_8b_later_cycle_mint_market_replay_repair.py
      - name: Freeze-ready wiring non-regression
        run: python -m pytest -q tests/test_v2_9_8b_freeze_ready_wiring_completion.py
      - name: Normal first-cycle acquisition non-regression
        run: >-
          python -m pytest -q
          tests/test_v2_9_8b_21_eligible_token_supply_architecture.py::EligibleTokenSupplyArchitectureTests::test_two_eligible_outside_first_six_discovered_and_selected
      - name: Compile and diff hygiene
        run: |
          python -m py_compile src/printer_v1/discovery/eligible_token_supply.py src/printer_v1/operator_cli/_graduated_supply_front_door_base.py
          git diff --check
