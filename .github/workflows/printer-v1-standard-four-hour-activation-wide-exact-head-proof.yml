name: Printer V1 standard 4h activation-wide exact-head proof

on:
  pull_request:
    branches:
      - agent/v2-9-8b-post-dtw100-standard-four-hour-activation-wide-proof-base

permissions:
  contents: read

jobs:
  exact-head-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 28de1bc0c6437388e0e1392119a8731a34d580b6
          fetch-depth: 0
      - name: Assert exact clean activation head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "28de1bc0c6437388e0e1392119a8731a34d580b6"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Compile activation surfaces
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/operational_memory_factory_command.py \
            src/printer_v1/operator_cli/authoritative_live_operational_campaign.py \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            src/printer_v1/operator_cli/one_token_4h_runtime.py \
            src/printer_v1/operator_cli/campaign_ownership.py \
            src/printer_v1/snapshots/cadence_policy.py
      - name: Assert activation proof inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          files = {p.name for p in Path('tests').glob('test_v2_9_8b_post_dtw100_standard_four_hour*.py')}
          required = {
              'test_v2_9_8b_post_dtw100_standard_four_hour_policy_capacity.py',
              'test_v2_9_8b_post_dtw100_standard_four_hour_campaign_handoff.py',
              'test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning.py',
              'test_v2_9_8b_post_dtw100_standard_four_hour_collection_state_accounting.py',
              'test_v2_9_8b_post_dtw100_standard_four_hour_close_memory_terminal_reconciliation.py',
              'test_v2_9_8b_post_dtw100_standard_four_hour_eligible_subset.py',
              'test_v2_9_8b_post_dtw100_standard_four_hour_activation_authorization.py',
              'test_v2_9_8b_post_dtw100_standard_four_hour_activation_factory_barrier.py',
              'test_v2_9_8b_post_dtw100_standard_four_hour_activation_final_public_wiring.py',
          }
          missing = sorted(required - files)
          assert not missing, f'missing expected activation tests: {missing}'
          checkpoints = sorted(Path('tests').glob('test_v2_9_8b_post_dtw100_checkpoint*.py'))
          assert checkpoints, 'post-DTW100 checkpoint regression inventory is unexpectedly empty'
          print('standard-four-hour activation test files:', len(files))
          print('post-DTW100 checkpoint test files:', len(checkpoints))
          for name in sorted(files):
              print(name)
          for path in checkpoints:
              print(path.name)
          PY
      - name: Prove all standard four-hour current-contract tests
        run: python -m unittest discover -s tests -p 'test_v2_9_8b_post_dtw100_standard_four_hour*.py' -v
      - name: Prove post-DTW100 lifecycle checkpoint regressions
        run: python -m unittest discover -s tests -p 'test_v2_9_8b_post_dtw100_checkpoint*.py' -v
      - name: Prove token-local continuation regression
        run: python -m unittest -v tests.test_v2_9_7d_4a_token_local_selective_continuation
      - name: Prove activation policy and capability locks
        run: |
          python - <<'PY'
          import inspect
          from printer_v1.operator_cli import operational_memory_factory_command as command
          from printer_v1.operator_cli import authoritative_live_operational_campaign as live
          from printer_v1.operator_cli import one_command_15m_factory as factory
          from printer_v1.snapshots.cadence_policy import get_policy

          p = command.STANDARD_FOUR_HOUR_POLICY
          assert p.selective_1h_continuation is True
          assert p.continuous_four_hour is True
          assert p.standard_four_hour_campaign is True
          assert set(p.locked_windows) == {'WINDOW_12H', 'WINDOW_24H'}
          assert p.governed_request_ceiling == 230
          assert p.scheduler_row_ceiling == 210

          command_src = inspect.getsource(command)
          live_src = inspect.getsource(live.AuthoritativeLiveOperationalCampaignOwner.run_operational)
          factory_src = inspect.getsource(factory)
          assert 'run_standard_four_hour_campaign' in command_src
          assert 'standard-four-hour-run' in command_src
          assert 'standard_four_hour_campaign' in live_src
          assert 'run_standard_four_hour_campaign_barrier' in factory_src

          for lane in ('TRACK_FAST', 'TRACK_NORMAL'):
              assert get_policy('WINDOW_4H', lane).enabled_for_real_collection is True
              assert get_policy('WINDOW_12H', lane).enabled_for_real_collection is False
              assert get_policy('WINDOW_24H', lane).enabled_for_real_collection is False
          PY
      - name: Assert read-only tracked tree
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "28de1bc0c6437388e0e1392119a8731a34d580b6"
