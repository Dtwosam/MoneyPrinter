name: Checkpoint 8 independent inspector CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  checkpoint8-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run Checkpoint 8 focused gate
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m py_compile scripts/v2_9_8b_checkpoint8_controlling_public_composition_proof.py
          python -m py_compile scripts/v2_9_8b_checkpoint8_independent_inspection.py
          python -m pytest -q \
            tests/test_v2_9_8b_window_15m_checkpoint8_public_composition_boundary.py \
            tests/test_v2_9_8b_window_15m_checkpoint8_fail_closed_boundary.py \
            tests/test_v2_9_8b_window_15m_checkpoint8_runtime_preparation.py \
            tests/test_v2_9_8b_window_15m_checkpoint8_fixture_execution_plan.py \
            tests/test_v2_9_8b_window_15m_checkpoint8_fixture_materialization_and_targeting.py \
            tests/test_v2_9_8b_window_15m_checkpoint8_owner_di_bridge.py \
            tests/test_v2_9_8b_window_15m_checkpoint8_owner_invocation_wiring.py \
            tests/test_v2_9_8b_window_15m_checkpoint8_pre_proof_acceptance_replay.py \
            tests/test_v2_9_8b_window_15m_checkpoint8_proof_safety_shell.py \
            tests/test_v2_9_8b_window_15m_checkpoint8_fixture_entry_preparation.py \
            tests/test_v2_9_8b_window_15m_checkpoint8_fixture_response_semantics_gate.py \
            tests/test_v2_9_8b_window_15m_checkpoint8_execution_entry_freeze.py \
            tests/test_v2_9_8b_window_15m_checkpoint8_independent_inspection_completion.py \
            tests/test_v2_9_8b_window_15m_checkpoint8_independent_inspection_integration.py
