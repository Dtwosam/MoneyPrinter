name: Printer V1 standard 4h eligible-subset TDD

on:
  pull_request:
    branches:
      - agent/v2-9-8b-post-dtw100-standard-four-hour-eligible-subset-tdd-runner-base

permissions:
  contents: read

jobs:
  eligible-subset-tdd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert expected RED head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d14e5e557e4a9f69366c41bdd4a45b25a5caea90"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project
        run: python -m pip install -e .

      - name: Compile directly affected modules
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/campaign_ownership.py \
            src/printer_v1/operator_cli/one_token_4h_runtime.py \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_eligible_subset.py

      - name: Run directly affected RED suite
        id: red_tests
        continue-on-error: true
        run: |
          python -m unittest -v \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_eligible_subset \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_campaign_handoff \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_policy_capacity \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_collection_state_accounting \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_close_memory_terminal_reconciliation \
            tests.test_v2_9_7d_4a_token_local_selective_continuation

      - name: Assert capability locks
        if: always()
        run: |
          python - <<'PY'
          from printer_v1.operator_cli.one_token_4h_runtime import runtime_budget
          from printer_v1.snapshots.cadence_policy import get_policy

          for lane in ("TRACK_FAST", "TRACK_NORMAL"):
              assert runtime_budget(lane)["enabled_for_real_collection"] is False
              for window_kind in ("WINDOW_4H", "WINDOW_12H", "WINDOW_24H"):
                  policy = get_policy(window_kind, lane)
                  assert policy is not None
                  assert policy.enabled_for_real_collection is False
          PY

      - name: Diff hygiene
        if: always()
        run: git diff --check

      - name: Preserve RED result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.red_tests.outcome }}" != "failure" ]; then
            echo "Expected the new eligible-subset contract to be RED, but the suite outcome was ${{ steps.red_tests.outcome }}" >&2
            exit 2
          fi
          echo "Expected RED observed."
