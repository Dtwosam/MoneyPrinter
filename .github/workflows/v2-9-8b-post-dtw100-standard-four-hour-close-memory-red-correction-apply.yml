name: V2-9.8B post-DTW100 standard four-hour close memory RED correction apply

on:
  pull_request:

permissions:
  contents: write

env:
  PYTHONPATH: src

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact amended-design parent
        run: |
          test "$(git rev-parse HEAD^)" = "bad90312786a6407d8b6a8ea7c3bdb57f1318ba7"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/v2-9-8b-post-dtw100-standard-four-hour-close-memory-red-correction-trigger.txt"
          git checkout bad90312786a6407d8b6a8ea7c3bdb57f1318ba7
      - name: Apply test-only RED correction
        run: |
          git fetch origin agent/v2-9-8b-post-dtw100-standard-four-hour-close-memory-red-correction-apply-base --depth=1
          git show FETCH_HEAD:.github/scripts/apply_standard_four_hour_close_memory_red_correction.py > /tmp/apply_red_correction.py
          python /tmp/apply_red_correction.py
          test "$(git diff --name-only)" = "tests/test_v2_9_8b_post_dtw100_standard_four_hour_close_memory_terminal_reconciliation.py"
          git diff --check
          python -m py_compile tests/test_v2_9_8b_post_dtw100_standard_four_hour_close_memory_terminal_reconciliation.py
      - name: Commit test-only correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_v2_9_8b_post_dtw100_standard_four_hour_close_memory_terminal_reconciliation.py
          git commit -m "Correct standard four-hour close memory RED coverage"
          git push origin HEAD:agent/v2-9-8b-post-dtw100-standard-four-hour-campaign-integration-implementation
