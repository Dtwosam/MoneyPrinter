name: V2-9.8B zero-attempt opening-plan GREEN

on:
  push:
    branches:
      - assistant/green-v2-9-8b-zero-attempt-opening-plan

permissions:
  contents: write

jobs:
  focused-green:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify and publish atomic repair
        shell: bash
        run: |
          set -euo pipefail
          AUTHORITATIVE_BRANCH='assistant/v2-9-8b-later-cycle-mint-market-replay-repair'
          BASE='4275c67407c12112ad9d644053721e72aad7835b'
          test "$(git ls-remote origin "refs/heads/${AUTHORITATIVE_BRANCH}" | awk '{print $1}')" = "$BASE"
          python - <<'PY'
          from pathlib import Path
          source = Path('tools/zero_attempt_green_payload.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          normalized = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          ) + "\n"
          Path('/tmp/zero_attempt_repair.py').write_text(normalized, encoding='utf-8')
          PY
          git checkout --detach "$BASE"
          python /tmp/zero_attempt_repair.py
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
          python -m pytest -q \
            tests/test_v2_9_8b_zero_attempt_after_opening_plan.py \
            tests/test_v2_9_8b_shared_terminal_pre_lifecycle_zero_attempt.py \
            tests/test_v2_9_8b_four_token_factory_terminal_integration.py \
            tests/test_v2_9_8b_four_token_factory_adapter.py \
            tests/test_v2_9_8b_four_token_factory_wake_ordering.py
          python -m py_compile \
            src/printer_v1/operator_cli/four_token_factory_adapter.py \
            src/printer_v1/operator_cli/one_command_15m_factory.py
          git diff --check
          test "$(git ls-remote origin "refs/heads/${AUTHORITATIVE_BRANCH}" | awk '{print $1}')" = "$BASE"
          git config user.name 'ChatGPT Repair CI'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            migrations/063_four_token_zero_attempt_terminal_provenance.sql \
            src/printer_v1/operator_cli/four_token_factory_adapter.py \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            tests/test_v2_9_8b_zero_attempt_after_opening_plan.py \
            .github/workflows/v2-9-8b-focused-repair-verify.yml \
            CURRENT_HANDOFF.md
          git diff --cached --check
          git commit -m 'fix: preserve planned-lifecycle zero-attempt terminal truth'
          git push origin HEAD:"${AUTHORITATIVE_BRANCH}"
