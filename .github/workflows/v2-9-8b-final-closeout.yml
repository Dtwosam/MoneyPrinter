name: V2-9.8B final closeout

on:
  push:
    branches:
      - agent/v2-9-8b-persistent-multisource-fresh-acquisition-implementation

permissions:
  contents: read

jobs:
  bounded-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run minimum-sufficient V2-9.8B proof
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -e . pytest pytest-timeout
          python -m compileall -q src/printer_v1
          PYTHONPATH=src python -m pytest -q --timeout=45 --timeout-method=thread \
            tests/test_v2_9_8b_persistent_multisource_refresh.py \
            tests/test_v2_9_8b_persistent_refresh_owner_proof.py \
            tests/test_v2_9_8b_migration_057_upgrade.py \
            tests/test_v2_9_8b_window_15m_final_integrated_readiness_repair.py \
            tests/test_v2_9_8b_21_eligible_token_supply_architecture.py \
            tests/test_v2_9_8b_permanent_discovery_availability.py \
            tests/test_v2_9_8b_post_dtw98_pre_lifecycle_temporal_persistence.py \
            tests/test_v2_9_8b_post_dtw98_temporal_persistence_bounded_proof.py \
            tests/test_v2_9_8b_post_dtw98_temporal_persistence_completion.py \
            tests/test_v2_9_8b_post_dtw99_build_graduated_supply_temporal_owner_interface.py \
            tests/test_v2_9_8b_operational_factory_active_path_restoration.py \
            tests/test_v2_9_8b_four_token_proof_existing_wrapper_regression_locks.py \
            tests/test_v2_9_8b_terminal_safety_accounting_finalization.py \
            tests/test_v2_9_8b_multi_round_market_batch_six_unit_sequencing.py
          git diff --check
