name: V2-9.8B Safety Core Redundancy Proof

on:
  pull_request:
    branches:
      - agent/v2-9-8b-cooperative-later-cycle-repair-implementation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact product patch in disposable checkout
        run: python .github/scripts/apply_safety_core_redundancy_patch.py
      - name: Correct overly literal wiring assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_v2_9_8b_solana_native_safety_redundancy.py')
          text = path.read_text(encoding='utf-8')
          old = '        self.assertIn("mint_account_reference", source)\n'
          new = '        self.assertIn("SOLANA_RPC_TOKEN_SAFETY_REQUEST_KIND", source)\n'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('SAFETY_WIRING_TEST_ASSERTION_ANCHOR_MISSING')
          PY
      - name: Focused safety redundancy tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_v2_9_8b_solana_native_safety_redundancy.py' -v
      - name: Compile touched production modules
        run: >-
          python -m py_compile
          src/printer_v1/sources/solana_rpc_token_safety.py
          src/printer_v1/safety/goplus_normalizer.py
          src/printer_v1/safety/composite.py
          src/printer_v1/sources/measured_transport.py
          src/printer_v1/operator_cli/holder_reliability_budget_control.py
          src/printer_v1/operator_cli/one_command_15m_factory.py
      - name: Diff check
        run: git diff --check
      - name: Commit proven product patch
        run: |
          if git diff --quiet -- src/printer_v1/safety/goplus_normalizer.py src/printer_v1/safety/composite.py src/printer_v1/sources/measured_transport.py src/printer_v1/operator_cli/holder_reliability_budget_control.py src/printer_v1/operator_cli/one_command_15m_factory.py tests/test_v2_9_8b_solana_native_safety_redundancy.py; then
            echo 'No uncommitted repair patch remains.'
            exit 0
          fi
          git config user.name 'ChatGPT Safety Repair CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/printer_v1/safety/goplus_normalizer.py src/printer_v1/safety/composite.py src/printer_v1/sources/measured_transport.py src/printer_v1/operator_cli/holder_reliability_budget_control.py src/printer_v1/operator_cli/one_command_15m_factory.py tests/test_v2_9_8b_solana_native_safety_redundancy.py
          git commit -m 'Implement Solana-native core safety redundancy'
          git push origin HEAD:agent/v2-9-8b-safety-core-redundancy-repair
