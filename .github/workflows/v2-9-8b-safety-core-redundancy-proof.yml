name: V2-9.8B Safety Core Redundancy Proof

on:
  push:
    branches:
      - agent/v2-9-8b-safety-core-redundancy-repair
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused safety redundancy tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_v2_9_8b_solana_native_safety_redundancy.py' -v
