name: Checkpoint 8 blocked repair offline CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  checkpoint8-blocked-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile proof harness
        run: python -m py_compile scripts/v2_9_8b_checkpoint8_controlling_public_composition_proof.py
      - name: Run blocked-proof repair RED/GREEN tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest -q tests/test_v2_9_8b_window_15m_checkpoint8_blocked_proof_repair.py
