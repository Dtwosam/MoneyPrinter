name: V2-9.8B closeout regression rerun

on:
  push:
    branches:
      - agent/v2-9-8b-persistent-multisource-fresh-acquisition-implementation

permissions:
  contents: read

jobs:
  broad-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run closeout regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -e . pytest
          python -m compileall -q src/printer_v1
          PYTHONPATH=src python -m pytest -q --ignore=tests/test_v2_9_8b_window_15m_final_integrated_readiness_repair.py
          git diff --check

  integrated-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated integrated-readiness test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -e . pytest
          python -m compileall -q src/printer_v1
          PYTHONPATH=src python -m pytest -q tests/test_v2_9_8b_window_15m_final_integrated_readiness_repair.py
          git diff --check