name: Printer freeze-input repair TDD

on:
  pull_request:

permissions:
  contents: write

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Apply minimal product repair when absent
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/printer_v1/operator_cli/authoritative_live_operational_campaign.py')
          text = path.read_text()
          helper_name = '_permanent_observation_admission_inputs'
          if f'def {helper_name}(' not in text:
              anchor = '''def _graduated_admission_candidate_cap(
              *,
              permanent_memory_observation: bool,
              ledger: Any,
          ) -> int:
          '''
              if text.count(anchor) != 1:
                  raise SystemExit('candidate-cap anchor drift')
              helper = '''def _permanent_observation_admission_inputs(supply: Any) -> tuple[Any, ...]:
              """Return the full lawful reserve used by permanent observation freeze."""
              return tuple(supply.holder_reserve_supply)


          '''
              text = text.replace(anchor, helper + anchor, 1)

              old = '''            admission_inputs = (
                          tuple(supply.graduated_supply)
                          if permanent_mode and supply is not None
                          else tuple(acquisition.origin_proofs)
                          + graduated_supply_proofs
                      )
          '''
              new = '''            admission_inputs = (
                          _permanent_observation_admission_inputs(supply)
                          if permanent_mode and supply is not None
                          else tuple(acquisition.origin_proofs)
                          + graduated_supply_proofs
                      )
          '''
              if text.count(old) != 1:
                  raise SystemExit('admission-input anchor drift')
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Run focused regression
        run: python -m unittest discover -s tests -p 'test_v2_9_8b_four_token_freeze_input_truncation_repair.py' -v
      - name: Commit product repair after GREEN
        run: |
          if git diff --quiet -- src/printer_v1/operator_cli/authoritative_live_operational_campaign.py; then
            echo 'Product repair already committed.'
            exit 0
          fi
          git config user.name 'Printer V1 TDD'
          git config user.email 'noreply@openai.com'
          git add src/printer_v1/operator_cli/authoritative_live_operational_campaign.py
          git commit -m 'Repair permanent observation freeze input'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
