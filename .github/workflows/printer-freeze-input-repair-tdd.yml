name: Printer freeze-input repair closeout

on:
  pull_request:

permissions:
  contents: read

jobs:
  bounded-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run bounded repair regressions
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import unittest

          patterns = [
              'test_v2_9_8b_four_token_freeze_input_truncation_repair.py',
              'test_v2_9_8b_window_15m_holder_budget_decoupling.py',
              'test_v2_9_8b_four_token_standard_four_hour_operational_authority.py',
              'test_v2_9_8b_four_token_standard_four_hour_bounded_offline_proof.py',
              'test_v2_9_8b_standard_four_hour_production_authority.py',
          ]
          loader = unittest.TestLoader()
          suite = unittest.TestSuite()
          for pattern in patterns:
              if not pathlib.Path('tests', pattern).is_file():
                  raise SystemExit(f'missing required regression file: {pattern}')
              suite.addTests(loader.discover('tests', pattern=pattern))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
