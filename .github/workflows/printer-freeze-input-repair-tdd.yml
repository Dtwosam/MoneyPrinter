name: Printer freeze-input repair TDD

on:
  pull_request:
  workflow_dispatch:

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run focused regression
        run: python -m unittest discover -s tests -p 'test_v2_9_8b_four_token_freeze_input_truncation_repair.py' -v
