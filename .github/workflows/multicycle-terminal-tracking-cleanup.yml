name: Multicycle shared terminal tracking cleanup proof

on:
  push:
    branches:
      - agent/tmp-cycle2-multicycle-terminal-cleanup-proof

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - name: Run focused terminal cleanup proof
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest -q \
            tests/test_v2_9_8b_multicycle_shared_terminal_tracking_cleanup.py
