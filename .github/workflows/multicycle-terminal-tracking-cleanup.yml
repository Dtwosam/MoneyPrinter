name: Multicycle shared terminal tracking cleanup proof

on:
  push:
    branches:
      - agent/tmp-cycle2-multicycle-terminal-cleanup-proof

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - name: Compile terminal owners
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/unified_terminal_closure.py \
            src/printer_v1/operator_cli/four_token_factory_adapter.py \
            src/printer_v1/operator_cli/one_command_15m_factory.py
      - name: Run affected terminal cleanup suites
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest -q \
            tests/test_v2_9_8b_multicycle_shared_terminal_tracking_cleanup.py \
            tests/test_v2_9_8b_pair_ready_active_work_visibility.py \
            tests/test_v2_9_8b_pair_ready_parent_terminal_cancellation_repair.py \
            tests/test_v2_9_8b_interrupted_cycle2_parent_interrupt_cleanup.py \
            tests/test_v2_9_8b_cycle2_materialization_fault_isolation_repair.py \
            tests/test_v2_9_8b_four_token_factory_terminal_integration.py \
            tests/test_v2_9_8b_post_handoff_terminal_compensation.py
