name: WINDOW_15M Checkpoint 1 native proof

on:
  pull_request:
    branches:
      - agent/v2-9-8b-window-15m-rolling-blocker-readiness-hardening-design

permissions:
  contents: write

jobs:
  native-checkpoint-1-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DESIGN_SHA: f1b404ad6463ffab883b5d56133b56a5b45a470c
      STAGED_BRANCH: agent/v2-9-8b-window-15m-checkpoint-1-terminal-propagation-staged
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Native authenticated checkout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ./* ./.??* 2>/dev/null || true
          git clone --no-tags \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          git fetch --no-tags origin "${GITHUB_HEAD_REF}"
          git checkout -B "${GITHUB_HEAD_REF}" FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Run exact offline Checkpoint 1 proof
        shell: bash
        run: bash .ci/window15m_checkpoint1/run_native_proof.sh
