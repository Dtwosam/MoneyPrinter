name: Post-Reconciliation Governance Sync

on:
  push:
    branches:
      - ci/v2-9-8b-post-reconciliation-governance-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build governance-only commit from reviewed baseline
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/post_reconciliation_governance_sync.py /tmp/post_reconciliation_governance_sync.py
          git reset --hard d0c1d88d0fa6984a8ad45f3b5a3fa7c09e8f3024
          test "$(git rev-parse HEAD)" = "d0c1d88d0fa6984a8ad45f3b5a3fa7c09e8f3024"
          python /tmp/post_reconciliation_governance_sync.py
          git diff --check
          git status --short
          test "$(git status --porcelain | wc -l | tr -d ' ')" = "3"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md CURRENT_HANDOFF.md docs/printer-v1-v2-9-8b-interrupted-four-token-704f53472011-authoritative-residue-reconciliation-application-closeout.md
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' AGENTS.md CURRENT_HANDOFF.md docs/printer-v1-v2-9-8b-interrupted-four-token-704f53472011-authoritative-residue-reconciliation-application-closeout.md | sort)"
          git commit -m "Synchronize post-reconciliation Printer governance"
          git push origin HEAD:governance/v2-9-8b-post-reconciliation-sync
