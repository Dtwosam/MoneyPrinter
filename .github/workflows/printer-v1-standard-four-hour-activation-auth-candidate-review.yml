name: Printer V1 standard 4h Slice B candidate trust review

on:
  pull_request:
    branches:
      - agent/v2-9-8b-post-dtw100-standard-four-hour-activation-auth-candidate-review-base

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7eff7fa8b721358be847a48bb1b85f468722888c
          fetch-depth: 0
      - name: Assert exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "7eff7fa8b721358be847a48bb1b85f468722888c"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Compile trust-boundary files
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/git_provenance_authorization_manifest.py \
            src/printer_v1/operator_cli/standard_four_hour_one_shot_wrapper.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_activation_authorization.py \
            tests/test_v2_9_8b_window_15m_historical_authorization_evidence_contract.py
      - name: Standard 4h authorization contract
        run: python -m unittest -v tests.test_v2_9_8b_post_dtw100_standard_four_hour_activation_authorization
      - name: Historical authorization trust regression
        run: python -m unittest -v tests.test_v2_9_8b_window_15m_historical_authorization_evidence_contract
      - name: Ordinary wrapper and activation regressions
        run: |
          python -m unittest -v \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_operational_activation \
            tests.test_v2_9_8b_window_15m_one_shot_wrapper.ChildInterpreterSelectorUnitTests \
            tests.test_v2_9_8b_window_15m_one_shot_wrapper.LauncherShapeTests
      - name: Locks and clean tree
        run: |
          python - <<'PY'
          from printer_v1.snapshots.cadence_policy import get_policy
          for lane in ('TRACK_FAST','TRACK_NORMAL'):
              assert get_policy('WINDOW_12H', lane).enabled_for_real_collection is False
              assert get_policy('WINDOW_24H', lane).enabled_for_real_collection is False
          PY
          git diff --check
          test -z "$(git status --porcelain)"
