name: V2-9.8B focused implementation

on:
  push:
    branches:
      - agent/v2-9-8b-shared-terminal-pre-lifecycle-repair

permissions:
  contents: write

jobs:
  focused-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply minimal implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path('migrations/056_four_token_pre_lifecycle_terminal_provenance.sql')
          migration.write_text('''-- V2-9.8B immutable provenance for a legitimate Cycle-1 pre-lifecycle\n-- terminal before any Cycle-2 pre-admission attempt exists.\nBEGIN IMMEDIATE;\n\nCREATE TABLE printer_four_token_pre_lifecycle_terminal_provenance (\n    campaign_id TEXT NOT NULL,\n    campaign_run_id TEXT NOT NULL,\n    authoritative_factory_run_id TEXT NOT NULL,\n    cycle_id TEXT NOT NULL,\n    cycle_ordinal INTEGER NOT NULL CHECK (cycle_ordinal = 1),\n    proposed_cycle_ordinal INTEGER NOT NULL CHECK (proposed_cycle_ordinal = 2),\n    terminal_phase TEXT NOT NULL CHECK (terminal_phase = 'CAMPAIGN_PRE_LIFECYCLE'),\n    first_terminal_cause TEXT NOT NULL CHECK (length(trim(first_terminal_cause)) > 0),\n    recorded_at TEXT NOT NULL CHECK (length(trim(recorded_at)) > 0),\n    PRIMARY KEY (\n        campaign_id, campaign_run_id, authoritative_factory_run_id,\n        proposed_cycle_ordinal\n    ),\n    FOREIGN KEY (campaign_id)\n        REFERENCES printer_memory_factory_campaigns(campaign_id),\n    FOREIGN KEY (campaign_run_id, campaign_id)\n        REFERENCES printer_memory_factory_campaign_runs(run_id, campaign_id),\n    FOREIGN KEY (authoritative_factory_run_id)\n        REFERENCES printer_memory_factory_runs(run_id),\n    FOREIGN KEY (cycle_id, campaign_run_id, campaign_id)\n        REFERENCES printer_memory_factory_campaign_cycles(cycle_id, run_id, campaign_id)\n);\n\nCREATE TRIGGER printer_four_token_pre_lifecycle_provenance_exact_shape\nBEFORE INSERT ON printer_four_token_pre_lifecycle_terminal_provenance\nBEGIN\n    SELECT CASE WHEN NOT EXISTS (\n        SELECT 1 FROM printer_memory_factory_campaign_runs\n        WHERE run_id = NEW.campaign_run_id\n          AND campaign_id = NEW.campaign_id\n          AND authoritative_run_id = NEW.authoritative_factory_run_id\n          AND run_state = 'RUNNING'\n    ) THEN RAISE(ABORT, 'four-token pre-lifecycle provenance owner mismatch') END;\n\n    SELECT CASE WHEN (\n        SELECT COUNT(*) FROM printer_memory_factory_campaign_cycles\n        WHERE campaign_id = NEW.campaign_id AND run_id = NEW.campaign_run_id\n    ) != 1 THEN RAISE(ABORT, 'four-token pre-lifecycle provenance requires exactly one cycle') END;\n\n    SELECT CASE WHEN NOT EXISTS (\n        SELECT 1 FROM printer_memory_factory_campaign_cycles\n        WHERE cycle_id = NEW.cycle_id\n          AND campaign_id = NEW.campaign_id\n          AND run_id = NEW.campaign_run_id\n          AND cycle_ordinal = 1\n          AND cycle_state NOT LIKE 'TERMINAL_%'\n    ) THEN RAISE(ABORT, 'four-token pre-lifecycle provenance requires live Cycle 1') END;\n\n    SELECT CASE WHEN (\n        SELECT COUNT(*) FROM printer_memory_factory_campaign_token_slots\n        WHERE campaign_id = NEW.campaign_id\n          AND run_id = NEW.campaign_run_id\n          AND cycle_id = NEW.cycle_id\n    ) != 2 THEN RAISE(ABORT, 'four-token pre-lifecycle provenance requires exact Cycle-1 slots') END;\n\n    SELECT CASE WHEN EXISTS (\n        SELECT 1 FROM printer_memory_factory_campaign_cycles\n        WHERE campaign_id = NEW.campaign_id\n          AND run_id = NEW.campaign_run_id\n          AND cycle_ordinal = 2\n    ) THEN RAISE(ABORT, 'four-token pre-lifecycle provenance forbids Cycle 2') END;\n\n    SELECT CASE WHEN EXISTS (\n        SELECT 1 FROM printer_pre_admission_discovery_attempts\n        WHERE campaign_id = NEW.campaign_id\n          AND campaign_run_id = NEW.campaign_run_id\n          AND authoritative_factory_run_id = NEW.authoritative_factory_run_id\n          AND proposed_cycle_ordinal = 2\n    ) THEN RAISE(ABORT, 'four-token pre-lifecycle provenance forbids Cycle-2 attempt evidence') END;\n\n    SELECT CASE WHEN EXISTS (\n        SELECT 1 FROM printer_memory_factory_campaign_windows\n        WHERE campaign_id = NEW.campaign_id\n          AND run_id = NEW.campaign_run_id\n          AND cycle_id = NEW.cycle_id\n    ) THEN RAISE(ABORT, 'four-token pre-lifecycle provenance forbids lifecycle windows') END;\nEND;\n\nCREATE TRIGGER printer_four_token_pre_lifecycle_provenance_immutable_update\nBEFORE UPDATE ON printer_four_token_pre_lifecycle_terminal_provenance\nBEGIN\n    SELECT RAISE(ABORT, 'four-token pre-lifecycle provenance is immutable');\nEND;\n\nCREATE TRIGGER printer_four_token_pre_lifecycle_provenance_immutable_delete\nBEFORE DELETE ON printer_four_token_pre_lifecycle_terminal_provenance\nBEGIN\n    SELECT RAISE(ABORT, 'four-token pre-lifecycle provenance is immutable');\nEND;\n\nCREATE TRIGGER printer_pre_admission_attempt_forbids_pre_lifecycle_provenance\nBEFORE INSERT ON printer_pre_admission_discovery_attempts\nWHEN EXISTS (\n    SELECT 1 FROM printer_four_token_pre_lifecycle_terminal_provenance AS p\n    WHERE p.campaign_id = NEW.campaign_id\n      AND p.campaign_run_id = NEW.campaign_run_id\n      AND p.authoritative_factory_run_id = NEW.authoritative_factory_run_id\n      AND p.proposed_cycle_ordinal = NEW.proposed_cycle_ordinal\n)\nBEGIN\n    SELECT RAISE(ABORT, 'pre-admission attempt contradicts pre-lifecycle provenance');\nEND;\n\nCREATE TRIGGER printer_pre_admission_attempt_immutable_delete\nBEFORE DELETE ON printer_pre_admission_discovery_attempts\nBEGIN\n    SELECT RAISE(ABORT, 'pre-admission attempt is immutable');\nEND;\n\nCOMMIT;\n''', encoding='utf-8')

          adapter_path = Path('src/printer_v1/operator_cli/four_token_factory_adapter.py')
          adapter = adapter_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          adapter = replace_once(
              adapter,
              '''def _required(value: object, label: str) -> str:\n    if not isinstance(value, str) or not value or value != value.strip():\n        raise FourTokenFactoryAdapterError(f"{label} must be a non-empty exact string")\n    return value\n\n\ndef _parse_time''',
              '''def _required(value: object, label: str) -> str:\n    if not isinstance(value, str) or not value or value != value.strip():\n        raise FourTokenFactoryAdapterError(f"{label} must be a non-empty exact string")\n    return value\n\n\ndef _table_exists(connection: sqlite3.Connection, table: str) -> bool:\n    return connection.execute(\n        "SELECT 1 FROM sqlite_master WHERE type='table' AND name=?",\n        (table,),\n    ).fetchone() is not None\n\n\ndef _parse_time''',
              'adapter table helper',
          )

          marker_helpers = '''def _validate_pre_lifecycle_zero_attempt_provenance_shape(\n    connection: sqlite3.Connection,\n    *,\n    campaign_id: str,\n    campaign_run_id: str,\n    factory_run_id: str,\n    cycle_id: str,\n    cycle_ordinal: int,\n    run_status: str | None,\n    terminal_phase: str | None,\n) -> bool:\n    if terminal_phase is None:\n        return False\n    if terminal_phase != "CAMPAIGN_PRE_LIFECYCLE":\n        raise FourTokenFactoryAdapterError(\n            "unsupported four-token terminal phase provenance"\n        )\n    if not _table_exists(\n        connection, "printer_four_token_pre_lifecycle_terminal_provenance"\n    ):\n        raise FourTokenFactoryAdapterError(\n            "pre-lifecycle zero-attempt provenance table is missing"\n        )\n    if int(cycle_ordinal) != 1:\n        raise FourTokenFactoryAdapterError(\n            "pre-lifecycle zero-attempt provenance requires Cycle 1"\n        )\n    if str(run_status or "").strip().upper() == "COMPLETED":\n        raise FourTokenFactoryAdapterError(\n            "completed cycle cannot carry pre-lifecycle zero-attempt provenance"\n        )\n    cycles = connection.execute(\n        "SELECT cycle_id,cycle_ordinal FROM printer_memory_factory_campaign_cycles "\n        "WHERE campaign_id=? AND run_id=? ORDER BY cycle_ordinal",\n        (campaign_id, campaign_run_id),\n    ).fetchall()\n    attempt_count = int(connection.execute(\n        "SELECT COUNT(*) FROM printer_pre_admission_discovery_attempts "\n        "WHERE campaign_id=? AND campaign_run_id=? "\n        "AND authoritative_factory_run_id=? AND proposed_cycle_ordinal=2",\n        (campaign_id, campaign_run_id, factory_run_id),\n    ).fetchone()[0])\n    window_count = int(connection.execute(\n        "SELECT COUNT(*) FROM printer_memory_factory_campaign_windows "\n        "WHERE campaign_id=? AND run_id=? AND cycle_id=?",\n        (campaign_id, campaign_run_id, cycle_id),\n    ).fetchone()[0])\n    existing = int(connection.execute(\n        "SELECT COUNT(*) FROM printer_four_token_pre_lifecycle_terminal_provenance "\n        "WHERE campaign_id=? AND campaign_run_id=? "\n        "AND authoritative_factory_run_id=? AND proposed_cycle_ordinal=2",\n        (campaign_id, campaign_run_id, factory_run_id),\n    ).fetchone()[0])\n    if (\n        len(cycles) != 1\n        or str(cycles[0][0]) != cycle_id\n        or int(cycles[0][1]) != 1\n        or attempt_count != 0\n        or window_count != 0\n        or existing != 0\n    ):\n        raise FourTokenFactoryAdapterError(\n            "pre-lifecycle zero-attempt provenance requires exact persisted shape"\n        )\n    return True\n\n\ndef _insert_pre_lifecycle_zero_attempt_provenance(\n    connection: sqlite3.Connection,\n    *,\n    campaign_id: str,\n    campaign_run_id: str,\n    factory_run_id: str,\n    cycle_id: str,\n    cause: str,\n    recorded_at: str,\n) -> None:\n    try:\n        connection.execute(\n            """INSERT INTO printer_four_token_pre_lifecycle_terminal_provenance(\n                   campaign_id,campaign_run_id,authoritative_factory_run_id,\n                   cycle_id,cycle_ordinal,proposed_cycle_ordinal,terminal_phase,\n                   first_terminal_cause,recorded_at\n               ) VALUES (?,?,?,?,1,2,'CAMPAIGN_PRE_LIFECYCLE',?,?)""",\n            (\n                campaign_id,\n                campaign_run_id,\n                factory_run_id,\n                cycle_id,\n                cause,\n                recorded_at,\n            ),\n        )\n    except sqlite3.Error as exc:\n        raise FourTokenFactoryAdapterError(\n            f"pre-lifecycle zero-attempt provenance insert failed: {exc}"\n        ) from exc\n\n\n'''
          adapter = replace_once(
              adapter,
              'def reconcile_four_token_cycle_terminal(\n',
              marker_helpers + 'def reconcile_four_token_cycle_terminal(\n',
              'adapter marker helpers',
          )
          adapter = replace_once(
              adapter,
              '''    cause: str,\n    run_status: str | None,\n    now: datetime,\n) -> dict[str, Any]:''',
              '''    cause: str,\n    run_status: str | None,\n    now: datetime,\n    terminal_phase: str | None = None,\n) -> dict[str, Any]:''',
              'phase A signature',
          )
          adapter = replace_once(
              adapter,
              '''    if slot_count != 2:\n        raise FourTokenFactoryAdapterError(\n            "filled proof-cycle terminal reconciliation requires exactly two slots"\n        )\n    work_rows = connection.execute(''',
              '''    if slot_count != 2:\n        raise FourTokenFactoryAdapterError(\n            "filled proof-cycle terminal reconciliation requires exactly two slots"\n        )\n    pre_lifecycle_provenance_eligible = (\n        _validate_pre_lifecycle_zero_attempt_provenance_shape(\n            connection,\n            campaign_id=campaign,\n            campaign_run_id=run,\n            factory_run_id=factory,\n            cycle_id=cycle,\n            cycle_ordinal=int(row[0]),\n            run_status=run_status,\n            terminal_phase=terminal_phase,\n        )\n    )\n    work_rows = connection.execute(''',
              'phase A provenance preflight',
          )
          adapter = replace_once(
              adapter,
              '''        connection.commit()\n    transition_state(\n        connection,\n        record_kind="cycle",''',
              '''        connection.commit()\n    pre_lifecycle_provenance_recorded = False\n    if pre_lifecycle_provenance_eligible:\n        _insert_pre_lifecycle_zero_attempt_provenance(\n            connection,\n            campaign_id=campaign,\n            campaign_run_id=run,\n            factory_run_id=factory,\n            cycle_id=cycle,\n            cause=reason,\n            recorded_at=timestamp,\n        )\n        pre_lifecycle_provenance_recorded = True\n    transition_state(\n        connection,\n        record_kind="cycle",''',
              'phase A provenance insert',
          )
          adapter = replace_once(
              adapter,
              '''        "active_owned_jobs": 0,\n        "shared_terminalized": False,\n        "already_terminal": False,\n    }''',
              '''        "active_owned_jobs": 0,\n        "pre_lifecycle_zero_attempt_provenance_recorded": (\n            pre_lifecycle_provenance_recorded\n        ),\n        "shared_terminalized": False,\n        "already_terminal": False,\n    }''',
              'phase A return evidence',
          )

          old_phase_b = '''    rows = connection.execute(\n        "SELECT cycle_ordinal,cycle_state FROM printer_memory_factory_campaign_cycles "\n        "WHERE campaign_id=? AND run_id=? ORDER BY cycle_ordinal",\n        (campaign, run),\n    ).fetchall()\n    admitted_shape = "TWO_CYCLE_COMPLETION"\n    if len(rows) == 1 and [int(item[0]) for item in rows] == [1]:\n        attempt_rows = connection.execute(\n            "SELECT attempt_state,first_terminal_cause,consumed_cycle_id "\n            "FROM printer_pre_admission_discovery_attempts "\n            "WHERE campaign_id=? AND campaign_run_id=? "\n            "AND authoritative_factory_run_id=? AND proposed_cycle_ordinal=2",\n            (campaign, run, factory),\n        ).fetchall()\n        if len(attempt_rows) != 1 or str(attempt_rows[0][0]) not in {\n            "NO_PAIR", "BLOCKED", "FAILED", "CANCELLED"\n        } or not str(attempt_rows[0][1] or "").strip() or attempt_rows[0][2] is not None:\n            raise FourTokenFactoryAdapterError(\n                "one-cycle shared terminal requires exact terminal no-admission evidence"\n            )\n        admitted_shape = "ONE_CYCLE_HONEST_NO_ADMISSION"\n    elif len(rows) != 2 or [int(item[0]) for item in rows] != [1, 2]:\n        raise FourTokenFactoryAdapterError(\n            "shared terminal requires exact admitted-cycle ownership"\n        )\n    if any(not str(item[1]).startswith("TERMINAL_") for item in rows):\n        raise FourTokenFactoryAdapterError(\n            "shared terminal requires both cycles to be terminal"\n        )'''
          new_phase_b = '''    rows = connection.execute(\n        "SELECT cycle_id,cycle_ordinal,cycle_state,first_terminal_cause "\n        "FROM printer_memory_factory_campaign_cycles "\n        "WHERE campaign_id=? AND run_id=? ORDER BY cycle_ordinal",\n        (campaign, run),\n    ).fetchall()\n    ordinals = [int(item[1]) for item in rows]\n    admitted_shape = "TWO_CYCLE_COMPLETION"\n    if len(rows) == 1 and ordinals == [1]:\n        attempt_rows = connection.execute(\n            "SELECT attempt_state,first_terminal_cause,consumed_cycle_id "\n            "FROM printer_pre_admission_discovery_attempts "\n            "WHERE campaign_id=? AND campaign_run_id=? "\n            "AND authoritative_factory_run_id=? AND proposed_cycle_ordinal=2",\n            (campaign, run, factory),\n        ).fetchall()\n        provenance_rows = (\n            connection.execute(\n                "SELECT cycle_id,cycle_ordinal,proposed_cycle_ordinal,terminal_phase,"\n                "first_terminal_cause "\n                "FROM printer_four_token_pre_lifecycle_terminal_provenance "\n                "WHERE campaign_id=? AND campaign_run_id=? "\n                "AND authoritative_factory_run_id=? AND proposed_cycle_ordinal=2",\n                (campaign, run, factory),\n            ).fetchall()\n            if _table_exists(\n                connection, "printer_four_token_pre_lifecycle_terminal_provenance"\n            )\n            else []\n        )\n        honest_no_admission = (\n            len(attempt_rows) == 1\n            and str(attempt_rows[0][0]) in {\n                "NO_PAIR", "BLOCKED", "FAILED", "CANCELLED"\n            }\n            and bool(str(attempt_rows[0][1] or "").strip())\n            and attempt_rows[0][2] is None\n        )\n        if honest_no_admission:\n            if provenance_rows:\n                raise FourTokenFactoryAdapterError(\n                    "one-cycle terminal has contradictory attempt and pre-lifecycle provenance"\n                )\n            admitted_shape = "ONE_CYCLE_HONEST_NO_ADMISSION"\n        elif len(attempt_rows) == 0:\n            cycle_cause = str(rows[0][3] or "").strip()\n            window_count = int(connection.execute(\n                "SELECT COUNT(*) FROM printer_memory_factory_campaign_windows "\n                "WHERE campaign_id=? AND run_id=? AND cycle_id=?",\n                (campaign, run, str(rows[0][0])),\n            ).fetchone()[0])\n            if (\n                len(provenance_rows) != 1\n                or str(provenance_rows[0][0]) != str(rows[0][0])\n                or int(provenance_rows[0][1]) != 1\n                or int(provenance_rows[0][2]) != 2\n                or str(provenance_rows[0][3]) != "CAMPAIGN_PRE_LIFECYCLE"\n                or not cycle_cause\n                or str(provenance_rows[0][4] or "").strip() != cycle_cause\n                or window_count != 0\n            ):\n                raise FourTokenFactoryAdapterError(\n                    "one-cycle shared terminal requires exact pre-lifecycle zero-attempt provenance"\n                )\n            admitted_shape = "ONE_CYCLE_PRE_LIFECYCLE_ZERO_ATTEMPT"\n        else:\n            raise FourTokenFactoryAdapterError(\n                "one-cycle shared terminal requires exact terminal no-admission evidence"\n            )\n    elif len(rows) != 2 or ordinals != [1, 2]:\n        raise FourTokenFactoryAdapterError(\n            "shared terminal requires exact admitted-cycle ownership"\n        )\n    if any(not str(item[2]).startswith("TERMINAL_") for item in rows):\n        raise FourTokenFactoryAdapterError(\n            "shared terminal requires both cycles to be terminal"\n        )'''
          adapter = replace_once(adapter, old_phase_b, new_phase_b, 'phase B shape classifier')
          adapter_path.write_text(adapter, encoding='utf-8')

          factory_path = Path('src/printer_v1/operator_cli/one_command_15m_factory.py')
          factory = factory_path.read_text(encoding='utf-8')
          factory = replace_once(
              factory,
              '''    four_token_attempt_terminal_cause: str | None = None\n    if lifecycle_operation_observer is not None:''',
              '''    four_token_attempt_terminal_cause: str | None = None\n    four_token_cycle_one_opening_completed = False\n    if lifecycle_operation_observer is not None:''',
              'factory phase witness initialization',
          )
          factory = replace_once(
              factory,
              '''                cycle_ordinal=1,\n                four_token_proof=bool(four_token_proof_controller is not None),\n            )\n        conn.commit()''',
              '''                cycle_ordinal=1,\n                four_token_proof=bool(four_token_proof_controller is not None),\n            )\n            if four_token_proof_controller is not None:\n                four_token_cycle_one_opening_completed = True\n        conn.commit()''',
              'factory phase witness transition',
          )
          factory = replace_once(
              factory,
              '''                        run_status=cycle_run_status,\n                        now=_now(),\n                    )''',
              '''                        run_status=cycle_run_status,\n                        now=_now(),\n                        terminal_phase=(\n                            "CAMPAIGN_PRE_LIFECYCLE"\n                            if (\n                                str(admitted[0]) == str(cycle_id)\n                                and not four_token_cycle_one_opening_completed\n                            )\n                            else None\n                        ),\n                    )''',
              'factory Phase A provenance signal',
          )
          factory_path.write_text(factory, encoding='utf-8')
          PY
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Focused GREEN and disposable proof
        run: |
          python -m pytest -q \
            tests/test_v2_9_8b_shared_terminal_pre_lifecycle_zero_attempt.py \
            tests/test_v2_9_8b_shared_terminal_pre_lifecycle_factory_integration.py \
            tests/test_v2_9_8b_four_token_factory_terminal_integration.py \
            tests/test_v2_9_8b_four_token_gate_g_two_phase_terminal.py \
            tests/test_v2_9_8b_pre_admission_later_cycle_callback.py
          python -m py_compile \
            src/printer_v1/operator_cli/four_token_factory_adapter.py \
            src/printer_v1/operator_cli/one_command_15m_factory.py
          git diff --check
      - name: Commit verified implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/v2-9-8b-focused-red.yml
          git config user.name "Printer V1 Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            migrations/056_four_token_pre_lifecycle_terminal_provenance.sql \
            src/printer_v1/operator_cli/four_token_factory_adapter.py \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            .github/workflows/v2-9-8b-focused-red.yml
          git diff --cached --check
          git commit -m "Implement pre-lifecycle zero-attempt shared terminal repair"
          git push origin HEAD:agent/v2-9-8b-shared-terminal-pre-lifecycle-repair
