name: V2-9.8B focused RED

on:
  push:
    branches:
      - agent/v2-9-8b-shared-terminal-pre-lifecycle-repair

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Prove intended RED
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_v2_9_8b_shared_terminal_pre_lifecycle_zero_attempt.py \
            -k 'exact_pre_lifecycle_zero_attempt_shape_terminalizes_with_provenance or forward_only_migration_056_is_present' \
            2>&1 | tee /tmp/focused-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Focused RED unexpectedly passed before implementation.' >&2
            exit 1
          fi
          if ! grep -Eq \
            'one-cycle shared terminal requires exact terminal no-admission evidence|056_four_token_pre_lifecycle_terminal_provenance.sql' \
            /tmp/focused-red.log; then
            echo 'Focused RED failed for an unrelated reason.' >&2
            exit 1
          fi
          echo 'Focused RED confirmed for the intended missing terminal shape/migration.'
