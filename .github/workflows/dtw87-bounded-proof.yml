name: DTW-87 Bounded Deterministic Proof

on:
  pull_request:
    branches:
      - agent/v2-9-8b-dtw87-bounded-proof-runner-base

permissions:
  contents: read

jobs:
  bounded-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: DTW-87 bounded authority projection proof
        run: python -m unittest tests/test_dtw87_activation_route_bounded_proof.py
      - name: Focused DTW-86 readiness regression
        run: python -m unittest tests/test_v2_9_7e_45_pilot_input_readiness.py
