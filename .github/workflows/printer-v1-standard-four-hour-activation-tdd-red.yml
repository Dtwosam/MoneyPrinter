name: Printer V1 standard 4h activation TDD RED

on:
  pull_request:
    branches:
      - agent/v2-9-8b-post-dtw100-standard-four-hour-activation-tdd-runner-base

permissions:
  contents: read

jobs:
  activation-red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert exact RED head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a49efc683b8e07da52fc7f8f47451ba0d8748190"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project
        run: python -m pip install -e .

      - name: Compile existing activation surfaces and RED test
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/operational_memory_factory_command.py \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            src/printer_v1/operator_cli/one_token_4h_runtime.py \
            src/printer_v1/operator_cli/window_15m_one_shot_wrapper.py \
            src/printer_v1/operator_cli/window_15m_child_terminal.py \
            src/printer_v1/operator_cli/git_provenance_authorization_manifest.py \
            src/printer_v1/snapshots/cadence_policy.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_operational_activation.py

      - name: Run directly affected RED suite
        id: red_tests
        continue-on-error: true
        run: |
          python -m unittest -v \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_operational_activation \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_eligible_subset \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_campaign_handoff \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_policy_capacity \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_collection_state_accounting \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_close_memory_terminal_reconciliation \
            tests.test_v2_9_8b_window_15m_one_shot_wrapper \
            tests.test_v2_9_7d_4a_token_local_selective_continuation

      - name: Preserve downstream locks during RED
        if: always()
        run: |
          python - <<'PY'
          from printer_v1.snapshots.cadence_policy import get_policy
          for lane in ("TRACK_FAST", "TRACK_NORMAL"):
              for window_kind in ("WINDOW_12H", "WINDOW_24H"):
                  policy = get_policy(window_kind, lane)
                  assert policy is not None
                  assert policy.enabled_for_real_collection is False
          PY
          git diff --check

      - name: Assert RED was observed
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.red_tests.outcome }}" != "failure" ]; then
            echo "Expected activation contract to be RED, got ${{ steps.red_tests.outcome }}" >&2
            exit 2
          fi
          echo "Expected activation RED observed."
