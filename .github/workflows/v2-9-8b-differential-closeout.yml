name: V2-9.8B bounded differential closeout

on:
  push:
    branches:
      - agent/v2-9-8b-persistent-multisource-fresh-acquisition-implementation

permissions:
  contents: read

jobs:
  focused-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run focused V2-9.8B closeout proof
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -e . pytest
          python -m compileall -q src/printer_v1
          PYTHONPATH=src python -m pytest -q \
            tests/test_v2_9_8b_persistent_multisource_refresh.py \
            tests/test_v2_9_8b_persistent_refresh_owner_proof.py \
            tests/test_v2_9_8b_migration_057_upgrade.py \
            tests/test_v2_9_8b_window_15m_final_integrated_readiness_repair.py
          git diff --check

  differential-regression:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare current failures with approved design baseline
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: '6'
          BASELINE: c9fb16b8f214e4e527f574e7c7dcbeb5cf351455
        run: |
          set -euo pipefail
          python -m pip install -q -e . pytest pytest-timeout
          python -m compileall -q src/printer_v1
          git worktree add --detach /tmp/v298b-baseline "$BASELINE"

          mapfile -t ALL_FILES < <(find tests -maxdepth 1 -type f -name 'test*.py' | sort)
          CURRENT_FILES=()
          BASELINE_FILES=()
          idx=0
          for file in "${ALL_FILES[@]}"; do
            if (( idx % SHARD_COUNT == SHARD )); then
              CURRENT_FILES+=("$file")
              if [[ -f "/tmp/v298b-baseline/$file" ]]; then
                BASELINE_FILES+=("$file")
              fi
            fi
            idx=$((idx + 1))
          done

          echo "Shard $SHARD: ${#CURRENT_FILES[@]} current files; ${#BASELINE_FILES[@]} baseline counterparts"

          set +e
          env PYTHONPATH="$GITHUB_WORKSPACE/src" python -m pytest -q \
            --timeout=45 --timeout-method=thread \
            --junitxml=/tmp/current.xml "${CURRENT_FILES[@]}"
          current_rc=$?
          set -e
          echo "Current shard exit: $current_rc"

          if (( ${#BASELINE_FILES[@]} > 0 )); then
            set +e
            (
              cd /tmp/v298b-baseline
              env PYTHONPATH="/tmp/v298b-baseline/src" python -m pytest -q \
                --timeout=45 --timeout-method=thread \
                --junitxml=/tmp/baseline.xml "${BASELINE_FILES[@]}"
            )
            baseline_rc=$?
            set -e
          else
            baseline_rc=0
            printf '%s\n' '<testsuites />' > /tmp/baseline.xml
          fi
          echo "Baseline shard exit: $baseline_rc"

          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def read(path):
              root = ET.parse(path).getroot()
              seen = set()
              failed = set()
              for case in root.iter('testcase'):
                  file_name = case.get('file') or case.get('classname') or ''
                  name = case.get('name') or ''
                  key = (file_name, name)
                  seen.add(key)
                  if case.find('failure') is not None or case.find('error') is not None:
                      failed.add(key)
              return seen, failed

          current_seen, current_failed = read('/tmp/current.xml')
          baseline_seen, baseline_failed = read('/tmp/baseline.xml')

          new_regressions = sorted(
              key for key in current_failed
              if key not in baseline_failed
          )
          baseline_debt = sorted(
              key for key in current_failed
              if key in baseline_failed
          )

          print(f"SHARD_SUMMARY shard={os.environ['SHARD']} current_cases={len(current_seen)} current_failures={len(current_failed)} baseline_cases={len(baseline_seen)} baseline_debt={len(baseline_debt)} new_regressions={len(new_regressions)}")
          for key in baseline_debt:
              print('BASELINE_DEBT', key)
          for key in new_regressions:
              print('NEW_REGRESSION', key)

          if new_regressions:
              raise SystemExit(1)
          PY

          git diff --check
