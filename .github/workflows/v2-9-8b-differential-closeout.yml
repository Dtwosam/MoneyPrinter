name: V2-9.8B risk-based closeout

on:
  push:
    branches:
      - agent/v2-9-8b-persistent-multisource-fresh-acquisition-implementation

permissions:
  contents: read

jobs:
  focused-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run focused V2-9.8B closeout proof
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -e . pytest
          python -m compileall -q src/printer_v1
          PYTHONPATH=src python -m pytest -q \
            tests/test_v2_9_8b_persistent_multisource_refresh.py \
            tests/test_v2_9_8b_persistent_refresh_owner_proof.py \
            tests/test_v2_9_8b_migration_057_upgrade.py \
            tests/test_v2_9_8b_window_15m_final_integrated_readiness_repair.py
          git diff --check

  impacted-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run directly impacted cross-cutting regression
        shell: bash
        env:
          BASELINE: c9fb16b8f214e4e527f574e7c7dcbeb5cf351455
        run: |
          set -euo pipefail
          python -m pip install -q -e . pytest pytest-timeout
          python -m compileall -q src/printer_v1

          python - <<'PY' > /tmp/selected.txt
          from pathlib import Path

          needles = (
              'pre_lifecycle_refresh',
              'pre_lifecycle_temporal',
              'pre_lifecycle_persistent_refresh_owner',
              'pre_lifecycle_refresh_work',
              'eligible_token_supply',
              'permanent_discovery_availability',
              'campaign_active_work',
              'operational_memory_factory_command',
              'four_token_proof_one_shot_wrapper',
              'graduated_supply_front_door',
              'DISCOVERY_REFRESH',
              'printer_pre_lifecycle_discovery_refresh_work',
              'migration_057',
          )
          selected = []
          for path in sorted(Path('tests').glob('test*.py')):
              text = path.read_text(errors='ignore')
              if any(needle in text for needle in needles):
                  selected.append(path.as_posix())
          for path in selected:
              print(path)
          PY

          mapfile -t SELECTED < /tmp/selected.txt
          if (( ${#SELECTED[@]} == 0 )); then
            echo 'No directly impacted regression tests selected'
            exit 1
          fi
          echo "Selected ${#SELECTED[@]} directly impacted test files"
          printf '%s\n' "${SELECTED[@]}"

          set +e
          env PYTHONPATH="$GITHUB_WORKSPACE/src" python -m pytest -q \
            --timeout=30 --timeout-method=thread \
            --junitxml=/tmp/current.xml "${SELECTED[@]}"
          current_rc=$?
          set -e

          if [[ $current_rc -eq 0 ]]; then
            echo 'IMPACTED_REGRESSION_PASS: current directly impacted suite is green'
            git diff --check
            exit 0
          fi

          echo "Current impacted suite returned $current_rc; classifying against approved design baseline"
          git worktree add --detach /tmp/v298b-baseline "$BASELINE"
          BASELINE_FILES=()
          for file in "${SELECTED[@]}"; do
            if [[ -f "/tmp/v298b-baseline/$file" ]]; then
              BASELINE_FILES+=("$file")
            fi
          done
          if (( ${#BASELINE_FILES[@]} > 0 )); then
            set +e
            (
              cd /tmp/v298b-baseline
              env PYTHONPATH="/tmp/v298b-baseline/src" python -m pytest -q \
                --timeout=30 --timeout-method=thread \
                --junitxml=/tmp/baseline.xml "${BASELINE_FILES[@]}"
            )
            set -e
          else
            printf '%s\n' '<testsuites />' > /tmp/baseline.xml
          fi

          python - <<'PY'
          import xml.etree.ElementTree as ET

          def read(path):
              root = ET.parse(path).getroot()
              seen = set()
              failed = set()
              for case in root.iter('testcase'):
                  file_name = case.get('file') or case.get('classname') or ''
                  name = case.get('name') or ''
                  key = (file_name, name)
                  seen.add(key)
                  if case.find('failure') is not None or case.find('error') is not None:
                      failed.add(key)
              return seen, failed

          current_seen, current_failed = read('/tmp/current.xml')
          baseline_seen, baseline_failed = read('/tmp/baseline.xml')
          new_regressions = sorted(key for key in current_failed if key not in baseline_failed)
          baseline_debt = sorted(key for key in current_failed if key in baseline_failed)

          print(
              'IMPACTED_REGRESSION_SUMMARY '
              f'current_cases={len(current_seen)} current_failures={len(current_failed)} '
              f'baseline_cases={len(baseline_seen)} baseline_debt={len(baseline_debt)} '
              f'new_regressions={len(new_regressions)}'
          )
          for key in baseline_debt:
              print('BASELINE_DEBT', key)
          for key in new_regressions:
              print('NEW_REGRESSION', key)
          if new_regressions:
              raise SystemExit(1)
          PY

          git diff --check
