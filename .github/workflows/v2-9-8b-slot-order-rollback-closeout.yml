name: V2-9.8B slot-order rollback closeout

on:
  push:
    branches:
      - agent/v2-9-8b-four-token-slot-order-rollback-repair

jobs:
  closeout:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run directly affected regressions
        run: |
          python -m pytest -q \
            tests/test_v2_9_8b_four_token_slot_order_rollback_repair.py \
            tests/test_v2_9_8b_four_token_consumed_proof_blocker_tdd.py \
            tests/test_v2_9_8b_pre_admission_later_cycle_callback.py
      - name: Compile changed production module
        run: python -m py_compile src/printer_v1/operator_cli/one_command_15m_factory.py
      - name: Check repair diff hygiene
        run: git diff --check 3c8ab8612814d63ab9dcfde4220568302e0a5933...HEAD
