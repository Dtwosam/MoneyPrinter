name: DTW-61 Required Identity Presence RED

on:
  pull_request:
    branches:
      - tmp/dtw61-red-orchestration
    types: [opened]

permissions:
  contents: read

env:
  DESIGN_HEAD: 90893fbbc0cfe5406e07a99ae26c9a84deaccb09
  RED_HEAD: d529c830d63fae6a4d49b1e3aa1af83a705e91e0
  TEST_FILE: tests/test_v2_9_8b_window_15m_checkpoint8_dtw61_required_identity_presence_red.py

jobs:
  deterministic-red:
    if: github.event.pull_request.head.ref == 'tmp/dtw61-red-trigger'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RED_HEAD }}
          fetch-depth: 5

      - name: Verify test-only RED state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RED_HEAD"
          test "$(git diff --name-only "$DESIGN_HEAD" "$RED_HEAD")" = "$TEST_FILE"
          test -z "$(git diff --name-only "$DESIGN_HEAD" "$RED_HEAD" -- src scripts)"
          git diff --check "$DESIGN_HEAD" "$RED_HEAD"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile RED test
        shell: bash
        run: python -m py_compile "$TEST_FILE"

      - name: Execute accepted DTW-61 RED only
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -uo pipefail
          set +e
          pytest -q "$TEST_FILE" 2>&1 | tee /tmp/dtw61-red.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "DTW61_PYTEST_RC=$RC"
          test "$RC" -ne 0
          if grep -Eq "ERROR at setup|ERROR collecting|SyntaxError|sqlite3\.IntegrityError" /tmp/dtw61-red.log; then
            echo "DTW61_INVALID_RED_SETUP_OR_FIXTURE_ERROR"
            exit 1
          fi
          grep -Eq "19 failed, 2 passed|2 passed, 19 failed" /tmp/dtw61-red.log
          grep -q "TERMINAL_REPORT_IDENTITY_MISSING" /tmp/dtw61-red.log
          grep -q "REPORT_REPLAY_IDENTITY_MISSING" /tmp/dtw61-red.log
          grep -q "REPORT_REPLAY_PROOF_EXPECTATION_IDENTITY_MISSING" /tmp/dtw61-red.log
          echo "DTW61_ACCEPTED_RED_OBSERVED"
