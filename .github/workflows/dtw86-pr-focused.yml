name: DTW-86 PR Focused TDD

on:
  pull_request:
    branches:
      - agent/v2-9-8b-dtw86-focused-tdd-runner-base

permissions:
  contents: read

jobs:
  focused-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and focused test dependency
        run: python -m pip install -e . pytest
      - name: Focused pilot-input readiness suite
        run: python -m unittest tests/test_v2_9_7e_45_pilot_input_readiness.py
      - name: Nearest runtime-blocker regression suite
        run: python -m pytest -q tests/test_v2_9_8b_remaining_runtime_blocker_repair.py
