name: V2-9.8B four-token terminal report proof

on:
  pull_request:
    branches:
      - proof/v2-9-8b-four-token-terminal-report-ci-base

permissions:
  contents: read

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Run four-token terminal report/replay regression
        run: |
          python -m pytest -q tests/test_v2_9_8b_four_token_terminal_report_replay.py
