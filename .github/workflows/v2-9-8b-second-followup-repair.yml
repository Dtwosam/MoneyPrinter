name: V2-9.8B second follow-up lease repair

on:
  push:
    branches:
      - review/v2-9-8b-interrupted-four-token-second-followup-ci

permissions:
  contents: write

jobs:
  repair-and-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout ephemeral repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest
          python -m pip install -e .

      - name: Run red-green repair and focused proof
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/src" python .github/scripts/v2_9_8b_second_followup_repair.py

      - name: Reconstruct exact product commit on reviewed parent
        shell: bash
        env:
          TARGET: review/v2-9-8b-interrupted-four-token-followup-repair
        run: |
          set -euo pipefail
          BASE=48a4ef5005b5b8e45f40e96d0137deb033a2a0a9
          PATCH=/tmp/second-followup-product.patch
          test -s "$PATCH"

          git fetch origin "$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$BASE" || {
            echo "STOP: reviewed repair branch moved from approved parent"
            exit 1
          }

          git checkout --detach "$BASE"
          git apply "$PATCH"
          git diff --check

          changed="$(git diff --name-only "$BASE")"
          expected=$'docs/printer-v1-v2-9-8b-post-consumption-interrupted-four-token-lease-failure-cleanup-production-implementation-closeout.md\nsrc/printer_v1/operator_cli/campaign_supervision.py'
          test "$changed" = "$expected" || {
            echo "STOP: unexpected product commit scope"
            printf '%s\n' "$changed"
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/printer-v1-v2-9-8b-post-consumption-interrupted-four-token-lease-failure-cleanup-production-implementation-closeout.md \
            src/printer_v1/operator_cli/campaign_supervision.py
          git commit -m "Repair bounded lease preflight under concurrent writers"
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET"
          echo "SECOND_FOLLOWUP_REPAIR_SHA=$NEW_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
