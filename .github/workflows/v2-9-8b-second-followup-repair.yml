name: V2-9.8B second follow-up lease repair

on:
  push:
    branches:
      - review/v2-9-8b-interrupted-four-token-second-followup-ci

permissions:
  contents: write

jobs:
  repair-and-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trigger branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset to reviewed repair baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=48a4ef5005b5b8e45f40e96d0137deb033a2a0a9
          git checkout --detach "$BASE"
          test "$(git rev-parse HEAD)" = "$BASE"
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest
          python -m pip install -e .

      - name: Confirm import origin
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/src" python - <<'PY'
          import pathlib
          import printer_v1.operator_cli.campaign_supervision as cs
          import printer_v1.operator_cli.four_token_factory_adapter as fa
          root = pathlib.Path.cwd().resolve() / "src"
          for module in (cs, fa):
              path = pathlib.Path(module.__file__).resolve()
              print(path)
              assert path.is_relative_to(root), (path, root)
          print("IMPORT_ORIGIN=PASS")
          PY

      - name: Reproduce reviewed RED regression
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH="$PWD/src" python -m pytest -q \
            tests/test_v2_9_8b_20_sqlite_heartbeat_concurrency.py::TestProductionLockPatternAndRepair::test_many_heartbeats_under_concurrent_operational_writers \
            2>&1 | tee /tmp/baseline-red.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "BASELINE_RED_RC=$rc"
          test "$rc" -ne 0

      - name: Apply narrow bounded-preflight repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/printer_v1/operator_cli/campaign_supervision.py")
          text = path.read_text(encoding="utf-8")
          start_marker = "    def _renewal_block_preflight(planned_block: float) -> None:\n"
          end_marker = "\n    def _failure_return(exc: BaseException) -> dict[str, Any]:\n"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("STOP: renewal preflight start marker missing")
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("STOP: renewal preflight end marker missing")
          if text.find(start_marker, start + len(start_marker)) >= 0:
              raise SystemExit("STOP: multiple renewal preflight blocks found")

          new = '''    def _renewal_block_preflight(planned_block: float) -> None:
              planned = float(planned_block)
              remaining_deadline = renewal_deadline - time.monotonic()
              if (
                  planned < LEASE_CONTENTION_MIN_BLOCK_SECONDS
                  or remaining_deadline < LEASE_CONTENTION_MIN_BLOCK_SECONDS
                  or planned > remaining_deadline
              ):
                  raise sqlite3.OperationalError("database is locked")
              if previous_expiry_iso is None:
                  raise CampaignSupervisionError(
                      "lease renewal preflight has no prior expiry"
                  )

              # The ledger re-read is itself a blocking action. Reserve enough
              # deadline and lease lifetime for the *next* requested block, then
              # give this read at most the existing 2s SQLite busy ceiling.
              prior_remaining_lease = (
                  _parse(previous_expiry_iso) - _renewal_now()
              ).total_seconds()
              if prior_remaining_lease <= 0:
                  raise CampaignSupervisionError(
                      "operational campaign lease is expired"
                  )
              preflight_timeout = min(
                  SQLITE_BUSY_TIMEOUT_SECONDS,
                  remaining_deadline - planned,
                  prior_remaining_lease
                  - LEASE_CONTENTION_REMAINING_SAFETY_SECONDS
                  - planned,
              )
              if preflight_timeout < LEASE_CONTENTION_MIN_BLOCK_SECONDS:
                  raise sqlite3.OperationalError("database is locked")

              preflight = _connect(
                  db_path,
                  read_only=True,
                  busy_timeout_seconds=preflight_timeout,
              )
              try:
                  current = _load_exact(
                      preflight,
                      supervision_id=supervision_id,
                      campaign_id=campaign_id,
                      configuration_id=configuration_id,
                      run_id=run_id,
                      owner_id=owner_id,
                  )
                  if str(current["supervision_state"]) != "ACTIVE":
                      raise CampaignSupervisionError(
                          "campaign supervision is not renewable"
                      )

                  # The bounded re-read may itself have waited. Recompute all
                  # safety predicates before the next BEGIN/sleep is permitted.
                  remaining_deadline = renewal_deadline - time.monotonic()
                  if (
                      remaining_deadline < LEASE_CONTENTION_MIN_BLOCK_SECONDS
                      or planned > remaining_deadline
                  ):
                      raise sqlite3.OperationalError("database is locked")
                  remaining_lease = (
                      _parse(str(current["lease_expires_at"])) - _renewal_now()
                  ).total_seconds()
                  if remaining_lease <= 0:
                      raise CampaignSupervisionError(
                          "operational campaign lease is expired"
                      )
                  if (
                      remaining_lease <= LEASE_CONTENTION_REMAINING_SAFETY_SECONDS
                      or remaining_lease - planned
                      <= LEASE_CONTENTION_REMAINING_SAFETY_SECONDS
                  ):
                      raise sqlite3.OperationalError("database is locked")
              finally:
                  preflight.close()
'''
          path.write_text(text[:start] + new + text[end:], encoding="utf-8")
          PY
          git diff -- src/printer_v1/operator_cli/campaign_supervision.py
          git diff --check

      - name: Prove former concurrency regression GREEN
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/src" python -m pytest -q \
            tests/test_v2_9_8b_20_sqlite_heartbeat_concurrency.py::TestProductionLockPatternAndRepair::test_many_heartbeats_under_concurrent_operational_writers \
            2>&1 | tee /tmp/isolated-green.log

      - name: Run corrected focused proof
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/src" python -m pytest -q \
            tests/test_v2_9_8b_lease_renewal_sqlite_contention_bound.py \
            tests/test_v2_9_8b_interrupted_cycle2_parent_interrupt_cleanup.py \
            tests/test_v2_9_8b_interrupted_four_token_followup_repair.py \
            tests/test_v2_9_8b_20_sqlite_heartbeat_concurrency.py::TestProductionLockPatternAndRepair \
            tests/test_v2_9_8b_four_token_gate_g_two_phase_terminal.py \
            tests/test_v2_9_8b_shared_terminal_pre_lifecycle_zero_attempt.py \
            tests/test_v2_9_8b_pre_admission_terminal_cleanup_repair.py \
            2>&1 | tee /tmp/focused-green.log

      - name: Compile and diff checks
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/src" python -m py_compile \
            src/printer_v1/operator_cli/campaign_supervision.py \
            src/printer_v1/operator_cli/four_token_factory_adapter.py
          git diff --check
          changed="$(git diff --name-only 48a4ef5005b5b8e45f40e96d0137deb033a2a0a9)"
          printf '%s\n' "$changed"
          test "$changed" = "src/printer_v1/operator_cli/campaign_supervision.py"

      - name: Append second follow-up closeout evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          closeout = Path("docs/printer-v1-v2-9-8b-post-consumption-interrupted-four-token-lease-failure-cleanup-production-implementation-closeout.md")
          if not closeout.is_file():
              raise SystemExit("STOP: production closeout missing")
          isolated = Path("/tmp/isolated-green.log").read_text(encoding="utf-8").strip().splitlines()[-1]
          focused = Path("/tmp/focused-green.log").read_text(encoding="utf-8").strip().splitlines()[-1]
          addition = f'''\n\n## Second follow-up repair — bounded preflight-read contention\n\nBaseline: `48a4ef5005b5b8e45f40e96d0137deb033a2a0a9`.\n\nThe corrected proof exposed one regression introduced by the first follow-up: the per-block safety re-read used a zero-timeout auxiliary SQLite reader and could therefore convert a legitimate short concurrent writer commit into immediate `SQLITE_LOCK_CONTENTION`.\n\nThe second follow-up preserves the approved 15.0s hard renewal deadline, 15.0s remaining-lease safety margin, outer/inner caps, DB-first/file-second renewal authority, and fail-closed ownership/expiry checks. The auxiliary ledger re-read now receives only a bounded timeout that fits the same fixed deadline and the most recently proven lease expiry while reserving time for the next requested block. After that read returns, deadline and lease-safety predicates are recomputed before the next `BEGIN IMMEDIATE` or sleep may start. No global SQLite timeout, journal mode, Source Governor, Scheduler, recovery, or capability behavior changed.\n\nIsolated former regression: `{isolated}`.\n\nCorrected focused proof: `{focused}`.\n\n`py_compile` and `git diff --check`: PASS.\n\nThe CI runner contained no authoritative consumed-run database or live residue and performed no provider or Scheduler runtime work. The preceding operator-local corrected proof established the authoritative DB remained `c90376b9e26d0f2953a8d9b2fd5fee01d80ac4984510113e595fd1ccc3d9033d` with Cycle-2 attempt RUNNING, Scheduler job 2808 PENDING, supervision ACTIVE, and lease present. This repair does not authorize residue reconciliation.\n\nVerdict:\n\n`V2_9_8B_POST_CONSUMPTION_INTERRUPTED_FOUR_TOKEN_LEASE_FAILURE_CLEANUP_SECOND_FOLLOWUP_REPAIR_PASS`\n'''
          closeout.write_text(closeout.read_text(encoding="utf-8") + addition, encoding="utf-8")
          PY
          git diff --check

      - name: Commit and fast-forward reviewed repair branch
        shell: bash
        env:
          TARGET: review/v2-9-8b-interrupted-four-token-followup-repair
        run: |
          set -euo pipefail
          BASE=48a4ef5005b5b8e45f40e96d0137deb033a2a0a9
          git fetch origin "$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$BASE" || {
            echo "STOP: target review branch moved from approved baseline"
            exit 1
          }
          changed="$(git diff --name-only "$BASE")"
          expected=$'docs/printer-v1-v2-9-8b-post-consumption-interrupted-four-token-lease-failure-cleanup-production-implementation-closeout.md\nsrc/printer_v1/operator_cli/campaign_supervision.py'
          test "$changed" = "$expected" || {
            echo "STOP: unexpected changed files"
            printf '%s\n' "$changed"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/printer_v1/operator_cli/campaign_supervision.py \
            docs/printer-v1-v2-9-8b-post-consumption-interrupted-four-token-lease-failure-cleanup-production-implementation-closeout.md
          git commit -m "Repair bounded lease preflight under concurrent writers"
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET"
          echo "SECOND_FOLLOWUP_REPAIR_SHA=$NEW_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
