name: DTW93 local validation observer PR trigger

on:
  pull_request:
    branches:
      - agent/v2-9-8b-post-dtw93-local-validation-observer-repair-design

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-9-8b-post-dtw93-local-validation-observer-repair-implementation
          fetch-depth: 0

      - name: Apply exact repair from frozen helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          helper = Path('.github/workflows/dtw93-local-validation-observer-implementation.yml')
          text = helper.read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if text.count(start) != 1:
              raise SystemExit(f'embedded patch start count={text.count(start)}')
          body = text.split(start, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(body), str(helper), 'exec'), {})
          PY

      - name: Focused offline verification
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q \
            src/printer_v1/discovery/permanent_discovery_availability.py \
            src/printer_v1/discovery/eligible_token_supply.py \
            tests/test_v2_9_8b_post_dtw93_local_validation_observer.py
          python -m unittest \
            tests.test_v2_9_8b_post_dtw93_local_validation_observer -v

      - name: Commit implementation and remove temporary helpers
        shell: bash
        run: |
          git config user.name "DTW93 Observer Repair"
          git config user.email "actions@users.noreply.github.com"
          git rm \
            .github/workflows/dtw93-local-validation-observer-implementation.yml \
            .github/workflows/dtw93-local-validation-observer-pr-trigger.yml
          git add \
            src/printer_v1/discovery/permanent_discovery_availability.py \
            src/printer_v1/discovery/eligible_token_supply.py \
            tests/test_v2_9_8b_post-dtw93-local-validation-observer.py 2>/dev/null || true
          git add tests/test_v2_9_8b_post_dtw93_local_validation_observer.py
          git diff --cached --check
          git commit -m "Repair protocol local validation observer wiring"
          git push origin HEAD:agent/v2-9-8b-post-dtw93-local-validation-observer-repair-implementation
