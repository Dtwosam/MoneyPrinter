name: DTW93 local validation observer PR trigger

on:
  pull_request:
    branches:
      - agent/v2-9-8b-post-dtw93-local-validation-observer-repair-design

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-9-8b-post-dtw93-local-validation-observer-repair-implementation
          fetch-depth: 0

      - name: Apply exact line-anchored observer repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def insert_once(lines, anchor, additions, *, start=0, end=None, label='anchor'):
              end = len(lines) if end is None else end
              matches = [i for i in range(start, end) if lines[i] == anchor]
              if len(matches) != 1:
                  raise SystemExit(f'{label} count={len(matches)}')
              i = matches[0]
              lines[i + 1:i + 1] = additions
              return i

          permanent = Path('src/printer_v1/discovery/permanent_discovery_availability.py')
          lines = permanent.read_text(encoding='utf-8').splitlines()
          fn = lines.index('def process_protocol_confirmation_queue(')
          fn_end = next(i for i in range(fn, fn + 40) if lines[i] == ') -> dict[str, Any]:')
          insert_once(
              lines,
              '    transport_identity_observer: Any | None = None,',
              ['    local_validation_identity_observer: Any | None = None,'],
              start=fn,
              end=fn_end + 1,
              label='protocol observer parameter',
          )
          validation_for = insert_once(
              lines,
              '                for item in local_validation_identities',
              [],
              start=fn,
              label='bound validation loop',
          )
          close_index = validation_for + 1
          if lines[close_index] != '            ]':
              raise SystemExit(f'bound validation close mismatch={lines[close_index]!r}')
          lines[close_index + 1:close_index + 1] = [
              '            if local_validation_identity_observer is not None:',
              '                for validation in bound_validations:',
              '                    local_validation_identity_observer(validation)',
          ]
          permanent.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          eligible = Path('src/printer_v1/discovery/eligible_token_supply.py')
          lines = eligible.read_text(encoding='utf-8').splitlines()

          def wire_call(call_anchor, stage_sequence, label):
              starts = [i for i, line in enumerate(lines) if line.strip() == call_anchor]
              if len(starts) != 1:
                  raise SystemExit(f'{label} call count={len(starts)}')
              start = starts[0]
              end = next(
                  i for i in range(start, min(start + 40, len(lines)))
                  if lines[i].strip() == f'stage_sequence={stage_sequence},'
              )
              observer = next(
                  (i for i in range(start, end) if lines[i].strip() == 'transport_identity_observer=transport_identity_observer,'),
                  None,
              )
              if observer is None:
                  raise SystemExit(f'{label} transport observer missing')
              indent = lines[observer][: len(lines[observer]) - len(lines[observer].lstrip())]
              lines[observer + 1:observer + 1] = [
                  indent + 'local_validation_identity_observer=(',
                  indent + '    local_validation_identity_observer',
                  indent + '),',
              ]

          wire_call('early_protocol = _early_protocol(', 1, 'early protocol')
          wire_call('residual_protocol = process_protocol_confirmation_queue(', 2, 'residual protocol')
          eligible.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Focused offline verification
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q \
            src/printer_v1/discovery/permanent_discovery_availability.py \
            src/printer_v1/discovery/eligible_token_supply.py \
            tests/test_v2_9_8b_post_dtw93_local_validation_observer.py
          python tests/test_v2_9_8b_post_dtw93_local_validation_observer.py -v

      - name: Commit implementation and remove temporary helpers
        shell: bash
        run: |
          git config user.name 'DTW93 Observer Repair'
          git config user.email 'actions@users.noreply.github.com'
          git rm \
            .github/workflows/dtw93-local-validation-observer-implementation.yml \
            .github/workflows/dtw93-local-validation-observer-pr-trigger.yml
          git add \
            src/printer_v1/discovery/permanent_discovery_availability.py \
            src/printer_v1/discovery/eligible_token_supply.py \
            tests/test_v2_9_8b_post_dtw93_local_validation_observer.py
          git diff --cached --check
          git commit -m 'Repair protocol local validation observer wiring'
          git push origin HEAD:agent/v2-9-8b-post-dtw93-local-validation-observer-repair-implementation
