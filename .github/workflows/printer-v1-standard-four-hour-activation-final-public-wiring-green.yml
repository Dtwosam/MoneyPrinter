name: Printer V1 standard 4h final public wiring GREEN

on:
  pull_request:
    branches:
      - agent/v2-9-8b-post-dtw100-standard-four-hour-activation-final-public-wiring-apply-base

permissions:
  contents: write

jobs:
  apply-and-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-9-8b-post-dtw100-standard-four-hour-activation-final-public-wiring-apply-base
          fetch-depth: 0
      - name: Preserve patcher and checkout exact RED head
        run: |
          set -euo pipefail
          cp scripts/apply_standard_four_hour_activation_final_public_wiring.py /tmp/apply_final_wiring.py
          git checkout --detach 941e8b5e190c2e7831b267911f5b5597c6096486
          test "$(git rev-parse HEAD)" = "941e8b5e190c2e7831b267911f5b5597c6096486"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply approved final public wiring
        run: python /tmp/apply_final_wiring.py
      - name: Assert exact production scope
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/actual.txt
          printf '%s\n' \
            src/printer_v1/operator_cli/authoritative_live_operational_campaign.py \
            src/printer_v1/operator_cli/operational_memory_factory_command.py \
            | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
      - run: python -m pip install -e .
      - name: Compile directly affected files
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/operational_memory_factory_command.py \
            src/printer_v1/operator_cli/authoritative_live_operational_campaign.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_activation_final_public_wiring.py
      - name: Run final public wiring contract
        run: python -m unittest -v tests.test_v2_9_8b_post_dtw100_standard_four_hour_activation_final_public_wiring
      - name: Run standard authorization and factory controls
        run: |
          python -m unittest -v \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_activation_authorization \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_activation_factory_barrier
      - name: Run nearest public command regression
        run: python -m unittest -v tests.test_v2_9_8a_public_operational_command
      - name: Assert persistent standard authority and capability locks
        run: |
          python - <<'PY'
          import inspect
          from printer_v1.operator_cli import operational_memory_factory_command as command
          from printer_v1.operator_cli import authoritative_live_operational_campaign as live
          from printer_v1.snapshots.cadence_policy import get_policy

          p = command.STANDARD_FOUR_HOUR_POLICY
          assert p.policy_version == command.STANDARD_FOUR_HOUR_POLICY_VERSION
          assert p.standard_four_hour_campaign is True
          assert p.continuous_four_hour is True
          assert p.locked_windows == ('WINDOW_12H','WINDOW_24H')
          src = inspect.getsource(command._run_operational_campaign)
          assert 'standard_four_hour_campaign=policy.standard_four_hour_campaign' in src
          assert '"standard_four_hour_campaign": (' in src
          assert 'validated_authorization_runtime_facts' in src
          owner_src = inspect.getsource(live.AuthoritativeLiveOperationalCampaignOwner.run_operational)
          assert 'operational_persistent_mode=fifteen_minute_only' in owner_src
          assert 'not fifteen_minute_only or standard_four_hour_campaign' in owner_src
          assert 'not fifteen_minute_only and not standard_four_hour_campaign' in owner_src
          for lane in ('TRACK_FAST','TRACK_NORMAL'):
              assert get_policy('WINDOW_4H', lane).enabled_for_real_collection is True
              assert get_policy('WINDOW_12H', lane).enabled_for_real_collection is False
              assert get_policy('WINDOW_24H', lane).enabled_for_real_collection is False
          PY
          git diff --check
      - name: Create production-only candidate
        run: |
          set -euo pipefail
          git config user.name "Printer V1 TDD Runner"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/printer_v1/operator_cli/operational_memory_factory_command.py \
            src/printer_v1/operator_cli/authoritative_live_operational_campaign.py
          git commit -m "Complete standard four-hour public wiring"
          git push --force origin HEAD:refs/heads/agent/v2-9-8b-post-dtw100-standard-four-hour-activation-final-public-wiring-candidate
