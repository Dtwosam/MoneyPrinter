name: Printer V1 standard 4h activation Slice C GREEN

on:
  pull_request:
    branches:
      - agent/v2-9-8b-post-dtw100-standard-four-hour-activation-slice-c-apply-base

permissions:
  contents: write

jobs:
  apply-and-green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout disposable apply base
        uses: actions/checkout@v4
        with:
          ref: agent/v2-9-8b-post-dtw100-standard-four-hour-activation-slice-c-apply-base
          fetch-depth: 0
      - name: Preserve patchers and checkout exact RED head
        run: |
          set -euo pipefail
          cp scripts/apply_standard_four_hour_activation_slice_c.py /tmp/apply_slice_c.py
          cp scripts/apply_standard_four_hour_activation_slice_c_safety_cutoff.py /tmp/apply_slice_c_safety_cutoff.py
          git checkout --detach 5430a48a1f683b6182b4664023dc6b1f21ead26e
          test "$(git rev-parse HEAD)" = "5430a48a1f683b6182b4664023dc6b1f21ead26e"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply approved Slice C patch
        run: |
          python /tmp/apply_slice_c.py
          python /tmp/apply_slice_c_safety_cutoff.py
      - name: Assert exact production scope
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/actual.txt
          printf '%s\n' \
            src/printer_v1/operator_cli/campaign_authority_adapters.py \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            src/printer_v1/operator_cli/operational_standard_4h.py \
            | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
      - run: python -m pip install -e .
      - name: Compile directly affected files
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/campaign_authority_adapters.py \
            src/printer_v1/operator_cli/operational_standard_4h.py \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_activation_factory_barrier.py
      - name: Prove default checkpoint cutoff remains unchanged
        run: |
          python - <<'PY'
          from tests.test_v2_9_8b_post_dtw100_standard_four_hour_activation_factory_barrier import StandardFourHourActivationFactoryBarrierTests
          from printer_v1.operator_cli.campaign_authority_adapters import load_authoritative_window_safety
          case = StandardFourHourActivationFactoryBarrierTests()
          case.setUp()
          try:
              c = case.candidates[0]
              default = load_authoritative_window_safety(
                  case.fx.db,
                  campaign_id='campaign-1h', run_id='run-1h', cycle_id='cycle-1h',
                  token_slot_id=str(c['token_slot_id']), window_id=str(c['campaign_window_1h_id']),
              )
              assert default['gate_accepted'] is False
              assert 'safety_evidence_stale_or_post_cutoff' in default['reasons']
              row = case.fx.connection.execute(
                  'SELECT window_end_at FROM printer_memory_windows WHERE id=?',
                  (int(c['memory_window_1h_id']),),
              ).fetchone()
              close_cutoff = str(row[0])
              exact = load_authoritative_window_safety(
                  case.fx.db,
                  campaign_id='campaign-1h', run_id='run-1h', cycle_id='cycle-1h',
                  token_slot_id=str(c['token_slot_id']), window_id=str(c['campaign_window_1h_id']),
                  memory_window_close_cutoff=close_cutoff,
              )
              assert exact['gate_accepted'] is True
              assert exact['evidence_cutoff'] == close_cutoff
              assert exact['evidence_cutoff_source'] == 'MEMORY_WINDOW_END'
              try:
                  load_authoritative_window_safety(
                      case.fx.db,
                      campaign_id='campaign-1h', run_id='run-1h', cycle_id='cycle-1h',
                      token_slot_id=str(c['token_slot_id']), window_id=str(c['campaign_window_1h_id']),
                      memory_window_close_cutoff='2099-01-01T00:00:00+00:00',
                  )
              except ValueError as exc:
                  assert 'must equal authoritative window_end_at' in str(exc)
              else:
                  raise AssertionError('arbitrary safety cutoff was accepted')
          finally:
              case.tearDown()
          PY
      - name: Run Slice C barrier GREEN contract
        run: python -m unittest -v tests.test_v2_9_8b_post_dtw100_standard_four_hour_activation_factory_barrier
      - name: Run directly affected 4h regressions
        run: |
          python -m unittest -v \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_eligible_subset \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_campaign_handoff \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_collection_state_accounting \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_close_memory_terminal_reconciliation
      - name: Run first-hour and historical proof-path regressions
        run: |
          python -m unittest -v \
            tests.test_v2_9_8b_checkpoint4_1h_close_boundary \
            tests.test_v2_9_7d_4a_token_local_selective_continuation \
            tests.test_v2_8_1_one_token_4h_runtime
      - name: Assert capability and authority locks
        run: |
          python - <<'PY'
          import inspect
          from printer_v1.operator_cli import one_command_15m_factory as factory
          from printer_v1.operator_cli import operational_standard_4h as standard
          from printer_v1.snapshots.cadence_policy import get_policy
          sig = inspect.signature(factory.run_one_command_15m_factory)
          assert sig.parameters['standard_four_hour_campaign'].default is False
          src = inspect.getsource(factory.run_one_command_15m_factory)
          assert 'and not standard_four_hour_campaign' in src
          assert 'run_standard_four_hour_campaign_barrier' in src
          assert 'FourHourExecutionAuthority.STANDARD_CAMPAIGN' in inspect.getsource(standard.run_standard_four_hour_campaign_barrier)
          for lane in ('TRACK_FAST','TRACK_NORMAL'):
              assert get_policy('WINDOW_4H', lane).enabled_for_real_collection is True
              assert get_policy('WINDOW_12H', lane).enabled_for_real_collection is False
              assert get_policy('WINDOW_24H', lane).enabled_for_real_collection is False
          PY
          git diff --check
      - name: Create production-only Slice C candidate
        run: |
          set -euo pipefail
          git config user.name "Printer V1 TDD Runner"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/printer_v1/operator_cli/campaign_authority_adapters.py \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            src/printer_v1/operator_cli/operational_standard_4h.py
          git commit -m "Implement standard four-hour factory barrier"
          git push --force origin HEAD:refs/heads/agent/v2-9-8b-post-dtw100-standard-four-hour-activation-slice-c-candidate
