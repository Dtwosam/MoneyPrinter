name: Focused 583960b review

on:
  pull_request:
    branches:
      - assistant/v2-9-8b-later-cycle-mint-market-replay-repair

jobs:
  focused-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile touched owners
        run: |
          python -m py_compile \
            src/printer_v1/discovery/persistence.py \
            src/printer_v1/operator_cli/authoritative_live_operational_campaign.py \
            src/printer_v1/operator_cli/cadence_authority.py \
            src/printer_v1/operator_cli/multi_cycle_campaign_coordinator.py \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            src/printer_v1/operator_cli/pre_admission_discovery_attempt.py
      - name: Focused tests
        run: |
          python -m pytest -q \
            tests/test_v2_4_one_command_15m_factory.py \
            tests/test_v2_9_8b_four_concurrent_terminal_transaction_and_production_owner_proof.py \
            tests/test_v2_9_8b_selective_1h_tracking_handoff_contract.py \
            tests/test_v2_9_8b_discovery_selection_full_system_consolidation.py
      - name: Diff check
        run: git diff --check HEAD^1 HEAD^2
