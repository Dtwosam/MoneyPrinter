name: Refreshed origin cadence fixture regression

on:
  push:
    branches:
      - agent/tmp-refresh-origin-cadence-fixtures

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - name: Run origin and compensation regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          timeout 240s python -m pytest -q \
            tests/test_v2_9_7e_8_origin_to_lifecycle_integration.py \
            tests/test_v2_9_8b_post_handoff_terminal_compensation.py
