name: Cycle-2 frozen-lane atomic-claim proof

on:
  push:
    branches:
      - agent/v2-9-8b-cycle2-frozen-lane-atomic-claim-proof

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install local package and pytest
        run: python -m pip install -e . pytest

      - name: Compile affected contracts
        run: |
          python -m py_compile \
            src/printer_v1/lifecycle/tracking_queue.py \
            src/printer_v1/operator_cli/cadence_authority.py \
            src/printer_v1/operator_cli/pre_admission_discovery_attempt.py \
            src/printer_v1/operator_cli/multi_cycle_campaign_coordinator.py \
            tests/test_v2_9_8b_pre_admission_atomic_cycle2_consumption.py

      - name: Run focused frozen-lane and atomic-claim regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest -q \
            tests/test_v2_9_8b_pre_admission_atomic_cycle2_consumption.py \
            tests/test_v2_9_8b_cycle2_frozen_lane_evidence_carrier_conformance.py \
            tests/test_v2_9_8b_selective_1h_tracking_handoff_contract.py

      - name: Check diff hygiene
        run: git diff --check agent/v2-9-8b-aug30-token-local-terminalization-repair...HEAD
