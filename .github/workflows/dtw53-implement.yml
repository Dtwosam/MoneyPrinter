name: DTW-53 minimum offline implementation

on:
  pull_request:
    branches: [master]
    types: [opened]

permissions:
  contents: write

env:
  REPAIR_BRANCH: agent/v2-9-8b-window-15m-checkpoint-8-measured-market-fixture-audit-repair
  EXPECTED_RED_HEAD: a95cc280b0cfa88cf64acb8d8cc3446f8b2ad8a8
  TEST_FILE: tests/test_v2_9_8b_window_15m_checkpoint8_dtw53_final_acceptance_accounting.py

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REPAIR_BRANCH }}
          fetch-depth: 12

      - name: Verify exact RED baseline
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_RED_HEAD"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install local package and pytest
        run: python -m pip install -e . pytest

      - name: Apply exact DTW-53 patch
        run: |
          git fetch origin master --depth=1
          git show origin/master:scripts/dtw53_apply_patch_temp.py > /tmp/dtw53_apply_patch.py
          python /tmp/dtw53_apply_patch.py

      - name: Verify exact production scope and syntax
        run: |
          git diff --check
          python -m py_compile \
            src/printer_v1/discovery/direct_migration_discovery.py \
            src/printer_v1/discovery/eligible_token_supply.py \
            src/printer_v1/operator_cli/graduated_supply_front_door.py \
            src/printer_v1/operator_cli/authoritative_live_operational_campaign.py \
            src/printer_v1/operator_cli/operational_memory_factory_command.py \
            src/printer_v1/operator_cli/campaign_full_run_accounting.py
          printf '%s\n' \
            src/printer_v1/discovery/direct_migration_discovery.py \
            src/printer_v1/discovery/eligible_token_supply.py \
            src/printer_v1/operator_cli/authoritative_live_operational_campaign.py \
            src/printer_v1/operator_cli/campaign_full_run_accounting.py \
            src/printer_v1/operator_cli/graduated_supply_front_door.py \
            src/printer_v1/operator_cli/operational_memory_factory_command.py \
            | sort > /tmp/expected.txt
          git diff --name-only "$EXPECTED_RED_HEAD" | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Run DTW-53 GREEN
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest -q "$TEST_FILE"

      - name: Run nearest focused accounting compatibility tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          mapfile -t focused < <(find tests -maxdepth 1 -type f -name '*.py' | grep -E 'six_unit|full_run|checkpoint8' | grep -v 'dtw53' | sort | head -n 8)
          printf 'Focused compatibility files:\n%s\n' "${focused[*]:-none}"
          if ((${#focused[@]})); then
            python -m pytest -q "${focused[@]}"
          fi

      - name: Commit minimum implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/printer_v1/discovery/direct_migration_discovery.py \
            src/printer_v1/discovery/eligible_token_supply.py \
            src/printer_v1/operator_cli/graduated_supply_front_door.py \
            src/printer_v1/operator_cli/authoritative_live_operational_campaign.py \
            src/printer_v1/operator_cli/operational_memory_factory_command.py \
            src/printer_v1/operator_cli/campaign_full_run_accounting.py
          git commit -m "Repair DTW-53 final acceptance accounting"
          git push origin HEAD:"$REPAIR_BRANCH"
