name: DTW-53 minimum offline implementation

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize]

permissions:
  contents: write

env:
  REPAIR_BRANCH: agent/v2-9-8b-window-15m-checkpoint-8-measured-market-fixture-audit-repair
  EXPECTED_RED_HEAD: a95cc280b0cfa88cf64acb8d8cc3446f8b2ad8a8
  TEST_FILE: tests/test_v2_9_8b_window_15m_checkpoint8_dtw53_final_acceptance_accounting.py

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REPAIR_BRANCH }}
          fetch-depth: 12

      - name: Verify exact RED baseline
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_RED_HEAD"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install local package and pytest
        run: |
          python -m pip install -e . pytest

      - name: Apply exact DTW-53 patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"PATCH_BOUNDARY_MISMATCH:{path}:{count}:{old[:80]!r}")
                  text = text.replace(old, new, 1)
              p.write_text(text)

          patch("src/printer_v1/discovery/direct_migration_discovery.py", [
              (
                  "    stage_evidence_sink: Callable[[Mapping[str, Any]], None] | None = None,\n    transport_identity_observer: Callable[[Any], None] | None = None,\n    campaign_id: str | None = None,",
                  "    stage_evidence_sink: Callable[[Mapping[str, Any]], None] | None = None,\n    transport_identity_observer: Callable[[Any], None] | None = None,\n    local_validation_identity_observer: Callable[[Any], None] | None = None,\n    campaign_id: str | None = None,",
              ),
              (
                  "            migration_validation_identities.append(\n                LocalValidationIdentity(\n                    stage_id=stage_id_for_validations,\n                    subject_identity=subject,\n                    validation_kind=kind,\n                    validation_ordinal=index,\n                )\n            )",
                  "            validation_identity = LocalValidationIdentity(\n                stage_id=stage_id_for_validations,\n                subject_identity=subject,\n                validation_kind=kind,\n                validation_ordinal=index,\n            )\n            migration_validation_identities.append(validation_identity)\n            if local_validation_identity_observer is not None:\n                local_validation_identity_observer(validation_identity)",
              ),
          ])

          patch("src/printer_v1/discovery/eligible_token_supply.py", [
              (
                  "    stage_evidence_sink: Callable[[Mapping[str, Any]], None] | None = None,\n    transport_identity_observer: Callable[[Any], None] | None = None,\n    permanent_availability: bool = False,",
                  "    stage_evidence_sink: Callable[[Mapping[str, Any]], None] | None = None,\n    transport_identity_observer: Callable[[Any], None] | None = None,\n    local_validation_identity_observer: Callable[[Any], None] | None = None,\n    permanent_availability: bool = False,",
              ),
              (
                  "    if stage_evidence_sink is not None or transport_identity_observer is not None:\n        discovery_stage_kwargs = {",
                  "    if (\n        stage_evidence_sink is not None\n        or transport_identity_observer is not None\n        or local_validation_identity_observer is not None\n    ):\n        discovery_stage_kwargs = {",
              ),
              (
                  "        if transport_identity_observer is not None:\n            discovery_stage_kwargs[\"transport_identity_observer\"] = (\n                transport_identity_observer\n            )\n    discovery = run_direct_migration_discovery(",
                  "        if transport_identity_observer is not None:\n            discovery_stage_kwargs[\"transport_identity_observer\"] = (\n                transport_identity_observer\n            )\n        if local_validation_identity_observer is not None:\n            discovery_stage_kwargs[\"local_validation_identity_observer\"] = (\n                local_validation_identity_observer\n            )\n    discovery = run_direct_migration_discovery(",
              ),
          ])

          patch("src/printer_v1/operator_cli/graduated_supply_front_door.py", [
              (
                  "    stage_evidence_sink: Callable[[Mapping[str, Any]], None] | None = None,\n    transport_identity_observer: Callable[[Any], None] | None = None,\n    permanent_availability: bool = False,",
                  "    stage_evidence_sink: Callable[[Mapping[str, Any]], None] | None = None,\n    transport_identity_observer: Callable[[Any], None] | None = None,\n    local_validation_identity_observer: Callable[[Any], None] | None = None,\n    permanent_availability: bool = False,",
              ),
              (
                  "        transport_identity_observer=transport_identity_observer,\n        permanent_availability=permanent_availability,",
                  "        transport_identity_observer=transport_identity_observer,\n        local_validation_identity_observer=local_validation_identity_observer,\n        permanent_availability=permanent_availability,",
              ),
          ])

          patch("src/printer_v1/operator_cli/authoritative_live_operational_campaign.py", [
              (
                  "        transport_identity_observer: (\n            Callable[[Any], None] | None\n        ) = None,",
                  "        transport_identity_observer: (\n            Callable[[Any], None] | None\n        ) = None,\n        local_validation_identity_observer: (\n            Callable[[Any], None] | None\n        ) = None,",
              ),
              (
                  "            if transport_identity_observer is not None:\n                supply_kwargs[\"transport_identity_observer\"] = (\n                    transport_identity_observer\n                )",
                  "            if transport_identity_observer is not None:\n                supply_kwargs[\"transport_identity_observer\"] = (\n                    transport_identity_observer\n                )\n            if local_validation_identity_observer is not None:\n                supply_kwargs[\"local_validation_identity_observer\"] = (\n                    local_validation_identity_observer\n                )",
              ),
          ])

          patch("src/printer_v1/operator_cli/operational_memory_factory_command.py", [
              (
                  "    def _observe_transport_identity(identity: Any) -> None:\n        action_local_ledger.observe_transport(identity)\n        if hasattr(identity, \"as_dict\"):\n            action_local_transport_identities.append(identity.as_dict())\n        elif isinstance(identity, Mapping):\n            action_local_transport_identities.append(dict(identity))",
                  "    def _observe_transport_identity(identity: Any) -> None:\n        action_local_ledger.observe_transport(identity)\n        if hasattr(identity, \"as_dict\"):\n            action_local_transport_identities.append(identity.as_dict())\n        elif isinstance(identity, Mapping):\n            action_local_transport_identities.append(dict(identity))\n\n    def _observe_local_validation_identity(identity: Any) -> None:\n        action_local_ledger.observe_local_validation(identity)",
              ),
              (
                  "                accounting_stage_evidence_sink=_campaign_stage_evidence_sink,\n                transport_identity_observer=_observe_transport_identity,\n                pre_holder_accounting_projection=lambda: (",
                  "                accounting_stage_evidence_sink=_campaign_stage_evidence_sink,\n                transport_identity_observer=_observe_transport_identity,\n                local_validation_identity_observer=(\n                    _observe_local_validation_identity\n                ),\n                pre_holder_accounting_projection=lambda: (",
              ),
          ])

          patch("src/printer_v1/operator_cli/campaign_full_run_accounting.py", [
              (
                  "def _load_json_object(raw: Any) -> dict[str, Any] | None:\n",
                  '''def project_lifecycle_reservation_outcomes(\n    *,\n    transport_records: Sequence[Mapping[str, Any]],\n    reserved_count: int,\n    owned_lifecycle_stage_ids: Sequence[str],\n    factory_run_id: str,\n) -> dict[str, Any]:\n    """Project lifecycle reservation outcomes without campaign-scope leakage.\n\n    Campaign-wide transports remain untouched. Only transports owned by the two\n    sealed WINDOW_15M lifecycle stages participate here, and every such attempt\n    must carry an exact reservation linkage to the authoritative factory run.\n    """\n    reserved = int(reserved_count)\n    if reserved < 0:\n        raise FullRunAccountingError("negative lifecycle reservation count")\n    factory = _require(factory_run_id, "factory_run_id")\n    stage_ids = {str(value).strip() for value in owned_lifecycle_stage_ids if str(value).strip()}\n\n    attempted = 0\n    succeeded = 0\n    failed = 0\n    malformed_linkage_count = 0\n    duplicate_reservation_linkage_count = 0\n    unexpected_outcome_count = 0\n    seen_links: set[str] = set()\n\n    for item in transport_records:\n        if not isinstance(item, Mapping):\n            continue\n        if str(item.get("stage") or "") not in stage_ids:\n            continue\n        attempted += 1\n        link = str(item.get("reserved_from") or "").strip()\n        prefix = f"{factory}:"\n        valid_link = link.startswith(prefix)\n        if valid_link:\n            remainder = link[len(prefix):]\n            parts = remainder.rsplit(":reservation:", 1)\n            valid_link = (\n                len(parts) == 2\n                and bool(parts[0].strip())\n                and parts[1].isdigit()\n                and int(parts[1]) > 0\n            )\n        if not valid_link:\n            malformed_linkage_count += 1\n        elif link in seen_links:\n            duplicate_reservation_linkage_count += 1\n            malformed_linkage_count += 1\n        else:\n            seen_links.add(link)\n\n        result = str(item.get("result") or "")\n        if result == "SUCCEEDED":\n            succeeded += 1\n        elif result == "FAILED":\n            failed += 1\n        else:\n            unexpected_outcome_count += 1\n\n    complete = bool(\n        stage_ids\n        and reserved >= attempted > 0\n        and attempted == succeeded + failed\n        and malformed_linkage_count == 0\n        and unexpected_outcome_count == 0\n    )\n    return {\n        "reserved": reserved,\n        "attempted": attempted,\n        "succeeded": succeeded,\n        "failed": failed,\n        "malformed_linkage_count": malformed_linkage_count,\n        "duplicate_reservation_linkage_count": (\n            duplicate_reservation_linkage_count\n        ),\n        "unexpected_outcome_count": unexpected_outcome_count,\n        "complete": complete,\n    }\n\n\ndef _load_json_object(raw: Any) -> dict[str, Any] | None:\n''',
              ),
              (
                  "    transport_records = list(owner_evidence.get(\"transport_operations\") or [])\n    validation_families = sorted({",
                  "    transport_records = list(owner_evidence.get(\"transport_operations\") or [])\n    sealed_stage_diagnostics = list(\n        owner_evidence.get(\"sealed_stage_diagnostics\")\n        or reconciliation.get(\"diagnostics\", {}).get(\n            \"sealed_stage_diagnostics\", []\n        )\n    )\n    lifecycle_stage_ids = [\n        str(item.get(\"stage_id\") or \"\")\n        for item in sealed_stage_diagnostics\n        if str(item.get(\"stage_kind\") or \"\")\n        in {\"WINDOW_15M_SLOT_1\", \"WINDOW_15M_SLOT_2\"}\n    ]\n    source_operation_outcomes = project_lifecycle_reservation_outcomes(\n        transport_records=transport_records,\n        reserved_count=int(\n            dict(six_unit_totals or {}).get(\n                \"LIFECYCLE_RESERVED_TRANSPORT_OPERATION\", 0\n            )\n        ),\n        owned_lifecycle_stage_ids=lifecycle_stage_ids,\n        factory_run_id=context.factory_run_id,\n    )\n    validation_families = sorted({",
              ),
              (
                  "            \"sealed_stage_diagnostics\": list(\n                owner_evidence.get(\"sealed_stage_diagnostics\")\n                or reconciliation.get(\"diagnostics\", {}).get(\n                    \"sealed_stage_diagnostics\", []\n                )\n            ),",
                  "            \"sealed_stage_diagnostics\": sealed_stage_diagnostics,",
              ),
              (
                  "            \"source_operation_outcomes\": {\n                \"reserved\": int(\n                    dict(six_unit_totals or {}).get(\n                        \"LIFECYCLE_RESERVED_TRANSPORT_OPERATION\", 0\n                    )\n                ),\n                \"attempted\": len(transport_records),\n                \"succeeded\": sum(\n                    1 for item in transport_records\n                    if str(item.get(\"result\") or \"\") == \"SUCCEEDED\"\n                ),\n                \"failed\": sum(\n                    1 for item in transport_records\n                    if str(item.get(\"result\") or \"\") == \"FAILED\"\n                ),\n            },",
                  "            \"source_operation_outcomes\": source_operation_outcomes,",
              ),
              (
                  "        \"reservation_attempt_outcomes_complete\": (\n            int(accounting.get(\"source_operation_outcomes\", {}).get(\"reserved\") or 0)\n            >= int(accounting.get(\"source_operation_outcomes\", {}).get(\"attempted\") or 0)\n            > 0\n            and int(accounting.get(\"source_operation_outcomes\", {}).get(\"attempted\") or 0)\n            == int(accounting.get(\"source_operation_outcomes\", {}).get(\"succeeded\") or 0)\n            + int(accounting.get(\"source_operation_outcomes\", {}).get(\"failed\") or 0)\n        ),",
                  "        \"reservation_attempt_outcomes_complete\": (\n            int(accounting.get(\"source_operation_outcomes\", {}).get(\"reserved\") or 0)\n            >= int(accounting.get(\"source_operation_outcomes\", {}).get(\"attempted\") or 0)\n            > 0\n            and int(accounting.get(\"source_operation_outcomes\", {}).get(\"attempted\") or 0)\n            == int(accounting.get(\"source_operation_outcomes\", {}).get(\"succeeded\") or 0)\n            + int(accounting.get(\"source_operation_outcomes\", {}).get(\"failed\") or 0)\n            and int(accounting.get(\"source_operation_outcomes\", {}).get(\"malformed_linkage_count\") or 0) == 0\n            and int(accounting.get(\"source_operation_outcomes\", {}).get(\"unexpected_outcome_count\") or 0) == 0\n        ),",
              ),
          ])
          PY

      - name: Verify patch scope and syntax
        run: |
          git diff --check
          python -m py_compile \
            src/printer_v1/discovery/direct_migration_discovery.py \
            src/printer_v1/discovery/eligible_token_supply.py \
            src/printer_v1/operator_cli/graduated_supply_front_door.py \
            src/printer_v1/operator_cli/authoritative_live_operational_campaign.py \
            src/printer_v1/operator_cli/operational_memory_factory_command.py \
            src/printer_v1/operator_cli/campaign_full_run_accounting.py
          printf '%s\n' \
            src/printer_v1/discovery/direct_migration_discovery.py \
            src/printer_v1/discovery/eligible_token_supply.py \
            src/printer_v1/operator_cli/authoritative_live_operational_campaign.py \
            src/printer_v1/operator_cli/campaign_full_run_accounting.py \
            src/printer_v1/operator_cli/graduated_supply_front_door.py \
            src/printer_v1/operator_cli/operational_memory_factory_command.py \
            tests/test_v2_9_8b_window_15m_checkpoint8_dtw53_final_acceptance_accounting.py \
            > /tmp/expected.txt
          git diff --name-only "$EXPECTED_RED_HEAD" | sort > /tmp/actual.txt
          sort /tmp/expected.txt -o /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Run DTW-53 GREEN
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest -q "$TEST_FILE"

      - name: Run nearest focused accounting compatibility tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          mapfile -t tests_found < <(find tests -maxdepth 1 -type f -name '*.py' | grep -E 'six_unit|full_run|checkpoint8' | grep -v 'dtw53' | sort | head -n 8)
          printf 'Focused compatibility files:\n%s\n' "${tests_found[*]:-none}"
          if ((${#tests_found[@]})); then
            python -m pytest -q "${tests_found[@]}"
          fi

      - name: Commit minimum implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/printer_v1/discovery/direct_migration_discovery.py \
            src/printer_v1/discovery/eligible_token_supply.py \
            src/printer_v1/operator_cli/graduated_supply_front_door.py \
            src/printer_v1/operator_cli/authoritative_live_operational_campaign.py \
            src/printer_v1/operator_cli/operational_memory_factory_command.py \
            src/printer_v1/operator_cli/campaign_full_run_accounting.py
          git commit -m "Repair DTW-53 final acceptance accounting"
          git push origin HEAD:"$REPAIR_BRANCH"
