name: V2-9.8B Cycle2 Repair Proof

on:
  push:
    branches:
      - agent/v2-9-8b-cycle2-historical-proof-carrier-provenance-repair
  pull_request:
    branches:
      - agent/v2-9-8b-cycle2-proof-base-temporary

permissions:
  contents: read

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile repaired modules and focused proof
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/graduated_supply_front_door.py \
            src/printer_v1/operator_cli/_graduated_supply_front_door_base.py \
            tests/test_v2_9_8b_cycle2_historical_proof_carrier_repair.py
      - name: Run focused Cycle-2 repair and nearest compatibility proofs
        run: |
          pytest -q \
            tests/test_v2_9_8b_cycle2_historical_proof_carrier_repair.py \
            tests/test_v2_9_7e_44_full_pilot_supply_integration.py \
            tests/test_v2_9_8b_later_cycle_fresh_inventory.py
