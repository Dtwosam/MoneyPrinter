name: V2-9.8B Cycle2 Repair Proof

on:
  pull_request:
    branches:
      - agent/v2-9-8b-cycle2-proof-base-temporary

permissions:
  contents: read

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install baseline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile baseline graduated-supply module
        run: |
          python -m py_compile src/printer_v1/operator_cli/graduated_supply_front_door.py
      - name: Run untouched-f402 nearest compatibility proof
        run: |
          pytest -q tests/test_v2_9_7e_44_full_pilot_supply_integration.py
