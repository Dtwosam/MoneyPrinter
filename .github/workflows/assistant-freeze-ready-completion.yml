name: assistant-freeze-ready-completion

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Write RED tests
        run: python .github/assistant_freeze_ready_patch.py tests
      - name: Prove RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_v2_9_8b_freeze_ready_wiring_completion.py > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo "RED phase unexpectedly passed"
            exit 1
          fi
          echo "RED phase failed as expected"
      - name: Apply production patch
        run: python .github/assistant_freeze_ready_patch.py patch
      - name: GREEN focused verification
        shell: bash
        run: |
          python -m pytest -q tests/test_v2_9_8b_freeze_ready_wiring_completion.py tests/test_v2_9_8b_freeze_ready_candidate_supply_reliability.py
          python -m py_compile src/printer_v1/discovery/eligible_token_supply.py src/printer_v1/discovery/graduated_liquidity_front_door.py src/printer_v1/operator_cli/_graduated_supply_front_door_base.py src/printer_v1/operator_cli/authoritative_live_operational_campaign.py tests/test_v2_9_8b_freeze_ready_wiring_completion.py
          git diff --check
      - name: Show diff
        run: git diff --stat && git diff
      - name: Commit verified patch
        shell: bash
        run: |
          rm .github/workflows/assistant-freeze-ready-completion.yml .github/assistant_freeze_ready_patch.py
          git config user.name "ChatGPT Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Complete freeze-ready candidate supply wiring"
          git push origin HEAD:assistant/freeze-ready-candidate-supply
