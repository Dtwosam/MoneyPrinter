name: assistant-freeze-ready-completion

on:
  push:
    branches:
      - assistant/freeze-ready-candidate-supply

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/freeze-ready-candidate-supply
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install -q pytest

      - name: Add RED focused tests
        shell: bash
        run: |
          cat > tests/test_v2_9_8b_freeze_ready_wiring_completion.py <<'PY'
          from __future__ import annotations

          import inspect

          import pytest


          def _liquidity(mint: str, pool: str):
              from printer_v1.discovery.graduated_liquidity_front_door import (
                  LIQUIDITY_PROVEN,
                  LiquidityEvidence,
              )

              return LiquidityEvidence(
                  status=LIQUIDITY_PROVEN,
                  liquidity_usd=4500.0,
                  mint=mint,
                  pool=pool,
                  reason="AT_OR_ABOVE_3000_FLOOR",
                  source_status="COMPLETE",
                  source_request_id=11,
                  source_response_id=12,
              )


          def _front_door_candidate(*, provenance: str):
              from printer_v1.discovery.graduated_liquidity_front_door import FrontDoorCandidate

              mint = "MintFreezeReady111111111111111111111111111"
              pool = "PoolFreezeReady111111111111111111111111111"
              return FrontDoorCandidate(
                  mint=mint,
                  pumpswap_pool=pool,
                  market_identity=f"solana-mainnet:pumpswap:{pool}",
                  provenance=provenance,
                  lifecycle_state="PUMPSWAP_GRADUATED_CONFIRMED",
                  graduation_block_time=1_750_000_000,
                  liquidity=_liquidity(mint, pool),
                  eligible=True,
                  rejection=None,
                  direct_pump_evidence={
                      "mint": mint,
                      "pool": pool,
                      "migration_signature": "historical-signature",
                      "pumpswap_program_id": "pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA",
                      "graduation_block_time": 1_750_000_000,
                      "confirmed": True,
                  },
              )


          def test_persisted_market_revalidation_does_not_claim_current_direct_pump_authority():
              from printer_v1.discovery.graduated_liquidity_front_door import (
                  PERSISTED_GRADUATED_CHANNEL,
              )

              item = _front_door_candidate(provenance=PERSISTED_GRADUATED_CHANNEL).to_dict()
              assert item["admission_authority"] == "MARKET_PRESENT_POOL"
              assert item["nomination_source"] == "dexscreener"
              assert item["lineage_state"] == "UNKNOWN_ORIGIN"
              assert item["exact_present_pool_confirmed"] is True
              assert "direct_pump_evidence" not in item


          def test_current_direct_migration_keeps_direct_authority_and_proof():
              from printer_v1.discovery.graduated_liquidity_front_door import (
                  LATEST_GRADUATED_CHANNEL,
              )

              item = _front_door_candidate(provenance=LATEST_GRADUATED_CHANNEL).to_dict()
              assert item["admission_authority"] == "DIRECT_PUMP_PUMPSWAP"
              assert item["nomination_source"] == "direct_pump_migration"
              assert item["lineage_state"] == "PUMP_GRADUATION_CONFIRMED"
              assert item["direct_pump_evidence"]["migration_signature"] == "historical-signature"


          def _coverage(request_id: int, key_suffix: str = "a") -> dict[str, object]:
              return {
                  "source_request_id": request_id,
                  "source_name": "dexscreener",
                  "request_kind": "candidate_market_batch",
                  "logical_stage_id": f"campaign|run|cycle|MINT_MARKET_BATCH|{request_id}",
                  "terminal_status": "COMPLETED",
                  "transport_identity_count": 1,
                  "transport_identity_keys": [["transport", request_id, key_suffix]],
              }


          def test_cumulative_coverage_merge_is_exact_deduplicated_and_conflict_closed():
              from printer_v1.discovery.eligible_token_supply import (
                  EligibleTokenSupplyError,
                  merge_cumulative_source_request_coverage,
              )

              one = _coverage(1)
              two = _coverage(2)
              merged = merge_cumulative_source_request_coverage([one], [one, two])
              assert [item["source_request_id"] for item in merged] == [1, 2]

              conflicting = _coverage(1, "different")
              with pytest.raises(
                  EligibleTokenSupplyError,
                  match="CUMULATIVE_SOURCE_REQUEST_COVERAGE_CONFLICT",
              ):
                  merge_cumulative_source_request_coverage([one], [conflicting])


          def test_persistent_supply_wires_cumulative_coverage_into_canonical_depth_before_refresh():
              import printer_v1.discovery.eligible_token_supply as supply

              signature = inspect.signature(supply.run_persistent_eligible_token_supply)
              assert "prior_source_request_coverage" in signature.parameters
              source = inspect.getsource(supply.run_persistent_eligible_token_supply)
              refresh_def = source.index("def _request_temporal_refresh")
              owner_call = source.index("temporal_refresh_owner.request_temporal_refresh", refresh_def)
              measurement_call = source.rindex("_refresh_freeze_ready_depth()", refresh_def, owner_call)
              assert refresh_def < measurement_call < owner_call
              assert "measure_freeze_ready_candidates" in source
              assert "assemble_and_reconcile_campaign_source_requests" in source
              assert '"campaign_source_request_coverage": _current_source_request_coverage()' in source


          def test_composition_and_coordinator_forward_cumulative_coverage():
              from printer_v1.operator_cli import _graduated_supply_front_door_base as base
              from printer_v1.operator_cli import authoritative_live_operational_campaign as campaign

              assert "prior_source_request_coverage" in inspect.signature(
                  base.build_graduated_supply
              ).parameters
              base_source = inspect.getsource(base.build_graduated_supply)
              assert "prior_source_request_coverage=prior_source_request_coverage" in base_source

              campaign_source = inspect.getsource(campaign)
              assert '"prior_source_request_coverage": list(' in campaign_source
              assert '"source_request_coverage": list(' in campaign_source
          PY

      - name: Prove RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_v2_9_8b_freeze_ready_wiring_completion.py > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo "RED phase unexpectedly passed"
            exit 1
          fi
          echo "RED phase failed as expected"

      - name: Apply production wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact replacement, found {count}")
              p.write_text(text.replace(old, new, 1))

          def regex_once(path: str, pattern: str, repl: str, flags: int = 0) -> None:
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex replacement, found {count}: {pattern}")
              p.write_text(updated)

          # 1) Truthful source-specific authority: historical registry proof is
          # context only after a fresh market-path revalidation. Only a candidate
          # freshly confirmed by the current direct-migration channel claims direct
          # Pump/PumpSwap authority.
          path = "src/printer_v1/discovery/graduated_liquidity_front_door.py"
          pattern = r'''    def to_dict\(self\) -> dict\[str, Any\]:\n        result = \{\n            "mint": self\.mint,\n            "pool": self\.pumpswap_pool,\n            "market_identity": self\.market_identity,\n            "provenance": self\.provenance,\n            "lifecycle_state": self\.lifecycle_state,\n            "graduation_block_time": self\.graduation_block_time,\n            "liquidity": self\.liquidity\.to_dict\(\),\n            "eligible": self\.eligible,\n            "rejection": self\.rejection,\n            "admission_authority": "DIRECT_PUMP_PUMPSWAP",\n            "nomination_source": "direct_pump_migration",\n            "lineage_state": "PUMP_GRADUATION_CONFIRMED",\n            "exact_present_pool_confirmed": True,\n        \}\n        if self\.direct_pump_evidence is not None:\n            result\["direct_pump_evidence"\] = dict\(self\.direct_pump_evidence\)\n        return result'''
          repl = '''    def to_dict(self) -> dict[str, Any]:
        current_direct = self.provenance == LATEST_GRADUATED_CHANNEL
        result = {
            "mint": self.mint,
            "pool": self.pumpswap_pool,
            "market_identity": self.market_identity,
            "provenance": self.provenance,
            "lifecycle_state": self.lifecycle_state,
            "graduation_block_time": self.graduation_block_time,
            "liquidity": self.liquidity.to_dict(),
            "eligible": self.eligible,
            "rejection": self.rejection,
            "admission_authority": (
                "DIRECT_PUMP_PUMPSWAP" if current_direct else "MARKET_PRESENT_POOL"
            ),
            "nomination_source": (
                "direct_pump_migration" if current_direct else "dexscreener"
            ),
            "lineage_state": (
                "PUMP_GRADUATION_CONFIRMED" if current_direct else "UNKNOWN_ORIGIN"
            ),
            "exact_present_pool_confirmed": True,
        }
        if current_direct:
            if self.direct_pump_evidence is None:
                raise GraduatedFrontDoorError(
                    "CURRENT_DIRECT_PUMP_EVIDENCE_MISSING", self.mint
                )
            result["direct_pump_evidence"] = dict(self.direct_pump_evidence)
        return result'''
          regex_once(path, pattern, repl)

          # 2) Exact cumulative coverage merge owned by eligible supply.
          path = "src/printer_v1/discovery/eligible_token_supply.py"
          marker = 'ACQUISITION_QUANTUM_YIELDED = "ACQUISITION_QUANTUM_YIELDED"\n'
          helper = '''def merge_cumulative_source_request_coverage(
    prior: Sequence[Mapping[str, Any]] | None,
    current: Sequence[Mapping[str, Any]] | None,
) -> list[dict[str, Any]]:
    """Merge exact stage-produced request coverage across cooperative claims.

    Replays of the same request must be byte-equivalent after canonical JSON
    normalization. A reused request ID with different stage/transport ownership
    fails closed; missing request identity is never silently promoted to proof.
    """
    by_request: dict[int, tuple[str, dict[str, Any]]] = {}
    for group in (prior or (), current or ()):
        if not isinstance(group, Mapping):
            raise EligibleTokenSupplyError("INVALID_PRIOR_SOURCE_REQUEST_COVERAGE")
        item = dict(group)
        raw_id = item.get("source_request_id")
        if isinstance(raw_id, bool) or raw_id is None:
            raise EligibleTokenSupplyError("INVALID_PRIOR_SOURCE_REQUEST_COVERAGE")
        try:
            request_id = int(raw_id)
        except (TypeError, ValueError) as exc:
            raise EligibleTokenSupplyError(
                "INVALID_PRIOR_SOURCE_REQUEST_COVERAGE"
            ) from exc
        if request_id <= 0:
            raise EligibleTokenSupplyError("INVALID_PRIOR_SOURCE_REQUEST_COVERAGE")
        canonical = json.dumps(
            item, sort_keys=True, separators=(",", ":"), default=str
        )
        existing = by_request.get(request_id)
        if existing is not None and existing[0] != canonical:
            raise EligibleTokenSupplyError(
                "CUMULATIVE_SOURCE_REQUEST_COVERAGE_CONFLICT"
            )
        by_request[request_id] = (canonical, item)
    return [by_request[key][1] for key in sorted(by_request)]


'''
          replace_once(path, marker, helper + marker)

          # Signature and validated prior coverage carrier.
          replace_once(
              path,
              '    prior_source_operations_used: int = 0,\n    cooperative_quantum: bool = False,',
              '    prior_source_operations_used: int = 0,\n    prior_source_request_coverage: Sequence[Mapping[str, Any]] | None = None,\n    cooperative_quantum: bool = False,',
          )
          replace_once(
              path,
              '    direct_acquisition_mode = str(cooperative_direct_mode or LIVE_TAIL_MODE)\n',
              '''    if prior_source_request_coverage is None:
        prior_source_request_coverage_rows: list[dict[str, Any]] = []
    else:
        if isinstance(prior_source_request_coverage, (str, bytes)) or not isinstance(
            prior_source_request_coverage, Sequence
        ):
            raise EligibleTokenSupplyError("INVALID_PRIOR_SOURCE_REQUEST_COVERAGE")
        prior_source_request_coverage_rows = []
        for entry in prior_source_request_coverage:
            if not isinstance(entry, Mapping):
                raise EligibleTokenSupplyError("INVALID_PRIOR_SOURCE_REQUEST_COVERAGE")
            prior_source_request_coverage_rows.append(dict(entry))

    direct_acquisition_mode = str(cooperative_direct_mode or LIVE_TAIL_MODE)
''',
          )

          # Canonical measured depth owner. It uses cumulative stage-produced
          # coverage + durable current-campaign MOE rows, then delegates all
          # role/provenance/freshness/tracking/uniqueness rules to the existing
          # projector. No source transport or Scheduler work is created here.
          replace_once(
              path,
              '        freeze_ready_depth_measured = 0\n        acquisition_ledger: AcquisitionLedger | None = None\n',
              '''        freeze_ready_depth_measured = 0
        freeze_ready_measurement_diagnostics: dict[str, Any] = {
            "status": "NOT_MEASURED",
            "freeze_ready_depth": 0,
        }

        def _current_source_request_coverage() -> list[dict[str, Any]]:
            discovery_coverage = list(
                discovery.get("source_request_coverage")
                or (discovery.get("source_operation_ledger") or {}).get(
                    "source_request_coverage"
                )
                or ()
            )
            current_coverage = (
                list(locator.get("source_request_coverage") or ())
                + discovery_coverage
                + list(
                    geckoterminal_nomination_report.get(
                        "source_request_coverage"
                    )
                    or ()
                )
                + list(
                    liquidity_backup_report.get("source_request_coverage") or ()
                )
                + list((protocol_report or {}).get("source_request_coverage") or ())
                + [
                    entry
                    for report in permanent_market_reports
                    for entry in (report.get("source_request_coverage") or ())
                ]
            )
            return merge_cumulative_source_request_coverage(
                prior_source_request_coverage_rows,
                current_coverage,
            )

        def _refresh_freeze_ready_depth() -> int:
            nonlocal freeze_ready_depth_measured, freeze_ready_measurement_diagnostics
            if not permanent_availability:
                freeze_ready_depth_measured = len(campaign_eligible)
                freeze_ready_measurement_diagnostics = {
                    "status": "NON_PERMANENT_COMPATIBILITY",
                    "freeze_ready_depth": freeze_ready_depth_measured,
                }
                return freeze_ready_depth_measured
            if not all(str(value or "").strip() for value in (campaign_id, run_id, cycle_id)):
                freeze_ready_depth_measured = 0
                freeze_ready_measurement_diagnostics = {
                    "status": "BLOCKED",
                    "blocker": "RETAINED_CURRENT_RUN_PROVENANCE_UNAVAILABLE",
                    "freeze_ready_depth": 0,
                }
                return 0

            from printer_v1.discovery.later_cycle_fresh_inventory import (
                load_campaign_fresh_moe_candidates,
            )
            from printer_v1.discovery.memory_observation_activation import (
                measure_freeze_ready_candidates,
            )
            from printer_v1.discovery.permanent_discovery_availability import (
                assemble_and_reconcile_campaign_source_requests,
            )
            from printer_v1.lifecycle.tracking_queue import (
                assess_possible_tracking_claim_by_identity,
            )

            coverage = _current_source_request_coverage()
            reconciliation = assemble_and_reconcile_campaign_source_requests(
                connection,
                diagnostics={"campaign_source_request_coverage": coverage},
                request_key_prefixes=(
                    str(discovery_request_key_prefix),
                    str(front_door_request_key_prefix),
                ),
                request_key_root=str(discovery_request_key_prefix),
            )
            if str(reconciliation.get("status") or "") != "OK":
                freeze_ready_depth_measured = 0
                freeze_ready_measurement_diagnostics = {
                    "status": "BLOCKED",
                    "blocker": str(
                        reconciliation.get("blocker")
                        or "CAMPAIGN_SOURCE_REQUEST_RECONCILIATION_MISMATCH"
                    ),
                    "freeze_ready_depth": 0,
                    "campaign_source_request_reconciliation": reconciliation,
                }
                return 0

            rows = [
                dict(item)
                for item in load_campaign_fresh_moe_candidates(
                    connection, campaign_id=str(campaign_id), at=now
                )
            ]
            for item in rows:
                mint = str(item.get("mint") or "")
                pool = str(item.get("pumpswap_pool") or item.get("pool") or "")
                assessment = assess_possible_tracking_claim_by_identity(
                    connection,
                    token_mint=mint,
                    pair_address=pool,
                    assessed_at=started_at,
                )
                item["tracking_handoff_eligible"] = bool(assessment.eligible)
                item["tracking_requalification_required"] = bool(
                    assessment.requalification_eligible
                )
                item["tracking_handoff"] = {
                    "category": assessment.category,
                    "eligible_for_evidence": assessment.eligible,
                    "tracking_queue_id": assessment.queue_id,
                    "tracking_queue_status": assessment.queue_status,
                    "requalification_required": assessment.requalification_eligible,
                    "cooldown_until": assessment.cooldown_until,
                }
                tracking_dispositions[mint] = dict(item["tracking_handoff"])

            manifest = list(
                reconciliation.get("campaign_source_request_manifest")
                or reconciliation.get("manifest")
                or ()
            )
            measured_keys = [
                list(key)
                for entry in manifest
                for key in (entry.get("transport_identity_keys") or ())
            ]
            measurement = measure_freeze_ready_candidates(
                connection,
                rows,
                now=now,
                request_key_root=str(discovery_request_key_prefix),
                campaign_id=str(campaign_id),
                run_id=str(run_id),
                cycle_id=str(cycle_id),
                campaign_source_request_manifest=manifest,
                measured_transport_identity_keys=measured_keys,
                require_current_run_provenance=True,
            )
            freeze_ready_depth_measured = int(measurement.freeze_ready_depth)
            freeze_ready_measurement_diagnostics = {
                "status": "MEASURED",
                "freeze_ready_depth": freeze_ready_depth_measured,
                "input_count": int(measurement.input_count),
                "capacity_stop_reason": measurement.capacity_stop_reason,
                "exclusions": [dict(item) for item in measurement.exclusions],
                "campaign_source_request_reconciliation": reconciliation,
            }
            return freeze_ready_depth_measured

        acquisition_ledger: AcquisitionLedger | None = None
''',
          )

          # Measure once before the acquisition loop, re-measure immediately
          # before any temporal-owner request (so CAPACITY_ALREADY_MET prevents
          # enqueue), and once again after traversal before terminal readiness.
          replace_once(
              path,
              '        def _temporal_stop_reason(status: str) -> str:\n',
              '        _refresh_freeze_ready_depth()\n\n        def _temporal_stop_reason(status: str) -> str:\n',
          )
          replace_once(
              path,
              '            # Permanent mode refresh eligibility must use freeze-ready depth, never\n            # raw MOE / campaign_eligible length. Unknown depth fails closed at 0.\n            if permanent_availability:\n',
              '            # Reconcile cumulative current-run evidence immediately before\n            # asking the temporal owner. Capacity met here must stop before enqueue.\n            _refresh_freeze_ready_depth()\n            # Permanent mode refresh eligibility must use freeze-ready depth, never\n            # raw MOE / campaign_eligible length. Unknown depth fails closed at 0.\n            if permanent_availability:\n',
          )
          replace_once(
              path,
              '        # Before certifying a shortage in cooperative later-cycle mode,\n',
              '        _refresh_freeze_ready_depth()\n\n        # Before certifying a shortage in cooperative later-cycle mode,\n',
          )

          # Diagnostics now expose cumulative coverage and the exact measurement.
          regex_once(
              path,
              r'''            "campaign_source_request_coverage": list\(\n.*?            \),\n            "discovery_request_key_prefix": discovery_request_key_prefix,''',
              '''            "campaign_source_request_coverage": _current_source_request_coverage(),
            "discovery_request_key_prefix": discovery_request_key_prefix,''',
              flags=re.S,
          )
          replace_once(
              path,
              '            "freeze_ready_depth": int(freeze_ready_depth_measured),\n',
              '            "freeze_ready_depth": int(freeze_ready_depth_measured),\n            "freeze_ready_measurement": dict(freeze_ready_measurement_diagnostics),\n',
          )

          # 3) Composition forwards prior coverage unchanged to the supply owner.
          path = "src/printer_v1/operator_cli/_graduated_supply_front_door_base.py"
          replace_once(
              path,
              '    prior_source_operations_used: int = 0,\n    cooperative_quantum: bool = False,',
              '    prior_source_operations_used: int = 0,\n    prior_source_request_coverage: Sequence[Mapping[str, Any]] | None = None,\n    cooperative_quantum: bool = False,',
          )
          replace_once(
              path,
              '        prior_source_operations_used=prior_source_operations_used,\n        cooperative_quantum=cooperative_quantum,',
              '        prior_source_operations_used=prior_source_operations_used,\n        prior_source_request_coverage=prior_source_request_coverage,\n        cooperative_quantum=cooperative_quantum,',
          )

          # 4) Reuse the existing cooperative progress carrier for cumulative
          # request coverage. No new persistence/retry/scheduler mechanism.
          path = "src/printer_v1/operator_cli/authoritative_live_operational_campaign.py"
          replace_once(
              path,
              '                        graduated_supply_kwargs={\n                            **later_supply_kwargs,\n                            "persist_terminal_certificate": False,\n                        },',
              '                        graduated_supply_kwargs={\n                            **later_supply_kwargs,\n                            "persist_terminal_certificate": False,\n                            "prior_source_request_coverage": list(\n                                (progress or {}).get("source_request_coverage") or ()\n                            ),\n                        },',
          )
          replace_once(
              path,
              '                            "reserve_depth": int(\n                                diagnostics.get("eligible_reserve_count") or 0\n                            ),',
              '                            "source_request_coverage": list(\n                                diagnostics.get("campaign_source_request_coverage")\n                                or (progress or {}).get("source_request_coverage")\n                                or ()\n                            ),\n                            "reserve_depth": int(\n                                diagnostics.get("freeze_ready_depth")\n                                or diagnostics.get("eligible_reserve_count")\n                                or 0\n                            ),',
          )
          PY

      - name: GREEN focused verification
        shell: bash
        run: |
          python -m pytest -q \
            tests/test_v2_9_8b_freeze_ready_wiring_completion.py \
            tests/test_v2_9_8b_freeze_ready_candidate_supply_reliability.py
          python -m py_compile \
            src/printer_v1/discovery/eligible_token_supply.py \
            src/printer_v1/discovery/graduated_liquidity_front_door.py \
            src/printer_v1/operator_cli/_graduated_supply_front_door_base.py \
            src/printer_v1/operator_cli/authoritative_live_operational_campaign.py \
            tests/test_v2_9_8b_freeze_ready_wiring_completion.py
          git diff --check

      - name: Show engineering diff
        run: git diff --stat && git diff -- src/printer_v1/discovery/eligible_token_supply.py src/printer_v1/discovery/graduated_liquidity_front_door.py src/printer_v1/operator_cli/_graduated_supply_front_door_base.py src/printer_v1/operator_cli/authoritative_live_operational_campaign.py tests/test_v2_9_8b_freeze_ready_wiring_completion.py

      - name: Commit verified patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/assistant-freeze-ready-completion.yml
          git config user.name "ChatGPT Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add src/printer_v1/discovery/eligible_token_supply.py \
                  src/printer_v1/discovery/graduated_liquidity_front_door.py \
                  src/printer_v1/operator_cli/_graduated_supply_front_door_base.py \
                  src/printer_v1/operator_cli/authoritative_live_operational_campaign.py \
                  tests/test_v2_9_8b_freeze_ready_wiring_completion.py \
                  .github/workflows/assistant-freeze-ready-completion.yml
          git commit -m "Complete freeze-ready candidate supply wiring"
          git push origin HEAD:assistant/freeze-ready-candidate-supply
