name: Cycle-2 factory-boundary focused proof

on:
  push:
    branches:
      - agent/v2-9-8b-cycle2-frozen-lane-atomic-claim-proof

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - name: Run Cycle-2 factory boundary
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest -q tests/test_v2_9_8b_four_token_gate_d_factory_boundary.py
