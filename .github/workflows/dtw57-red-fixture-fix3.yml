name: DTW-57 RED Fixture Fix 3

on:
  pull_request:
    branches:
      - tmp/dtw57-red-fix3-orchestration
    types: [opened]

permissions:
  contents: write

env:
  TARGET_BRANCH: agent/v2-9-8b-window-15m-checkpoint-8-dtw57-independent-inspector-red
  EXPECTED_HEAD: 41bf14f6cacf6e6cfa26d4f9edc87340cf19d384
  TEST_FILE: tests/test_v2_9_8b_window_15m_checkpoint8_dtw57_durable_reconstruction_red.py

jobs:
  fix-test-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target RED branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 5

      - name: Patch two persisted negative cases
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_v2_9_8b_window_15m_checkpoint8_dtw57_durable_reconstruction_red.py")
          text = path.read_text(encoding="utf-8")

          before = '''        (
              "campaign_window_memory_mismatch",
              lambda proof_dir, db_path: _replace_row(
                  db_path,
                  "printer_memory_factory_campaign_windows",
                  "window_id",
                  "campaign-window-1",
                  {"memory_window_row_id": 102},
              ),
              "CAMPAIGN_MEMORY_WINDOW_IDENTITY_MISMATCH",
          ),'''
          after = '''        (
              "campaign_window_memory_binding_missing",
              lambda proof_dir, db_path: _replace_row(
                  db_path,
                  "printer_memory_factory_campaign_windows",
                  "window_id",
                  "campaign-window-1",
                  {"memory_window_row_id": None},
              ),
              "CAMPAIGN_MEMORY_WINDOW_BINDING_MISSING",
          ),'''
          assert before in text
          text = text.replace(before, after)

          before = '''        (
              "scheduler_join_missing",
              lambda proof_dir, db_path: _replace_row(
                  db_path,
                  "printer_memory_factory_campaign_scheduler_work",
                  "scheduler_work_id",
                  "lifecycle-work-1",
                  {"scheduler_job_id": 2},
              ),
              "SCHEDULER_JOIN_MISMATCH",
          ),'''
          after = '''        (
              "scheduler_join_missing",
              lambda proof_dir, db_path: _mutate_db(
                  db_path,
                  "DELETE FROM printer_memory_factory_campaign_scheduler_work "
                  "WHERE scheduler_work_id='lifecycle-work-1'",
              ),
              "SCHEDULER_JOIN_MISMATCH",
          ),'''
          assert before in text
          text = text.replace(before, after)

          compile(text, str(path), "exec")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify one-file scope and compile
        run: |
          set -euo pipefail
          FILES="$(git diff --name-only)"
          test "$FILES" = "$TEST_FILE"
          git diff --check
          python -m py_compile "$TEST_FILE"

      - name: Commit corrected RED fixture
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TEST_FILE"
          git commit -m "Repair DTW-57 persisted RED cases"
          git push origin "HEAD:$TARGET_BRANCH"
