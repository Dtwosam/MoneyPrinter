name: Printer V1 standard 4h eligible-subset independent proof

on:
  pull_request:
    branches:
      - agent/v2-9-8b-post-dtw100-standard-four-hour-eligible-subset-independent-proof-base

permissions:
  contents: read

jobs:
  exact-head-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production head
        uses: actions/checkout@v4
        with:
          ref: 74e7d45d27d8a03bce305bd76aea004d43274b4d
          fetch-depth: 0

      - name: Assert exact production head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "74e7d45d27d8a03bce305bd76aea004d43274b4d"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project
        run: python -m pip install -e .

      - name: Compile directly affected modules
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/campaign_ownership.py \
            src/printer_v1/operator_cli/one_token_4h_runtime.py \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_eligible_subset.py

      - name: Run independent exact-head proof suite
        run: |
          python -m unittest -v \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_eligible_subset \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_campaign_handoff \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_policy_capacity \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_collection_state_accounting \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_close_memory_terminal_reconciliation \
            tests.test_v2_9_7d_4a_token_local_selective_continuation

      - name: Assert exact policy and capability locks
        run: |
          python - <<'PY'
          from printer_v1.operator_cli.one_token_4h_runtime import (
              STANDARD_FOUR_HOUR_ELIGIBILITY_CONTRACT_VERSION,
              runtime_budget,
              standard_campaign_lifecycle_budget,
          )
          from printer_v1.snapshots.cadence_policy import get_policy

          assert STANDARD_FOUR_HOUR_ELIGIBILITY_CONTRACT_VERSION == "STANDARD_4H_ELIGIBILITY_V1"
          cases = (
              (("TRACK_FAST", "TRACK_FAST"), (False, False), 92, 82),
              (("TRACK_FAST", "TRACK_FAST"), (True, False), 161, 146),
              (("TRACK_FAST", "TRACK_FAST"), (True, True), 230, 210),
              (("TRACK_FAST", "TRACK_NORMAL"), (False, False), 74, 64),
              (("TRACK_FAST", "TRACK_NORMAL"), (True, False), 143, 128),
              (("TRACK_FAST", "TRACK_NORMAL"), (False, True), 113, 98),
              (("TRACK_FAST", "TRACK_NORMAL"), (True, True), 182, 162),
              (("TRACK_NORMAL", "TRACK_NORMAL"), (False, False), 56, 46),
              (("TRACK_NORMAL", "TRACK_NORMAL"), (True, False), 95, 80),
              (("TRACK_NORMAL", "TRACK_NORMAL"), (True, True), 134, 114),
          )
          for lanes, mask, req, sched in cases:
              budget = standard_campaign_lifecycle_budget(lanes, mask)
              assert budget["request_ceiling"] == req
              assert budget["scheduler_ceiling"] == sched
              assert budget["continuation_count"] == sum(mask)
              assert budget["real_collection_enabled"] is False
          for lane in ("TRACK_FAST", "TRACK_NORMAL"):
              assert runtime_budget(lane)["enabled_for_real_collection"] is False
              for window_kind in ("WINDOW_4H", "WINDOW_12H", "WINDOW_24H"):
                  policy = get_policy(window_kind, lane)
                  assert policy is not None
                  assert policy.enabled_for_real_collection is False
          PY

      - name: Verify repository remained read-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
