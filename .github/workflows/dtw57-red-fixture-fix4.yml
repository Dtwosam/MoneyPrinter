name: DTW-57 RED Fixture Fix 4

on:
  pull_request:
    branches:
      - tmp/dtw57-red-fix4-orchestration
    types: [opened]

permissions:
  contents: write

env:
  TARGET_BRANCH: agent/v2-9-8b-window-15m-checkpoint-8-dtw57-independent-inspector-red
  EXPECTED_HEAD: 41bf14f6cacf6e6cfa26d4f9edc87340cf19d384
  TEST_FILE: tests/test_v2_9_8b_window_15m_checkpoint8_dtw57_durable_reconstruction_red.py

jobs:
  fix-test-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target RED branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 5

      - name: Patch exact cases by line identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_v2_9_8b_window_15m_checkpoint8_dtw57_durable_reconstruction_red.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          i = next(i for i, line in enumerate(lines) if '"campaign_window_memory_mismatch",' in line)
          j = next(i for i in range(i, len(lines)) if '"CAMPAIGN_MEMORY_WINDOW_IDENTITY_MISMATCH",' in lines[i])
          lines[i] = lines[i].replace("campaign_window_memory_mismatch", "campaign_window_memory_binding_missing")
          binding_line = next(k for k in range(i, j + 1) if '{"memory_window_row_id": 102},' in lines[k])
          lines[binding_line] = lines[binding_line].replace('{"memory_window_row_id": 102}', '{"memory_window_row_id": None}')
          lines[j] = lines[j].replace("CAMPAIGN_MEMORY_WINDOW_IDENTITY_MISMATCH", "CAMPAIGN_MEMORY_WINDOW_BINDING_MISSING")

          i = next(i for i, line in enumerate(lines) if '"scheduler_join_missing",' in line)
          j = next(i for i in range(i, len(lines)) if '"SCHEDULER_JOIN_MISMATCH",' in lines[i])
          indent = lines[i][: len(lines[i]) - len(lines[i].lstrip())]
          replacement = [
              indent + '"scheduler_join_missing",',
              indent + 'lambda proof_dir, db_path: _mutate_db(',
              indent + '    db_path,',
              indent + '    "DELETE FROM printer_memory_factory_campaign_scheduler_work "',
              indent + '    "WHERE scheduler_work_id=\'lifecycle-work-1\'",',
              indent + '),',
              indent + '"SCHEDULER_JOIN_MISMATCH",',
          ]
          lines[i:j + 1] = replacement

          text = "\n".join(lines) + "\n"
          compile(text, str(path), "exec")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify one-file scope and compile
        run: |
          set -euo pipefail
          FILES="$(git diff --name-only)"
          test "$FILES" = "$TEST_FILE"
          git diff --check
          python -m py_compile "$TEST_FILE"

      - name: Commit corrected RED fixture
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TEST_FILE"
          git commit -m "Repair DTW-57 persisted RED cases"
          git push origin "HEAD:$TARGET_BRANCH"
