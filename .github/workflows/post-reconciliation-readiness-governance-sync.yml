name: Post-Reconciliation Readiness Governance Sync

on:
  push:
    branches:
      - governance/v2-9-8b-post-reconciliation-readiness-closeout

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/v2-9-8b-post-reconciliation-readiness-closeout
          fetch-depth: 0

      - name: Synchronize readiness governance
        shell: bash
        run: |
          set -euo pipefail
          python .github/post_reconciliation_readiness_governance_sync.py
          git rm \
            .github/workflows/post-reconciliation-readiness-governance-sync.yml \
            .github/post_reconciliation_readiness_governance_sync.py
          git add \
            AGENTS.md \
            CURRENT_HANDOFF.md \
            docs/printer-v1-v2-9-8b-post-reconciliation-next-bounded-campaign-readiness-closeout.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Close post-reconciliation readiness and advance authorization preparation'
          git push origin HEAD:governance/v2-9-8b-post-reconciliation-readiness-closeout
