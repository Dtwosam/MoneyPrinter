name: V2-9.8B FK authority repair staging

on:
  push:
    branches:
      - assistant/v2-9-8b-fk-authority-repair-staging

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Apply exact authority-aware reserve projection repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/printer_v1/discovery/eligible_token_supply.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _legacy_pump_reserve_projection_allowed(
              candidate: Mapping[str, Any],
          ) -> bool:
              """Whether a candidate may enter the Pump-registry-bound legacy reserve.

              An explicit non-Pump pool program is authoritative evidence that this
              compatibility projection does not apply. Carriers that predate the generic
              identity fields retain the historical behavior so Pump validation still
              fails closed through the existing foreign key when its registry parent is
              unexpectedly absent.
              """
              from printer_v1.sources.pumpswap import PUMPSWAP_AMM_PROGRAM_ID

              pool_program = str(
                  candidate.get("pool_program")
                  or candidate.get("pumpswap_program_id")
                  or ""
              ).strip()
              return not pool_program or pool_program == PUMPSWAP_AMM_PROGRAM_ID
          '''
          new = '''def _legacy_pump_reserve_projection_allowed(
              candidate: Mapping[str, Any],
          ) -> bool:
              """Whether a candidate may enter the Pump-registry-bound legacy reserve.

              Explicit admission authority is authoritative. Market-present candidates
              prove current pool existence only and must never be projected into the
              Pump-graduation-backed reserve, even when that current pool is PumpSwap.

              Legacy carriers without an authority field preserve their historical
              compatibility behavior and remain protected by the existing foreign key.
              """
              from printer_v1.discovery.memory_observation_activation import (
                  AdmissionAuthority,
              )
              from printer_v1.sources.pumpswap import PUMPSWAP_AMM_PROGRAM_ID

              admission_authority = str(
                  candidate.get("admission_authority") or ""
              ).strip()
              if (
                  admission_authority
                  and admission_authority
                  != AdmissionAuthority.DIRECT_PUMP_PUMPSWAP.value
              ):
                  return False

              pool_program = str(
                  candidate.get("pool_program")
                  or candidate.get("pumpswap_program_id")
                  or ""
              ).strip()
              return not pool_program or pool_program == PUMPSWAP_AMM_PROGRAM_ID
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one repair target, got {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Run focused regression set
        run: |
          python -m pytest -q \
            tests/test_v2_9_8b_generic_present_pool_conversion.py \
            tests/test_v2_9_8b_later_cycle_fresh_acquisition_implementation.py \
            tests/test_v2_9_8b_corrective_program.py \
            tests/test_v2_9_8b_cycle2_market_evidence_rehydration_repair.py \
            tests/test_v2_9_8b_cycle2_acquisition_ledger_timestamp_repair.py
      - name: Compile repaired module
        run: python -m py_compile src/printer_v1/discovery/eligible_token_supply.py
      - name: Update compact handoff
        run: |
          cat > CURRENT_HANDOFF.md <<'EOF'
          # Printer V1 Handoff

          ## Current capability
          Active branch: `assistant/v2-9-8b-later-cycle-mint-market-replay-repair`. Printer V1 remains Solana-only, memecoin-only, paper-only. Source Governor remains the sole source-request owner and Central Scheduler the sole scheduler owner. Strict evidence/provenance/freshness gates remain fail-closed.

          ## Latest meaningful result
          Standard-4H campaign `20260912T213005Z-c3c0bea44b6f-campaign` failed in `CAMPAIGN_PRE_LIFECYCLE` with `IntegrityError:FOREIGN KEY constraint failed` after 12 source calls, 0 scheduler runtime calls, and 6 DB writes. Cleanup completed and the lease was released. Authorization `V2_9_8B_FOUR_TOKEN_STD4H_AUTH_20260912T211937Z_f0d06977` was consumed and is permanently non-reusable.

          ## Proven blocker and repair
          Generic/current-market discovery may lawfully produce `MARKET_PRESENT_POOL` candidates whose current pool program is PumpSwap while origin remains unknown. `_legacy_pump_reserve_projection_allowed()` previously treated the PumpSwap program alone as sufficient for the legacy `printer_eligible_token_reserve`, whose `mint_identity` FK requires a `printer_pumpswap_graduated_candidate_registry` parent. That false Pump-graduation projection caused the pre-lifecycle FK failure.

          The projector now honors explicit admission authority: any explicit authority other than `DIRECT_PUMP_PUMPSWAP` is excluded from the Pump-registry-bound legacy reserve. Authority-absent legacy carriers preserve historical fail-closed compatibility, and the PumpSwap program check remains unchanged. No FK, provenance, source, scheduler, or admission gate was weakened.

          ## Verification
          TDD RED was proven on commit `63a099eab6238ecc9e783161e7f7d394b437bc88`: the new market-present/PumpSwap regression was the sole failure (`1 failed, 380 passed, 2 deselected, 32 subtests passed`). Focused disposable-state regression tests and `py_compile` passed on the repaired staging tree before promotion; the authoritative branch push workflow must also pass before any future operational preflight.

          ## Exact next permitted action
          Do not rerun or reuse any consumed/stale authorization. After the repaired authoritative HEAD is green, any future Standard-4H operational attempt still requires a brand-new one-shot authorization bound to the then-current GitHub HEAD and authoritative DB identity, fresh migration/integrity/FK/zero-active-work proof, and new explicit operator approval. Development-only verification may continue on disposable state.
          EOF
      - name: Remove temporary staging workflow and verify diff
        run: |
          rm .github/workflows/v2-9-8b-fk-authority-repair-staging.yml
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              ".github/workflows/v2-9-8b-fk-authority-repair-staging.yml",
              "CURRENT_HANDOFF.md",
              "src/printer_v1/discovery/eligible_token_supply.py",
          }
          actual = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected diff paths: {sorted(actual)}")
          PY
      - name: Commit verified staging repair
        run: |
          git config user.name "ChatGPT Repair CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/printer_v1/discovery/eligible_token_supply.py CURRENT_HANDOFF.md .github/workflows/v2-9-8b-fk-authority-repair-staging.yml
          git commit -m "fix: bind legacy reserve projection to authority"
          git push origin HEAD:assistant/v2-9-8b-fk-authority-repair-staging
