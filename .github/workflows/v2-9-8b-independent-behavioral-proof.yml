name: V2-9.8B independent behavioral proof

on:
  push:
    branches:
      - agent/v2-9-8b-corrective-program-cycle2-memory-flow
  pull_request:
    branches:
      - agent/v2-9-8b-four-token-4-2-2-freeze-input-versus-two-slot-truncation-repair-implementation

permissions:
  contents: read

jobs:
  independent-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Independent behavioral proof
        run: python -m pytest -q tests/test_v2_9_8b_corrective_program_independent_behavioral_proof.py
      - name: Original focused corrective proof
        run: python -m pytest -q tests/test_v2_9_8b_corrective_program.py
      - name: Eligible supply nearby proof
        run: python -m pytest -q tests/test_v2_9_8b_21_eligible_token_supply_architecture.py
      - name: Later-cycle owner binding proof
        run: python -m pytest -q tests/test_v2_9_8b_later_cycle_fresh_acquisition_implementation.py
      - name: Persistent Scheduler refresh proof
        run: python -m pytest -q tests/test_v2_9_8b_persistent_refresh_owner_proof.py
      - name: Resolved-resolved identity still fails closed
        run: python -m pytest -q tests/test_v2_9_8b_permanent_discovery_availability.py -k resolved_program_identity_conflict
      - name: 4h U2 and E2Z quality path
        run: python -m pytest -q tests/test_v2_8_1_one_token_4h_runtime.py -k test_clean_close_runs_e2q_lane_q_lane_k_and_is_idempotent
      - name: Trading-flow regression
        run: python -m pytest -q tests/test_phase11_trading_flow_engine.py
      - name: Four-token freeze and admission regression
        run: python -m pytest -q tests/test_v2_9_8b_four_token_freeze_input_truncation_repair.py
      - name: Diff check
        run: git diff --check HEAD^ HEAD
