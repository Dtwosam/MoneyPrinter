name: V2-9.8B independent behavioral proof

on:
  push:
    branches:
      - agent/v2-9-8b-corrective-program-cycle2-memory-flow
  pull_request:
    branches:
      - agent/v2-9-8b-four-token-4-2-2-freeze-input-versus-two-slot-truncation-repair-implementation

permissions:
  contents: read

jobs:
  final-diff-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Final PR diff check
        run: git diff --check "origin/${GITHUB_BASE_REF}"...HEAD
