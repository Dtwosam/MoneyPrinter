name: V2-9.8B synthetic temp boundary verification

on:
  push:
    branches:
      - assistant/v2-9-8b-synthetic-validation-temp-boundary-repair
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-temp-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Run synthetic temporary-boundary regressions
        run: |
          python -m pytest -q \
            tests/test_v2_9_8b_synthetic_validation_temp_boundary.py \
            tests/test_phase20_hardening_synthetic_validation.py::Phase20HardeningSyntheticValidationTest::test_full_synthetic_validation_flow_records_run_and_items \
            tests/test_v2_9_8b_clean_memory_consumer_lockout.py \
            tests/test_v2_9_8b_lane8b_paper_decision_lockout.py
      - name: Compile synthetic validation modules
        run: |
          python -m py_compile \
            src/printer_v1/hardening/flow_validation.py \
            src/printer_v1/hardening/_flow_validation_impl.py \
            src/printer_v1/operator_cli/commands.py
      - name: Check diff whitespace
        run: git diff --check b6ff36d5eacc1d529de610c24fb9de647aef76b0..HEAD
