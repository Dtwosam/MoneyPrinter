name: V2-9.8B shard 6 failure isolation

on:
  push:
    branches:
      - agent/v2-9-8b-broad-regression-diagnostic

permissions:
  contents: read

jobs:
  shard6-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install -q -e . pytest pytest-timeout
      - name: Run shard 6 without known real-sleep cadence file
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(python - <<'PY'
          import glob
          excluded = {
              'tests/test_v2_9_8b_window_15m_final_integrated_readiness_repair.py',
              'tests/test_post_lane10_lane_u_cadence_policy.py',
          }
          files = [p for p in sorted(glob.glob('tests/test*.py')) if p not in excluded]
          for i, path in enumerate(files):
              if i % 8 == 6:
                  print(path)
          PY
          )
          echo "Shard 6 isolation: ${#FILES[@]} test files"
          PYTHONPATH=src python -m pytest -x -vv --tb=short --timeout=60 --timeout-method=thread "${FILES[@]}"
