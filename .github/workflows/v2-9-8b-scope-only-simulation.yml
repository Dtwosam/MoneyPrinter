name: V2-9.8B scope-only integration simulation

on:
  push:
    branches:
      - assistant/v2-9-8b-scope-fixed-sim-final
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scope-only-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Apply scope-only reconstruction
        run: python .github/repair/apply_scope_only_simulation.py
      - name: Scope/freeze-ready focused proof
        run: |
          python -m pytest -q tests/test_v2_9_8b_freeze_ready_wiring_completion.py
          python -m py_compile src/printer_v1/discovery/eligible_token_supply.py src/printer_v1/operator_cli/_graduated_supply_front_door_base.py
          git diff --check
      - name: Commit scope-only simulated base
        run: |
          git rm .github/repair/apply_scope_only_simulation.py
          git add src/printer_v1/discovery/eligible_token_supply.py src/printer_v1/operator_cli/_graduated_supply_front_door_base.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'sim: reconstruct scope propagation repair only'
          git push origin "HEAD:${GITHUB_REF_NAME}"
