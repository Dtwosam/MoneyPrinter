name: DTW-65 Canonical Requested Identity RED

on:
  pull_request:
    branches:
      - tmp/dtw65-red-orchestration
    types: [opened]

permissions:
  contents: read

env:
  DESIGN_HEAD: 5f89dea6ae4e7abfa0bca6c2070d0d487fc95ef3
  RED_HEAD: 2884a59ad54e2eb391e190da8cf03bff112078b1
  TEST_FILE: tests/test_v2_9_8b_window_15m_checkpoint8_dtw65_requested_identity_red.py

jobs:
  deterministic-red:
    if: github.event.pull_request.head.ref == 'tmp/dtw65-red-trigger'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RED_HEAD }}
          fetch-depth: 5

      - name: Verify test-only RED state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RED_HEAD"
          test "$(git diff --name-only "$DESIGN_HEAD" "$RED_HEAD")" = "$TEST_FILE"
          test -z "$(git diff --name-only "$DESIGN_HEAD" "$RED_HEAD" -- src scripts)"
          git diff --check "$DESIGN_HEAD" "$RED_HEAD"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile RED test
        shell: bash
        run: python -m py_compile "$TEST_FILE"

      - name: Execute accepted DTW-65 RED only
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -uo pipefail
          set +e
          pytest -q "$TEST_FILE" 2>&1 | tee /tmp/dtw65-red.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "DTW65_PYTEST_RC=$RC"
          test "$RC" -ne 0
          if grep -Eq "ERROR at setup|ERROR collecting|SyntaxError|sqlite3\.IntegrityError" /tmp/dtw65-red.log; then
            echo "DTW65_INVALID_RED_SETUP_OR_FIXTURE_ERROR"
            exit 1
          fi
          grep -Eq "5 failed, 3 passed|3 passed, 5 failed" /tmp/dtw65-red.log
          grep -q "REPORT_REPLAY_REQUESTED_IDENTITY_MISSING" /tmp/dtw65-red.log
          echo "DTW65_ACCEPTED_RED_OBSERVED"
