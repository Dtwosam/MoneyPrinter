name: V2-9.8B broad regression sharded diagnostic

on:
  push:
    branches:
      - agent/v2-9-8b-broad-regression-diagnostic

permissions:
  contents: read

jobs:
  broad-regression-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        shell: bash
        run: python -m pip install -q -e . pytest pytest-timeout
      - name: Compile Printer
        shell: bash
        run: python -m compileall -q src/printer_v1
      - name: Run broad regression shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(python - <<'PY'
          import glob, os
          shard = int(os.environ['SHARD'])
          excluded = 'tests/test_v2_9_8b_window_15m_final_integrated_readiness_repair.py'
          files = [p for p in sorted(glob.glob('tests/test*.py')) if p != excluded]
          for i, path in enumerate(files):
              if i % 8 == shard:
                  print(path)
          PY
          )
          echo "Shard ${SHARD}: ${#FILES[@]} test files"
          PYTHONPATH=src python -m pytest -q --timeout=60 --timeout-method=thread "${FILES[@]}"
      - name: Diff check
        shell: bash
        run: git diff --check
