name: ChatGPT bundle canonical migrations 001-058

on:
  push:
    branches:
      - agent/chatgpt-aug25-historical055-proof
    paths:
      - .github/workflows/chatgpt-bundle-migrations.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bundle exact canonical migrations 001-058
        shell: bash
        run: |
          set -euo pipefail
          tar -czf migrations_001_058.tar.gz $(find migrations -maxdepth 1 -type f -name '*.sql' | sort | head -58)
          test "$(tar -tzf migrations_001_058.tar.gz | wc -l)" -eq 58
      - name: Upload exact migration bundle
        uses: actions/upload-artifact@v4
        with:
          name: migrations-001-058-canonical
          path: migrations_001_058.tar.gz
          if-no-files-found: error
          retention-days: 1
