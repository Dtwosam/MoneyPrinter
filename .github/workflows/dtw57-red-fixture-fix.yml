name: DTW-57 RED Fixture Fix

on:
  pull_request:
    branches:
      - tmp/dtw57-red-fix-orchestration
    types: [opened]

permissions:
  contents: write

env:
  TARGET_BRANCH: agent/v2-9-8b-window-15m-checkpoint-8-dtw57-independent-inspector-red
  BAD_HEAD: a4d220138e4273482430c7b26981337ce20405f7
  GOOD_FIXTURE_HEAD: 5b16371ee2373e81a163ad664f8730845b2ee901
  TEST_FILE: tests/test_v2_9_8b_window_15m_checkpoint8_dtw57_durable_reconstruction_red.py

jobs:
  fix-test-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target RED branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Restore good fixture and patch negative mutations only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BAD_HEAD"
          git show "$GOOD_FIXTURE_HEAD:$TEST_FILE" > "$TEST_FILE"
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_v2_9_8b_window_15m_checkpoint8_dtw57_durable_reconstruction_red.py")
          text = path.read_text()

          old = '''def _mutate_db(db_path: Path, sql: str, params: tuple = ()) -> None:
              connection = sqlite3.connect(db_path)
              try:
                  connection.execute("PRAGMA foreign_keys = OFF")
                  connection.execute(sql, params)
                  connection.commit()
              finally:
                  connection.close()


          def _mutate_summary(proof_dir: Path, mutate) -> None:
          '''
          new = '''def _mutate_db(db_path: Path, sql: str, params: tuple = ()) -> None:
              connection = sqlite3.connect(db_path)
              try:
                  connection.execute("PRAGMA foreign_keys = OFF")
                  connection.execute(sql, params)
                  connection.commit()
              finally:
                  connection.close()


          def _replace_row(
              db_path: Path,
              table: str,
              key_column: str,
              key_value,
              updates: dict,
          ) -> None:
              connection = sqlite3.connect(db_path)
              connection.row_factory = sqlite3.Row
              try:
                  connection.execute("PRAGMA foreign_keys = OFF")
                  row = connection.execute(
                      f'SELECT * FROM "{table}" WHERE "{key_column}"=?',
                      (key_value,),
                  ).fetchone()
                  assert row is not None
                  payload = dict(row)
                  payload.update(updates)
                  connection.execute(
                      f'DELETE FROM "{table}" WHERE "{key_column}"=?',
                      (key_value,),
                  )
                  columns = tuple(payload)
                  placeholders = ",".join("?" for _ in columns)
                  column_sql = ",".join(f'"{column}"' for column in columns)
                  connection.execute(
                      f'INSERT INTO "{table}" ({column_sql}) VALUES ({placeholders})',
                      tuple(payload[column] for column in columns),
                  )
                  connection.commit()
              finally:
                  connection.close()


          def _delete_clean_episode_chain(db_path: Path, episode_id: int) -> None:
              connection = sqlite3.connect(db_path)
              try:
                  connection.execute("PRAGMA foreign_keys = OFF")
                  connection.execute(
                      "DELETE FROM printer_memory_fingerprints WHERE episode_id=?",
                      (episode_id,),
                  )
                  connection.execute(
                      "DELETE FROM printer_episodes WHERE id=?",
                      (episode_id,),
                  )
                  connection.commit()
              finally:
                  connection.close()


          def _mutate_summary(proof_dir: Path, mutate) -> None:
          '''
          assert old in text
          text = text.replace(old, new)

          replacements = {
              '''            lambda proof_dir, db_path: _mutate_db(
                              db_path,
                              "UPDATE printer_memory_factory_campaign_runs "
                              "SET authoritative_run_id=NULL WHERE run_id=?",
                              (CAMPAIGN_RUN_ID,),
                          ),''':
              '''            lambda proof_dir, db_path: _replace_row(
                              db_path,
                              "printer_memory_factory_campaign_runs",
                              "run_id",
                              CAMPAIGN_RUN_ID,
                              {"authoritative_run_id": None},
                          ),''',
              '''            lambda proof_dir, db_path: _mutate_db(
                              db_path,
                              "UPDATE printer_memory_factory_campaign_windows "
                              "SET memory_window_row_id=102 WHERE window_id='campaign-window-1'",
                          ),''':
              '''            lambda proof_dir, db_path: _replace_row(
                              db_path,
                              "printer_memory_factory_campaign_windows",
                              "window_id",
                              "campaign-window-1",
                              {"memory_window_row_id": 102},
                          ),''',
              '''            lambda proof_dir, db_path: _mutate_db(
                              db_path,
                              "DELETE FROM printer_episodes WHERE id=201",
                          ),''':
              '''            lambda proof_dir, db_path: _delete_clean_episode_chain(
                              db_path,
                              201,
                          ),''',
              '''            lambda proof_dir, db_path: _mutate_db(
                              db_path,
                              "UPDATE printer_memory_factory_campaign_scheduler_work "
                              "SET scheduler_job_id=999 WHERE scheduler_work_id='lifecycle-work-1'",
                          ),''':
              '''            lambda proof_dir, db_path: _replace_row(
                              db_path,
                              "printer_memory_factory_campaign_scheduler_work",
                              "scheduler_work_id",
                              "lifecycle-work-1",
                              {"scheduler_job_id": 2},
                          ),''',
              '''            lambda proof_dir, db_path: _mutate_db(
                              db_path,
                              "UPDATE printer_memory_factory_campaign_scheduler_work "
                              "SET factory_run_id=? WHERE scheduler_work_id='lifecycle-work-1'",
                              (ALT_FACTORY_RUN_ID,),
                          ),''':
              '''            lambda proof_dir, db_path: _replace_row(
                              db_path,
                              "printer_memory_factory_campaign_scheduler_work",
                              "scheduler_work_id",
                              "lifecycle-work-1",
                              {"factory_run_id": ALT_FACTORY_RUN_ID},
                          ),''',
          }
          for before, after in replacements.items():
              assert before in text
              text = text.replace(before, after)

          compile(text, str(path), "exec")
          path.write_text(text)
          PY

      - name: Verify one-file scope and compile
        run: |
          set -euo pipefail
          FILES="$(git diff --name-only)"
          test "$FILES" = "$TEST_FILE"
          git diff --check
          python -m py_compile "$TEST_FILE"

      - name: Commit corrected RED fixture
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TEST_FILE"
          git commit -m "Repair DTW-57 RED negative fixtures"
          git push origin "HEAD:$TARGET_BRANCH"
