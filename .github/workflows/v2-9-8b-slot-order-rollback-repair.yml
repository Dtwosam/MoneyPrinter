name: V2-9.8B slot-order rollback repair

on:
  push:
    branches:
      - agent/v2-9-8b-four-token-slot-order-rollback-repair

permissions:
  contents: write

jobs:
  focused-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install -e . pytest
      - name: Apply exact GREEN patch
        run: python tools/v2_9_8b_apply_slot_order_rollback_repair.py
      - name: Run focused repair contracts
        run: python -m pytest -q tests/test_v2_9_8b_four_token_slot_order_rollback_repair.py
      - name: Compile changed production module
        run: python -m py_compile src/printer_v1/operator_cli/one_command_15m_factory.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit verified production repair
        run: |
          git config user.name "Dtwosam"
          git config user.email "42391449+Dtwosam@users.noreply.github.com"
          git add src/printer_v1/operator_cli/one_command_15m_factory.py
          git commit -m "Repair four-token Cycle-1 slot order and rollback boundary"
          git push origin HEAD:agent/v2-9-8b-four-token-slot-order-rollback-repair
