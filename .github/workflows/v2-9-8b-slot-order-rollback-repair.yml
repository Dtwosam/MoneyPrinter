name: V2-9.8B slot-order rollback repair

on:
  push:
    branches:
      - agent/v2-9-8b-four-token-slot-order-rollback-repair

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install -e . pytest
      - name: Run slot-order rollback contracts
        run: python -m pytest -q tests/test_v2_9_8b_four_token_slot_order_rollback_repair.py
