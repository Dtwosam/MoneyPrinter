name: Aug28 Consumed Auth Disposition RED

on:
  push:
    branches:
      - design/v2-9-8b-aug28-consumed-auth-historical-disposition

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Verify expected RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_v2_9_8b_aug28_consumed_authorization_historical_disposition.py > red.txt 2>&1
          code=$?
          cat red.txt
          if [ "$code" -eq 0 ]; then
            echo 'RED_UNEXPECTEDLY_GREEN'
            exit 1
          fi
          grep -q "DISPOSITION_NOT_AVAILABLE" red.txt || {
            echo 'RED_WRONG_REASON'
            exit 1
          }
          grep -q "CONSUMED_CHILD_EXITED_NONZERO" red.txt || {
            echo 'RED_EXPECTATION_NOT_VISIBLE'
            exit 1
          }
          echo 'EXPECTED_RED=PASS'
