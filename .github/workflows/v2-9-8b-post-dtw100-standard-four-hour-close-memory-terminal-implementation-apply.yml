name: V2-9.8B post-DTW100 standard four-hour close memory terminal apply

on:
  pull_request:

permissions:
  contents: write

env:
  PYTHONPATH: src

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact amended RED parent
        run: |
          echo "TRIGGER_HEAD=$(git rev-parse HEAD)"
          echo "RED_PARENT=$(git rev-parse HEAD^)"
          test "$(git rev-parse HEAD^)" = "b9080a69430ea486fc81fe7d188d5b61bb82ce85"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/v2-9-8b-post-dtw100-standard-four-hour-close-memory-terminal-implementation-trigger.txt"
          git checkout b9080a69430ea486fc81fe7d188d5b61bb82ce85
          test "$(git rev-parse HEAD)" = "b9080a69430ea486fc81fe7d188d5b61bb82ce85"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Apply approved two-file repair
        run: |
          git fetch origin agent/v2-9-8b-post-dtw100-standard-four-hour-close-memory-terminal-implementation-apply-base --depth=1
          git show FETCH_HEAD:.github/scripts/apply_standard_four_hour_close_memory_terminal_repair.py > /tmp/apply_standard_four_hour_close_memory_terminal_repair.py
          python /tmp/apply_standard_four_hour_close_memory_terminal_repair.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/printer_v1/operator_cli/one_token_4h_runtime.py')
          p.write_text(p.read_text().rstrip() + '\n')
          PY
          printf '%s\n' \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            src/printer_v1/operator_cli/one_token_4h_runtime.py > /tmp/expected.txt
          git diff --name-only | sort > /tmp/actual.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git diff --check
      - name: Compile
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            src/printer_v1/operator_cli/one_token_4h_runtime.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_close_memory_terminal_reconciliation.py
      - name: Focused GREEN verification
        run: |
          python -m unittest -v \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_close_memory_terminal_reconciliation \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_collection_state_accounting \
            tests.test_v2_9_8b_post_dtw100_checkpoint4_1h_close_boundary \
            tests.test_v2_9_8b_post_dtw100_checkpoint5_1h_memory_construction \
            tests.test_v2_8_1_one_token_4h_runtime
      - name: Preserve capability locks and scope
        run: |
          python - <<'PY'
          from printer_v1.operator_cli.one_token_4h_runtime import runtime_budget
          from printer_v1.snapshots.cadence_policy import get_policy
          for lane in ('TRACK_FAST', 'TRACK_NORMAL'):
              assert runtime_budget(lane)['enabled_for_real_collection'] is False
              assert get_policy('WINDOW_4H', lane).enabled_for_real_collection is False
          for window in ('WINDOW_12H', 'WINDOW_24H'):
              for lane in ('TRACK_FAST', 'TRACK_NORMAL'):
                  assert get_policy(window, lane).enabled_for_real_collection is False
          PY
          git diff --check
          git diff --name-only | sort > /tmp/actual-final.txt
          diff -u /tmp/expected.txt /tmp/actual-final.txt
      - name: Commit production-only repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            src/printer_v1/operator_cli/one_token_4h_runtime.py
          git commit -m "Repair standard four-hour close memory terminal reconciliation"
          git push origin HEAD:agent/v2-9-8b-post-dtw100-standard-four-hour-campaign-integration-implementation
