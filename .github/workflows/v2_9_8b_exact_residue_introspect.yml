name: V2-9.8B exact residue introspection
on:
  push:
    branches:
      - review/v2-9-8b-interrupted-four-token-exact-residue-ci
permissions:
  contents: read
jobs:
  introspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e .
          PYTHONPATH="$PWD/src" python .github/scripts/v2_9_8b_exact_residue_introspect.py
