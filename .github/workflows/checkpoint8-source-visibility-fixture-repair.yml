name: Checkpoint 8 Source Visibility Fixture Repair

on:
  pull_request:
    branches:
      - agent/v2-9-8b-window-15m-checkpoint-8-source-visibility-failure-audit-repair
    types: [opened]

permissions:
  contents: write

env:
  REPAIR_BRANCH: agent/v2-9-8b-window-15m-checkpoint-8-source-visibility-failure-audit-repair
  EXPECTED_DESIGN_HEAD: f7dca5b53e0c973009195a2fd785368033d33f0c

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact repair design HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REPAIR_BRANCH }}
          fetch-depth: 2

      - name: Verify repair baseline
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_DESIGN_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Printer V1 and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Apply exact proof-only fixture repair
        run: |
          python - <<'PY'
          from pathlib import Path

          harness = Path('scripts/v2_9_8b_checkpoint8_controlling_public_composition_proof.py')
          text = harness.read_text(encoding='utf-8')

          import_anchor = '''from printer_v1.sources.pump_contracts import (\n    PUMP_EVENT_AUTHORITY_ID,\n    PUMP_GLOBAL_ID,\n    PUMP_MIGRATE_DISCRIMINATOR,\n    PUMP_WITHDRAW_AUTHORITY_ID,\n    PUMPSWAP_AMM_PROGRAM_ID,\n    PUMPSWAP_EVENT_AUTHORITY_ID,\n    PUMPSWAP_GLOBAL_CONFIG_ID,\n    TOKEN_2022_PROGRAM_ID,\n    WSOL_MINT,\n)\n'''
          import_replacement = import_anchor + '''from printer_v1.sources.measured_transport import (\n    build_transport_identity,\n    measured_payload_fields,\n    pumpswap_verification_transport_count,\n)\n'''
          if text.count(import_anchor) != 1:
              raise SystemExit(f'harness measured import anchor count={text.count(import_anchor)}')
          text = text.replace(import_anchor, import_replacement, 1)

          time_old = '        create_block_time = 1_800_000_000 + ordinal * 60\n'
          time_new = '        create_block_time = 1_786_000_000 + ordinal * 60\n'
          if text.count(time_old) != 1:
              raise SystemExit(f'harness time anchor count={text.count(time_old)}')
          text = text.replace(time_old, time_new, 1)

          old = '''def _checkpoint8_pumpswap_confirmation(candidate: dict[str, Any]) -> dict[str, Any]:\n    row = _checkpoint8_market_candidate(candidate)\n    return {\n        "pumpswap_confirmation": {\n            "confirmed": True,\n            "reason": "confirmed_pumpswap_pool",\n            "pool_address": row["pool"],\n            "expected_mint": row["mint"],\n            "program_id": PUMPSWAP_AMM_PROGRAM_ID,\n            "owner": PUMPSWAP_AMM_PROGRAM_ID,\n            "base_mint_offset": 43,\n        },\n        "migration_signature": candidate["migration_signature"],\n        "migration_block_time": candidate["migration_block_time"],\n        "migration_slot": candidate["migration_slot"],\n        "transport_operations_used": 1,\n        "response_bytes": 512,\n        "normalized_rows": 1,\n    }\n'''
          new = '''def _checkpoint8_pumpswap_confirmation(candidate: dict[str, Any]) -> dict[str, Any]:\n    row = _checkpoint8_market_candidate(candidate)\n    account_keys = tuple(\n        candidate["migration_transaction"]["transaction"]["message"]["accountKeys"]\n    )\n    identities = (\n        build_transport_identity(\n            stage="PUMPSWAP_EXACT_VERIFICATION",\n            source_name="solana_rpc",\n            endpoint_owner="solana",\n            governed_request_kind="pumpswap_signature_pool_resolution",\n            method_or_endpoint="getTransaction",\n            within_request_ordinal=1,\n            target_category="migration_signature",\n            target_identity=candidate["migration_signature"],\n            response_bytes=256,\n            normalized_rows=1,\n        ),\n        build_transport_identity(\n            stage="PUMPSWAP_EXACT_VERIFICATION",\n            source_name="solana_rpc",\n            endpoint_owner="solana",\n            governed_request_kind="pumpswap_signature_pool_resolution",\n            method_or_endpoint="getMultipleAccounts",\n            within_request_ordinal=2,\n            target_category="account_batch",\n            target_identity=row["mint"],\n            response_bytes=256,\n            normalized_rows=len(account_keys),\n        ),\n    )\n    measured = measured_payload_fields(identities)\n    measured["expected_transport_operations"] = pumpswap_verification_transport_count(\n        len(account_keys)\n    )\n    return {\n        "pumpswap_confirmation": {\n            "confirmed": True,\n            "reason": "confirmed_pumpswap_pool",\n            "pool_address": row["pool"],\n            "expected_mint": row["mint"],\n            "program_id": PUMPSWAP_AMM_PROGRAM_ID,\n            "owner": PUMPSWAP_AMM_PROGRAM_ID,\n            "base_mint_offset": 43,\n        },\n        "migration_signature": candidate["migration_signature"],\n        "migration_block_time": candidate["migration_block_time"],\n        "migration_slot": candidate["migration_slot"],\n        **measured,\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit(f'harness confirmation anchor count={text.count(old)}')
          harness.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_v2_9_8b_window_15m_checkpoint8_real_consumer_compatibility.py')
          text = test_path.read_text(encoding='utf-8')
          import_anchor = '''import importlib.util\nfrom pathlib import Path\n\nimport pytest\n'''
          import_replacement = '''import importlib.util\nfrom datetime import datetime, timezone\nfrom pathlib import Path\nimport sqlite3\n\nimport pytest\n'''
          if text.count(import_anchor) != 1:
              raise SystemExit(f'test stdlib import anchor count={text.count(import_anchor)}')
          text = text.replace(import_anchor, import_replacement, 1)

          source_anchor = '''from printer_v1.operator_cli import (\n    window_15m_disposable_public_composition_proof as proof,\n)\n'''
          source_replacement = source_anchor + '''from printer_v1.discovery.direct_migration_discovery import (\n    run_direct_migration_discovery,\n)\n'''
          if text.count(source_anchor) != 1:
              raise SystemExit(f'test source import anchor count={text.count(source_anchor)}')
          text = text.replace(source_anchor, source_replacement, 1)

          addition = '''\n\ndef test_checkpoint8_direct_migration_fixture_reconciles_and_persists_two_candidates(\n    tmp_path: Path,\n) -> None:\n    harness = _load_harness("checkpoint8_direct_migration_accounting")\n    prepared = _prepared(harness, tmp_path)\n    materialized = proof.materialize_disposable_public_composition_execution(\n        prepared.runtime\n    )\n    tripwire = harness.Checkpoint8NetworkTripwire()\n    with tripwire:\n        report = run_direct_migration_discovery(\n            prepared.runtime.plan.resolved_db_path,\n            migration_transport=materialized.top_level_transports["migration_transport"],\n            verifier_transport_factory=materialized.graduated_supply_kwargs[\n                "verifier_transport_factory"\n            ],\n            now=datetime.now(timezone.utc).isoformat(),\n            request_key_prefix="checkpoint8-direct-migration-accounting",\n            max_candidates=2,\n            collection_rounds=1,\n            settle_seconds=0.0,\n            reverify_on_transient=False,\n            reverify_settle_seconds=0.0,\n        )\n\n    assert tripwire.attempt_count == 0\n    assert report["status"] == "COMPLETE"\n    assert report["confirmed_count"] == 2\n    ledger = report["source_operation_ledger"]\n    assert ledger["operation_accounting_reconciled"] is True\n    assert ledger["source_requests"] == 5\n    assert ledger["identity_transport_operations"] == 7\n    assert ledger["transport_operations"] == 7\n\n    now_epoch = int(datetime.now(timezone.utc).timestamp())\n    for candidate in harness._checkpoint8_candidate_records():\n        assert int(candidate["migration_block_time"]) <= now_epoch + 300\n\n    connection = sqlite3.connect(prepared.runtime.plan.resolved_db_path)\n    try:\n        count = int(\n            connection.execute(\n                "SELECT COUNT(*) FROM printer_pumpswap_graduated_candidate_registry"\n            ).fetchone()[0]\n        )\n    finally:\n        connection.close()\n    assert count == 2\n'''
          marker = 'test_checkpoint8_direct_migration_fixture_reconciles_and_persists_two_candidates'
          if marker in text:
              raise SystemExit('direct migration accounting regression already present')
          test_path.write_text(text.rstrip() + addition.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Verify narrow diff
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              'scripts/v2_9_8b_checkpoint8_controlling_public_composition_proof.py',
              'tests/test_v2_9_8b_window_15m_checkpoint8_real_consumer_compatibility.py',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          assert changed == expected, (changed, expected)
          PY

      - name: Run minimum sufficient offline verification
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m py_compile scripts/v2_9_8b_checkpoint8_controlling_public_composition_proof.py
          python -m pytest -q tests/test_v2_9_8b_window_15m_checkpoint8_real_consumer_compatibility.py
          python -m pytest -q tests/test_v2_9_8b_window_15m_checkpoint8_*.py
          git diff --check

      - name: Commit repair only after GREEN
        run: |
          git config user.name "Printer V1 Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            scripts/v2_9_8b_checkpoint8_controlling_public_composition_proof.py \
            tests/test_v2_9_8b_window_15m_checkpoint8_real_consumer_compatibility.py
          git commit -m "Repair Checkpoint 8 PumpSwap fixture accounting"
          git push origin HEAD:"$REPAIR_BRANCH"
