name: V2-9.8B focused repair verification

on:
  push:
    branches:
      - assistant/v2-9-8b-later-cycle-mint-market-replay-repair
      - assistant/v2-9-8b-cycle1-cycle2-four-hour-admission-proof
      - assistant/terminal-only-expired-orphan-reconciliation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Apply exact recovery CLI wiring once
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/printer_v1/operator_cli/operational_memory_factory_command.py")
          text = path.read_text(encoding="utf-8")
          sentinel = 'INSPECT_EXPIRED_ORPHAN_MODE = "inspect-expired-orphan"'
          if sentinel in text:
              print("recovery CLI wiring already present")
              raise SystemExit(0)

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label} anchor count={count}, expected exactly 1")
              text = text.replace(old, new, 1)

          replace_once(
              '''from printer_v1.operator_cli.operational_campaign_recovery import (
              production_recovery_paths,
              recover_exact_orphan,
          )
          ''',
              '''from printer_v1.operator_cli.operational_campaign_recovery import (
              production_recovery_paths,
              recover_exact_orphan,
          )
          from printer_v1.operator_cli.expired_orphan_reconciliation import (
              inspect_expired_orphan,
              terminalize_expired_orphan,
          )
          ''',
              "recovery import",
          )
          replace_once(
              'FOUR_TOKEN_STANDARD_FOUR_HOUR_MODE = "four-token-standard-four-hour-run"\n',
              'FOUR_TOKEN_STANDARD_FOUR_HOUR_MODE = "four-token-standard-four-hour-run"\n'
              'INSPECT_EXPIRED_ORPHAN_MODE = "inspect-expired-orphan"\n'
              'TERMINALIZE_EXPIRED_ORPHAN_MODE = "terminalize-expired-orphan"\n',
              "recovery mode constants",
          )
          replace_once(
              '''            FOUR_TOKEN_ADMISSION_CHECKPOINT_MODE,
                      "status", "cooperative-stop", "recover-orphan",
                      "report-only", "discovery-only",
          ''',
              '''            FOUR_TOKEN_ADMISSION_CHECKPOINT_MODE,
                      INSPECT_EXPIRED_ORPHAN_MODE, TERMINALIZE_EXPIRED_ORPHAN_MODE,
                      "status", "cooperative-stop", "recover-orphan",
                      "report-only", "discovery-only",
          ''',
              "parser mode choices",
          )
          replace_once(
              '''    parser.add_argument(
                  "--run-id",
                  default=None,
                  help="Exact run identity for report-only (requires --campaign-id).",
              )
              args = parser.parse_args(list(argv) if argv is not None else None)
          ''',
              '''    parser.add_argument(
                  "--run-id",
                  default=None,
                  help="Exact run identity for report/recovery modes (requires --campaign-id).",
              )
              parser.add_argument(
                  "--inspection-sha256",
                  default=None,
                  help="Approved stable inspection SHA for terminalize-expired-orphan only.",
              )
              args = parser.parse_args(list(argv) if argv is not None else None)
          ''',
              "recovery CLI arguments",
          )
          replace_once(
              '''        if args.mode != "report-only" and (
                      args.campaign_id is not None or args.run_id is not None
                  ):
                      raise OperationalMemoryFactoryError(
                          "campaign-id/run-id are only valid for report-only"
                      )
          ''',
              '''        exact_identity_modes = {
                      "report-only",
                      INSPECT_EXPIRED_ORPHAN_MODE,
                      TERMINALIZE_EXPIRED_ORPHAN_MODE,
                  }
                  if args.mode not in exact_identity_modes and (
                      args.campaign_id is not None or args.run_id is not None
                  ):
                      raise OperationalMemoryFactoryError(
                          "campaign-id/run-id are only valid for exact report/recovery modes"
                      )
                  if args.mode in {
                      INSPECT_EXPIRED_ORPHAN_MODE,
                      TERMINALIZE_EXPIRED_ORPHAN_MODE,
                  } and (not args.campaign_id or not args.run_id):
                      raise OperationalMemoryFactoryError(
                          "expired-orphan recovery requires exact campaign-id and run-id"
                      )
                  if (
                      args.mode != TERMINALIZE_EXPIRED_ORPHAN_MODE
                      and args.inspection_sha256 is not None
                  ):
                      raise OperationalMemoryFactoryError(
                          "inspection-sha256 is only valid for terminalize-expired-orphan"
                      )
                  if args.mode == TERMINALIZE_EXPIRED_ORPHAN_MODE:
                      if not args.inspection_sha256:
                          raise OperationalMemoryFactoryError(
                              "terminalize-expired-orphan requires inspection-sha256"
                          )
                      if not args.operator_approved:
                          raise OperationalMemoryFactoryError(
                              "terminalize-expired-orphan requires explicit operator approval"
                          )
          ''',
              "exact recovery identity validation",
          )
          replace_once(
              '''        elif args.mode == "cooperative-stop":
                      result = cooperative_stop(operator_approved=args.operator_approved)
                  elif args.mode == "recover-orphan":
                      result = recover_orphan(operator_approved=args.operator_approved)
                  else:
          ''',
              '''        elif args.mode == "cooperative-stop":
                      result = cooperative_stop(operator_approved=args.operator_approved)
                  elif args.mode == INSPECT_EXPIRED_ORPHAN_MODE:
                      result = inspect_expired_orphan(
                          AUTHORITATIVE_DB,
                          campaign_id=args.campaign_id,
                          run_id=args.run_id,
                          artifact_root=ARTIFACT_ROOT,
                          expected_db_path=AUTHORITATIVE_DB,
                      )
                  elif args.mode == TERMINALIZE_EXPIRED_ORPHAN_MODE:
                      result = terminalize_expired_orphan(
                          AUTHORITATIVE_DB,
                          campaign_id=args.campaign_id,
                          run_id=args.run_id,
                          artifact_root=ARTIFACT_ROOT,
                          expected_db_path=AUTHORITATIVE_DB,
                          inspection_sha256=args.inspection_sha256,
                          operator_approved=args.operator_approved,
                      )
                  elif args.mode == "recover-orphan":
                      result = recover_orphan(operator_approved=args.operator_approved)
                  else:
          ''',
              "recovery dispatch",
          )
          replace_once(
              '''            "four-token-admission-checkpoint-run, status, cooperative-stop, "
                      "recover-orphan, "
          ''',
              '''            "four-token-admission-checkpoint-run, inspect-expired-orphan, "
                      "terminalize-expired-orphan, status, cooperative-stop, recover-orphan, "
          ''',
              "CLI description",
          )
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          git diff --check -- src/printer_v1/operator_cli/operational_memory_factory_command.py
          if git diff --quiet -- src/printer_v1/operator_cli/operational_memory_factory_command.py; then
            echo "No CLI patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/printer_v1/operator_cli/operational_memory_factory_command.py
          git commit -m "feat: wire expired orphan recovery CLI"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Run expired orphan recovery contract
        run: |
          python -m pytest -q \
            tests/test_v2_9_8b_expired_orphan_reconciliation.py \
            tests/test_v2_9_8b_expired_orphan_admitted_recovery.py \
            tests/test_v2_9_8b_expired_orphan_recovery_cli.py
      - name: Run focused post-holder and reconciliation tests
        run: |
          python -m pytest -q             tests/test_v2_9_8b_post_holder_refresh_canonical_resume_integration.py             tests/test_v2_9_8b_post_holder_refresh_request_coverage_repair.py             tests/test_v2_9_8b_post_holder_refresh_write_release_repair.py             tests/test_v2_9_8b_refresh_coverage_carry.py             tests/test_v2_9_8b_failed_refresh_evidence_and_stage_identity.py \
            tests/test_v2_9_8b_window_15m_checkpoint8_holder_request_scope.py
      - name: Run exact four clean 4h memory proof
        run: |
          python -m pytest -q \
            tests/test_v2_9_8b_four_token_clean_4h_memory_proof.py::test_two_cycle_four_token_real_factory_forms_exactly_four_clean_4h_memories
      - name: Run shared-boundary regression suite
        run: |
          # Two legacy E.44 assertions are deselected because both were proven
          # to fail on the pre-repair HEAD under superseded pre-V2-9.8B contracts.
          python -m pytest -q \
            tests/test_v2_9_7e_44_full_pilot_supply_integration.py \
            tests/test_v2_9_8b_retained_evidence_role_completeness_before_freeze_repair.py \
            tests/test_v2_9_8b_cycle2_pump_live_tail_refresh_reentry_repair.py \
            tests/test_v2_9_8b_standard4h_budget_and_cycle2_refresh_reentry_joint_seam.py \
            tests/test_v2_9_8b_later_cycle_mint_market_replay_repair.py \
            tests/test_v2_9_8b_cycle_disjointness_repair.py \
            tests/test_v2_9_8b_pre_admission_atomic_cycle2_consumption.py \
            tests/test_v2_9_8b_pre_admission_frozen_pair_materialization.py \
            tests/test_v2_9_8b_permanent_discovery_availability.py \
            tests/test_v2_9_8b_generic_present_pool_conversion.py \
            tests/test_v2_9_8b_freeze_ready_candidate_supply_reliability.py \
            tests/test_v2_9_8b_pre_admission_discovery_attempt_persistence.py \
            tests/test_v2_9_8b_window_15m_child_terminal_propagation.py \
            tests/test_v2_9_8b_pair_ready_parent_terminal_cancellation_repair.py \
            tests/test_v2_9_8b_standard4h_pre4h_request_ceiling_wiring.py \
            tests/test_v2_9_8b_standard4h_token_local_subset_budget.py \
            tests/test_v2_9_8b_four_token_standard_four_hour_bounded_offline_proof.py \
            tests/test_v2_9_8b_full_four_token_standard4h_audit.py \
            tests/test_v2_9_8b_four_token_factory_adapter.py \
            tests/test_v2_9_8b_four_token_factory_wake_ordering.py \
            tests/test_v2_9_8b_later_cycle_fresh_acquisition_implementation.py \
            tests/test_v2_9_8b_four_token_standard_four_hour_operational_command.py \
            tests/test_v2_9_8b_four_token_standard_four_hour_one_shot_wrapper.py \
            tests/test_v2_9_8b_four_token_admission_checkpoint.py \
            tests/test_v2_9_8b_window_15m_checkpoint8_public_composition_boundary.py \
            tests/test_v2_9_8b_window_15m_checkpoint8_owner_invocation_wiring.py \
            tests/test_v2_9_8b_discovery_selection_full_system_consolidation.py \
            tests/test_v2_9_7e_8_origin_to_lifecycle_integration.py \
            tests/test_v2_9_7d_7b_4d_1_atomic_two_slot_handoff.py \
            tests/test_v2_9_7d_7b_4d_combined_discovery_executor.py \
            tests/test_v2_9_8b_operational_selective_1h.py \
            tests/test_v2_9_8b_first_hour_safety_provenance_repair.py \
            tests/test_post_dtw100_first_hour_lifecycle_policy.py \
            --deselect tests/test_v2_9_7e_44_full_pilot_supply_integration.py::WiringTests::test_closed_supply_stage_flows_to_top_accounting_owner \
            --deselect tests/test_v2_9_7e_44_full_pilot_supply_integration.py::WiringTests::test_e46_holder_reserve_writes_readiness_before_lifecycle
      - name: Compile affected modules
        run: |
          python -m py_compile \
            src/printer_v1/discovery/combined_executor.py \
            src/printer_v1/discovery/eligible_token_supply.py \
            src/printer_v1/sources/generic_present_pool_account_batch.py \
            src/printer_v1/operator_cli/authoritative_live_operational_campaign.py \
            src/printer_v1/operator_cli/origin_lifecycle_campaign.py \
            src/printer_v1/operator_cli/operational_memory_factory_command.py \
            src/printer_v1/operator_cli/operational_selective_1h.py \
            src/printer_v1/operator_cli/operational_standard_4h.py \
            src/printer_v1/operator_cli/standard_4h_progression.py \
            src/printer_v1/operator_cli/one_token_4h_runtime.py \
            src/printer_v1/operator_cli/four_token_proof_integration.py \
            src/printer_v1/operator_cli/four_token_factory_adapter.py \
            src/printer_v1/operator_cli/four_token_admission_checkpoint.py \
            src/printer_v1/operator_cli/four_token_admission_checkpoint_one_shot_wrapper.py \
            src/printer_v1/operator_cli/four_token_admission_checkpoint_authorization_preparation.py \
            src/printer_v1/operator_cli/campaign_full_run_accounting.py \
            src/printer_v1/operator_cli/unified_terminal_closure.py \
            src/printer_v1/operator_cli/expired_orphan_reconciliation.py
      - name: Diff whitespace check
        run: git diff --check dae64903a2c2b8cd9a09c81cf6267fb53324e729..HEAD
