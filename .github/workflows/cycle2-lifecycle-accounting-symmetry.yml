name: Cycle2 lifecycle accounting symmetry

on:
  push:
    branches:
      - agent/tmp-cycle2-lifecycle-accounting-symmetry

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - name: Compile affected owners
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            src/printer_v1/operator_cli/tracking_lifecycle_reconciliation.py
      - name: Run focused lifecycle accounting regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          timeout 210s python -m pytest -q \
            tests/test_v2_9_8b_multicycle_terminal_lifecycle_accounting.py \
            tests/test_v2_9_7b_3_tracking_lifecycle_reconciliation.py \
            tests/test_v2_9_8b_multicycle_shared_terminal_tracking_cleanup.py \
            tests/test_v2_9_8b_four_token_standard_four_hour_bounded_offline_proof.py
