name: V2-9.8B post-DTW100 checkpoint 5 memory TDD

on:
  pull_request:

permissions:
  contents: write

env:
  PYTHONPATH: src

jobs:
  patch:
    if: contains(github.event.pull_request.title, 'APPLY checkpoint5 memory')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply reviewed Checkpoint 5 patch
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "${BASE_REF}"
          git show FETCH_HEAD:scripts/checkpoint5_memory_construction_patch.py > /tmp/checkpoint5_patch.py
          python -m py_compile /tmp/checkpoint5_patch.py
          python /tmp/checkpoint5_patch.py
          python -m py_compile \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            src/printer_v1/operator_cli/lane_q_15m_window_integrity_guard.py \
            src/printer_v1/operator_cli/lane_k_e2z_pipeline_wiring.py \
            src/printer_v1/operator_cli/e2z_clean_memory_creation.py \
            src/printer_v1/memory/outcomes.py \
            src/printer_v1/memory/clean_object_promotion.py \
            src/printer_v1/memory/fingerprints.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then exit 0; fi
          git add \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            src/printer_v1/operator_cli/lane_q_15m_window_integrity_guard.py \
            src/printer_v1/operator_cli/lane_k_e2z_pipeline_wiring.py \
            src/printer_v1/operator_cli/e2z_clean_memory_creation.py
          git commit -m 'Align genuine first-hour memory construction'
          git push origin HEAD:${TARGET_BRANCH}

  focused:
    if: ${{ !contains(github.event.pull_request.title, 'APPLY checkpoint5 memory') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checkpoint owners
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            src/printer_v1/operator_cli/lane_q_15m_window_integrity_guard.py \
            src/printer_v1/operator_cli/lane_k_e2z_pipeline_wiring.py \
            src/printer_v1/operator_cli/e2z_clean_memory_creation.py \
            src/printer_v1/memory/outcomes.py \
            src/printer_v1/memory/clean_object_promotion.py \
            src/printer_v1/memory/fingerprints.py \
            tests/test_v2_9_8b_post_dtw100_checkpoint5_1h_memory_construction.py
      - name: Focused checkpoint 5 memory proof
        run: |
          python -m unittest -v \
            tests.test_v2_9_8b_post_dtw100_checkpoint5_1h_memory_construction \
            tests.test_v2_9_8b_post_dtw100_checkpoint4_1h_close_boundary \
            tests.test_v2_9_8b_post_dtw100_checkpoint3_remaining_45m_collection \
            tests.test_v2_9_8b_post_dtw100_checkpoint2_continuation_initialization \
            tests.test_v2_9_8b_post_dtw100_checkpoint1_15m_1h_handoff \
            tests.test_v2_9_8b_standard_first_hour_harness_reporting_alignment \
            tests.test_v2_9_8b_operational_selective_1h \
            tests.test_v2_9_8b_campaign_scheduler_ownership_schema_migration \
            tests.test_v2_6_1_snapshot_cadence_continuity
