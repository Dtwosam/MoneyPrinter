name: V2-9.8B Multi-Cycle Projection Repair Proof

on:
  pull_request:
    branches:
      - agent/v2-9-8b-four-token-4-2-2-freeze-input-versus-two-slot-truncation-repair-implementation
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Apply guarded implementation when absent
        run: |
          if ! grep -q 'def prepare_full_run_accounting_owner' src/printer_v1/operator_cli/campaign_full_run_accounting.py; then
            python tools/apply_v2_9_8b_multicycle_projection_finalization_repair.py
          fi
      - name: Compile touched production modules
        run: |
          python -m py_compile src/printer_v1/operator_cli/campaign_full_run_accounting.py
          python -m py_compile src/printer_v1/operator_cli/operational_memory_factory_command.py
      - name: Focused repair proof
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_v2_9_8b_multicycle_campaign_projection_finalization_repair.py
      - name: Diff check
        run: git diff --check
      - name: Commit direct production implementation
        run: |
          if ! git diff --quiet -- src/printer_v1/operator_cli/campaign_full_run_accounting.py src/printer_v1/operator_cli/operational_memory_factory_command.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/printer_v1/operator_cli/campaign_full_run_accounting.py src/printer_v1/operator_cli/operational_memory_factory_command.py
            git commit -m 'Repair multi-cycle campaign projection finalization'
            git push origin HEAD:${{ github.head_ref }}
          fi
