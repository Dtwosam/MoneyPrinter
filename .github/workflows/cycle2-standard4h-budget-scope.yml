name: Cycle2 standard4h budget scope

on:
  push:
    branches:
      - agent/tmp-cycle2-standard4h-budget-scope

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - name: Compile affected owners
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            src/printer_v1/operator_cli/one_token_4h_runtime.py
      - name: Run exact changed invariants
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          timeout 90s python -m pytest -q \
            tests/test_v2_9_8b_multicycle_standard4h_budget_scope.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning.py::StandardFourHourCampaignPlanningTests::test_peer_cycle_long_step_does_not_block_exact_cycle_plan \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning.py::StandardFourHourCampaignPlanningTests::test_mixed_fast_normal_plans_exact_two_token_long_work_and_ownership \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning.py::StandardFourHourCampaignPlanningTests::test_projection_failure_rolls_back_windows_slots_steps_jobs_and_ownership \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning.py::StandardFourHourCampaignPlanningTests::test_exact_repeat_is_idempotent_across_full_plan
