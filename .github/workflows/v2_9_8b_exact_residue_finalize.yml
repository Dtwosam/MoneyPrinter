name: V2-9.8B exact residue implementation finalize
on:
  push:
    branches:
      - review/v2-9-8b-interrupted-four-token-exact-residue-ci
permissions:
  contents: write
jobs:
  prove-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          set -euo pipefail
          python -m pip install pytest
          python -m pip install -e .
      - name: Apply final proof-only fixture correction
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/src" python .github/scripts/v2_9_8b_exact_residue_finalize.py
      - name: Run bounded disposable proof
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/src" python -m pytest -q \
            tests/test_v2_9_8b_interrupted_four_token_704f53472011_residue_reconciliation.py \
            tests/test_v2_9_8b_interrupted_cycle2_parent_interrupt_cleanup.py \
            tests/test_v2_9_8b_interrupted_four_token_followup_repair.py \
            tests/test_v2_9_8b_pre_admission_terminal_cleanup_repair.py \
            tests/test_v2_9_8b_shared_terminal_pre_lifecycle_zero_attempt.py \
            | tee /tmp/exact-residue-pytest.txt
          PYTHONPATH="$PWD/src" python -m py_compile \
            src/printer_v1/operator_cli/interrupted_four_token_704f53472011_residue_reconciliation.py
          git diff --check
      - name: Write implementation closeout
        run: |
          set -euo pipefail
          cat > docs/printer-v1-v2-9-8b-interrupted-four-token-704f53472011-exact-residue-reconciliation-implementation-closeout.md <<'EOF'
          # Printer V1 V2-9.8B — Exact Interrupted Four-Token Residue Reconciliation Implementation Closeout

          Date: 2026-08-29

          Lane: exact-residue reconciliation implementation + disposable proof only.

          Baseline production repair: `9614bb172d2dc8765f03c67320047e6828f285ef`.

          Governing design: `docs/printer-v1-v2-9-8b-post-consumption-interrupted-four-token-residual-reconciliation-lease-failure-cleanup-design.md`.

          The implementation adds one hard-bound owner for consumed execution `20260828T220832Z-704f53472011`. It binds the exact consumed authorization ID, application-marker SHA, execution/campaign/configuration/run/Cycle-1/supervision/owner identities, factory-run UUID, Cycle-2 attempt ID, Scheduler job 2808, immutable Cycle-1 cause, 19-row migration-062 attempt-evidence shape, delete journal mode, no sidecars, no live Printer/Governor/Scheduler process, exact Git HEAD supplied by the separately approved apply lane, and exact pre-recovery DB SHA `c90376b9e26d0f2953a8d9b2fd5fee01d80ac4984510113e595fd1ccc3d9033d`.

          The recovery does not contain provider, RPC/WebSocket, Source Governor, Scheduler claim/execution, campaign restart/resume/retry, successor, authorization reuse, ad-hoc Scheduler SQL cancellation, or manual lease deletion. Mutation is composed through `finalize_four_token_shared_terminal`, its existing parent-interruption owner, `reconcile_campaign_terminal`, and `cleanup_campaign_supervision`.

          Disposable proof uses only temporary SQLite databases and temporary lease/marker files. It proves exact successful reconciliation, idempotent replay, Cycle-1 byte-for-byte preservation, migration-062 evidence preservation, locked retrieval/financial table preservation, zero active work, attempt cancellation with `PARENT_CAMPAIGN_INTERRUPTED:LEASE_RENEWAL_SQLITE_LOCKED`, job cancellation through ownership, factory SAFE_STOPPED, terminal campaign/run/supervision, lease release, clean integrity/FKs, and fail-closed behavior for missing approval, live-process presence, Scheduler contradiction, Cycle-1 cause drift, sidecar presence, consumed-marker mismatch, live-DB-SHA mismatch, and recovered lease-path identity drift.

          Existing parent-interrupt and shared-terminal focused regressions are included in the same bounded proof.

          This lane did **not** access or mutate `/Users/Dtwo1/Developer/MoneyPrinter/data/printer_v1.sqlite3`, job 2808, the live RUNNING attempt, the live ACTIVE supervision row, or the live lease. The GitHub-hosted runner has no authoritative consumed-run database or PrinterOperations tree.

          Verdict:

          `V2_9_8B_INTERRUPTED_FOUR_TOKEN_704F53472011_EXACT_RESIDUE_RECONCILIATION_IMPLEMENTATION_PASS`

          Next permitted action:

          `INDEPENDENT EXACT-RESIDUE RECONCILIATION IMPLEMENTATION CLOSEOUT / REVIEW`

          Authoritative reconciliation remains **not approved**. After independent review passes, a separate explicit operator approval must precede fresh backup/restore rehearsal and one exact authoritative application.
          EOF
          git diff --check
      - name: Reconstruct exact implementation commit on reviewed baseline
        env:
          TARGET: review/v2-9-8b-interrupted-four-token-exact-residue-implementation
        run: |
          set -euo pipefail
          BASE=9614bb172d2dc8765f03c67320047e6828f285ef
          PATCH=/tmp/exact-residue-product.patch

          git fetch origin "$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$BASE" || {
            echo "STOP: exact-residue implementation branch moved from reviewed baseline"
            exit 1
          }

          # Stage the exact three product-lane deliverables so the new closeout
          # file is included in the saved patch. The CI harness itself is never
          # staged or published to the implementation branch.
          git add \
            docs/printer-v1-v2-9-8b-interrupted-four-token-704f53472011-exact-residue-reconciliation-implementation-closeout.md \
            src/printer_v1/operator_cli/interrupted_four_token_704f53472011_residue_reconciliation.py \
            tests/test_v2_9_8b_interrupted_four_token_704f53472011_residue_reconciliation.py
          git diff --cached --binary "$BASE" -- \
            docs/printer-v1-v2-9-8b-interrupted-four-token-704f53472011-exact-residue-reconciliation-implementation-closeout.md \
            src/printer_v1/operator_cli/interrupted_four_token_704f53472011_residue_reconciliation.py \
            tests/test_v2_9_8b_interrupted_four_token_704f53472011_residue_reconciliation.py \
            > "$PATCH"
          test -s "$PATCH"

          # Reconstruct only the proved product patch on the reviewed parent.
          # This local reset cannot move the remote CI branch; the only push
          # below targets the dedicated implementation branch.
          git reset --hard "$BASE"
          git apply "$PATCH"

          # All three proved deliverables are newly introduced files, so stage
          # them before scope validation. Plain `git diff` intentionally ignores
          # untracked files and was the packaging-only failure in the prior run.
          git add \
            docs/printer-v1-v2-9-8b-interrupted-four-token-704f53472011-exact-residue-reconciliation-implementation-closeout.md \
            src/printer_v1/operator_cli/interrupted_four_token_704f53472011_residue_reconciliation.py \
            tests/test_v2_9_8b_interrupted_four_token_704f53472011_residue_reconciliation.py
          git diff --cached --check

          changed="$(git diff --cached --name-only "$BASE")"
          expected=$'docs/printer-v1-v2-9-8b-interrupted-four-token-704f53472011-exact-residue-reconciliation-implementation-closeout.md\nsrc/printer_v1/operator_cli/interrupted_four_token_704f53472011_residue_reconciliation.py\ntests/test_v2_9_8b_interrupted_four-token-704f53472011-residue-reconciliation.py'
          # Keep the expected scope exact; normalize only the test path spelling
          # used above so this comparison cannot admit extra files.
          expected=$'docs/printer-v1-v2-9-8b-interrupted-four-token-704f53472011-exact-residue-reconciliation-implementation-closeout.md\nsrc/printer_v1/operator_cli/interrupted_four_token_704f53472011_residue_reconciliation.py\ntests/test_v2_9_8b_interrupted_four_token_704f53472011_residue_reconciliation.py'
          test "$changed" = "$expected" || {
            echo "STOP: unexpected implementation commit scope"
            printf '%s\n' "$changed"
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement exact interrupted four-token residue recovery"
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET"
          echo "EXACT_RESIDUE_IMPLEMENTATION_SHA=$NEW_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
