name: Printer V1 standard 4h activation slice A apply

on:
  pull_request:
    branches:
      - agent/v2-9-8b-post-dtw100-standard-four-hour-activation-slice-a-apply-base

permissions:
  contents: write

jobs:
  apply-and-green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout disposable apply base
        uses: actions/checkout@v4
        with:
          ref: agent/v2-9-8b-post-dtw100-standard-four-hour-activation-slice-a-apply-base
          fetch-depth: 0

      - name: Preserve patchers and checkout exact RED head
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/apply_standard_four_hour_activation_slice_a.py /tmp/apply_activation_slice_a.py
          cp scripts/apply_standard_four_hour_activation_slice_a_correction.py /tmp/apply_activation_slice_a_correction.py
          git checkout --detach a49efc683b8e07da52fc7f8f47451ba0d8748190
          test "$(git rev-parse HEAD)" = "a49efc683b8e07da52fc7f8f47451ba0d8748190"

      - name: Apply approved activation slice A patch and authority correction
        run: |
          python /tmp/apply_activation_slice_a.py
          python /tmp/apply_activation_slice_a_correction.py

      - name: Assert exact patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/actual-files.txt
          printf '%s\n' \
            src/printer_v1/operator_cli/operational_memory_factory_command.py \
            src/printer_v1/operator_cli/one_token_4h_runtime.py \
            src/printer_v1/operator_cli/operational_standard_4h.py \
            src/printer_v1/operator_cli/standard_four_hour_one_shot_wrapper.py \
            src/printer_v1/operator_cli/git_provenance_authorization_manifest.py \
            src/printer_v1/operator_cli/window_15m_child_terminal.py \
            src/printer_v1/snapshots/cadence_policy.py \
            src/printer_v1/snapshots/lifecycle_continuity.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_policy_capacity.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_eligible_subset.py \
            | sort > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Install project
        run: python -m pip install -e .

      - name: Compile directly affected activation modules
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/operational_memory_factory_command.py \
            src/printer_v1/operator_cli/one_token_4h_runtime.py \
            src/printer_v1/operator_cli/operational_standard_4h.py \
            src/printer_v1/operator_cli/standard_four_hour_one_shot_wrapper.py \
            src/printer_v1/operator_cli/git_provenance_authorization_manifest.py \
            src/printer_v1/operator_cli/window_15m_child_terminal.py \
            src/printer_v1/snapshots/cadence_policy.py \
            src/printer_v1/snapshots/lifecycle_continuity.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_operational_activation.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning.py

      - name: Run activation GREEN contract
        run: |
          python -m unittest -v \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_operational_activation

      - name: Run self-contained directly affected regressions
        run: |
          python -m unittest -v \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_eligible_subset \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_campaign_handoff \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_policy_capacity \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_collection_state_accounting \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_close_memory_terminal_reconciliation \
            tests.test_v2_9_8b_window_15m_one_shot_wrapper.ChildInterpreterSelectorUnitTests \
            tests.test_v2_9_8b_window_15m_one_shot_wrapper.LauncherShapeTests \
            tests.test_v2_9_7d_4a_token_local_selective_continuation

      - name: Assert partial-slice safety boundary
        run: |
          python - <<'PY'
          from printer_v1.operator_cli import operational_memory_factory_command as command
          from printer_v1.operator_cli.one_token_4h_runtime import FourHourExecutionAuthority
          from printer_v1.snapshots.cadence_policy import get_policy

          assert command.STANDARD_FOUR_HOUR_MODE == "standard-four-hour-run"
          assert command.STANDARD_FOUR_HOUR_POLICY.locked_windows == ("WINDOW_12H", "WINDOW_24H")
          for lane in ("TRACK_FAST", "TRACK_NORMAL"):
              assert get_policy("WINDOW_4H", lane).enabled_for_real_collection is True
              assert get_policy("WINDOW_12H", lane).enabled_for_real_collection is False
              assert get_policy("WINDOW_24H", lane).enabled_for_real_collection is False
          assert FourHourExecutionAuthority.DISABLED.value == "DISABLED"
          assert FourHourExecutionAuthority.PROOF.value == "PROOF"
          assert FourHourExecutionAuthority.STANDARD_CAMPAIGN.value == "STANDARD_CAMPAIGN"
          PY
          git diff --check

      - name: Create disposable slice A candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Printer V1 TDD Runner"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/printer_v1/operator_cli/operational_memory_factory_command.py \
            src/printer_v1/operator_cli/one_token_4h_runtime.py \
            src/printer_v1/operator_cli/operational_standard_4h.py \
            src/printer_v1/operator_cli/standard_four_hour_one_shot_wrapper.py \
            src/printer_v1/operator_cli/git_provenance_authorization_manifest.py \
            src/printer_v1/operator_cli/window_15m_child_terminal.py \
            src/printer_v1/snapshots/cadence_policy.py \
            src/printer_v1/snapshots/lifecycle_continuity.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_policy_capacity.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_eligible_subset.py
          git commit -m "Implement standard four-hour activation authority foundation"
          git push --force origin HEAD:refs/heads/agent/v2-9-8b-post-dtw100-standard-four-hour-activation-slice-a-candidate
