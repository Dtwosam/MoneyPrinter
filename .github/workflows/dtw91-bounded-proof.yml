name: DTW-91 Migration 053 Bounded Proof

on:
  pull_request:
    branches:
      - agent/v2-9-8b-dtw91-bounded-proof-runner-base

permissions:
  contents: read

jobs:
  bounded-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Migration 053 preservation and persistence proof
        run: python -m unittest tests/test_dtw90_pilot_input_readiness_route_migration.py
      - name: DTW-86 focused readiness regression
        run: python -m unittest tests/test_v2_9_7e_45_pilot_input_readiness.py
      - name: Materialize exact archived DTW-87 proof
        run: |
          git fetch --no-tags --depth=1 origin 3fecea57c6dd1b22f68e49a66f96e684d0829fcd
          git show 3fecea57c6dd1b22f68e49a66f96e684d0829fcd:tests/test_dtw87_activation_route_bounded_proof.py > tests/test_dtw87_activation_route_bounded_proof.py
      - name: Exact DTW-87 migrated-schema bounded proof
        run: python -m unittest tests/test_dtw87_activation_route_bounded_proof.py
