name: Multicycle standard-4h terminal validation proof

on:
  push:
    branches:
      - agent/tmp-multicycle-standard4h-terminal-validation-proof

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - name: Compile affected owners
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/one_command_15m_factory.py \
            src/printer_v1/operator_cli/standard_4h_progression.py
      - name: Run focused multicycle and standard-4h regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          timeout 240s python -m pytest -q \
            tests/test_v2_9_8b_multicycle_standard4h_terminal_validation.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_campaign_planning.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_campaign_handoff.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_activation_factory_barrier.py \
            tests/test_v2_9_8b_four_token_standard_four_hour_bounded_offline_proof.py
