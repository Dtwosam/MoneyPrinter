name: DTW93 local validation observer implementation

on:
  push:
    branches:
      - agent/v2-9-8b-post-dtw93-local-validation-observer-repair-implementation

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact observer repair and focused test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          permanent = Path("src/printer_v1/discovery/permanent_discovery_availability.py")
          text = permanent.read_text(encoding="utf-8")

          old = '''    stage_evidence_sink: Any | None = None,
              transport_identity_observer: Any | None = None,
              stage_sequence: int = 1,
          ) -> dict[str, Any]:
          '''
          new = '''    stage_evidence_sink: Any | None = None,
              transport_identity_observer: Any | None = None,
              local_validation_identity_observer: Any | None = None,
              stage_sequence: int = 1,
          ) -> dict[str, Any]:
          '''
          if text.count(old) != 1:
              raise SystemExit(f"protocol signature replacement count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''                for item in local_validation_identities
              ]
              first_cause = None
          '''
          new = '''                for item in local_validation_identities
              ]
              if local_validation_identity_observer is not None:
                  for validation in bound_validations:
                      local_validation_identity_observer(validation)
              first_cause = None
          '''
          if text.count(old) != 1:
              raise SystemExit(f"pre-seal observer replacement count={text.count(old)}")
          text = text.replace(old, new, 1)
          permanent.write_text(text, encoding="utf-8")

          eligible = Path("src/printer_v1/discovery/eligible_token_supply.py")
          text = eligible.read_text(encoding="utf-8")

          old = '''                    stage_evidence_sink=stage_evidence_sink,
                      transport_identity_observer=transport_identity_observer,
                      stage_sequence=1,
                      request_key_prefix=f"{discovery_request_key_prefix}-protocol",
          '''
          new = '''                    stage_evidence_sink=stage_evidence_sink,
                      transport_identity_observer=transport_identity_observer,
                      local_validation_identity_observer=(
                          local_validation_identity_observer
                      ),
                      stage_sequence=1,
                      request_key_prefix=f"{discovery_request_key_prefix}-protocol",
          '''
          if text.count(old) != 1:
              raise SystemExit(f"early protocol observer replacement count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''                stage_evidence_sink=stage_evidence_sink,
                  transport_identity_observer=transport_identity_observer,
                  stage_sequence=2,
                  request_key_prefix=f"{discovery_request_key_prefix}-protocol-residual",
          '''
          new = '''                stage_evidence_sink=stage_evidence_sink,
                  transport_identity_observer=transport_identity_observer,
                  local_validation_identity_observer=(
                      local_validation_identity_observer
                  ),
                  stage_sequence=2,
                  request_key_prefix=f"{discovery_request_key_prefix}-protocol-residual",
          '''
          if text.count(old) != 1:
              raise SystemExit(f"residual protocol observer replacement count={text.count(old)}")
          text = text.replace(old, new, 1)
          eligible.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_v2_9_8b_post_dtw93_local_validation_observer.py")
          test_path.write_text(r'''import ast
          import inspect
          import sqlite3
          import textwrap
          import unittest
          from types import SimpleNamespace
          from unittest.mock import patch

          from printer_v1.contracts.enums import SourceStatus
          from printer_v1.discovery import eligible_token_supply
          from printer_v1.discovery.permanent_discovery_availability import (
              CONTRACT_BLOCKED,
              REASON_ABOVE_FLOOR_NOMINATION,
              StageBudget,
              process_protocol_confirmation_queue,
          )
          from printer_v1.sources.campaign_six_unit_accounting import (
              CampaignActionLocalLedger,
              CampaignSixUnitOwner,
              reconcile_full_run_owner_to_action_local,
          )
          from printer_v1.sources.measured_transport import UNIT_LOCAL_VALIDATION_STEP


          NOW = "2026-08-09T00:00:00+00:00"
          CAMPAIGN_ID = "dtw93-campaign"
          RUN_ID = "dtw93-run"
          CYCLE_ID = "dtw93-cycle"


          def _connection(outcome_count: int) -> sqlite3.Connection:
              connection = sqlite3.connect(":memory:")
              connection.row_factory = sqlite3.Row
              connection.executescript(
                  """
                  CREATE TABLE printer_exact_market_states (
                      network TEXT NOT NULL,
                      mint_identity TEXT NOT NULL,
                      pool_address TEXT NOT NULL,
                      token_program_id TEXT NOT NULL DEFAULT 'UNRESOLVED_TOKEN_PROGRAM',
                      pool_program_id TEXT NOT NULL DEFAULT 'UNRESOLVED_POOL_PROGRAM',
                      base_mint TEXT NOT NULL,
                      quote_mint TEXT NOT NULL DEFAULT 'UNKNOWN_QUOTE_MINT',
                      venue TEXT NOT NULL DEFAULT 'pumpswap',
                      current_state TEXT NOT NULL,
                      current_reason TEXT NOT NULL,
                      last_observed_at TEXT NOT NULL,
                      last_visible_at TEXT,
                      last_no_match_at TEXT,
                      no_match_count INTEGER NOT NULL DEFAULT 0,
                      no_match_streak INTEGER NOT NULL DEFAULT 0,
                      next_lawful_action_at TEXT,
                      latest_source_provenance_json TEXT NOT NULL DEFAULT '{}',
                      contract_version TEXT NOT NULL DEFAULT 'TEST_PROTOCOL',
                      created_at TEXT NOT NULL,
                      updated_at TEXT NOT NULL,
                      PRIMARY KEY(network, mint_identity, pool_address)
                  );
                  CREATE TABLE printer_exact_market_state_transitions (
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      network TEXT NOT NULL,
                      mint_identity TEXT NOT NULL,
                      pool_address TEXT NOT NULL,
                      prior_state TEXT,
                      new_state TEXT NOT NULL,
                      reason_code TEXT NOT NULL,
                      observed_at TEXT NOT NULL,
                      next_lawful_action_at TEXT,
                      source_provenance_json TEXT NOT NULL,
                      contract_version TEXT NOT NULL,
                      recorded_at TEXT NOT NULL
                  );
                  """
              )
              for index in range(max(1, outcome_count)):
                  mint = f"Mint{index:02d}111111111111111111111111111111111"
                  pool = f"Pool{index:02d}111111111111111111111111111111111"
                  connection.execute(
                      """INSERT INTO printer_exact_market_states(
                          network,mint_identity,pool_address,base_mint,
                          current_state,current_reason,last_observed_at,created_at,updated_at
                      ) VALUES (?,?,?,?,?,?,?,?,?)""",
                      (
                          "solana-mainnet",
                          mint,
                          pool,
                          mint,
                          CONTRACT_BLOCKED,
                          REASON_ABOVE_FLOOR_NOMINATION,
                          NOW,
                          NOW,
                          NOW,
                      ),
                  )
              connection.commit()
              return connection


          def _members(outcomes):
              return [
                  {
                      "mint": f"Mint{index:02d}111111111111111111111111111111111",
                      "pool": f"Pool{index:02d}111111111111111111111111111111111",
                      "batch_index": index,
                      "owner": "ObservedProgram11111111111111111111111111111",
                      "data_length": 256,
                      "confirm_reason": outcome.lower(),
                      "outcome": outcome,
                  }
                  for index, outcome in enumerate(outcomes)
              ]


          def _execution(outcomes, *, failed=False):
              members = [] if failed else _members(outcomes)
              return SimpleNamespace(
                  request_record=SimpleNamespace(id=101),
                  response_record=(None if failed else SimpleNamespace(id=201)),
                  failure_record=(SimpleNamespace(id=301) if failed else None),
                  normalized_result=SimpleNamespace(
                      source_status=(SourceStatus.FAILED if failed else SourceStatus.COMPLETE),
                      failure_type=("TEST_SOURCE_FAILURE" if failed else None),
                      normalized_payload=(
                          {}
                          if failed
                          else {
                              "members": members,
                              "local_validation_steps": len(members),
                          }
                      ),
                  ),
              )


          def _run(outcomes, *, failed=False, observer=None, sink=None):
              connection = _connection(len(outcomes))
              budget = StageBudget.permanent_discovery_default()
              fake_execution = _execution(outcomes, failed=failed)
              with (
                  patch(
                      "printer_v1.sources.contracts.build_governed_source_request",
                      return_value=object(),
                  ),
                  patch(
                      "printer_v1.sources.pumpswap_pool_account_batch."
                      "build_pumpswap_pool_account_batch_adapter",
                      return_value=object(),
                  ),
                  patch(
                      "printer_v1.sources.governed_execution."
                      "execute_source_request_with_governor",
                      return_value=fake_execution,
                  ),
              ):
                  report = process_protocol_confirmation_queue(
                      connection,
                      stage_budget=budget,
                      now=NOW,
                      campaign_id=CAMPAIGN_ID,
                      run_id=RUN_ID,
                      cycle_id=CYCLE_ID,
                      account_batch_transport=object(),
                      stage_evidence_sink=sink,
                      transport_identity_observer=None,
                      local_validation_identity_observer=observer,
                      stage_sequence=1,
                      request_key_prefix="dtw93-protocol",
                  )
              return report, connection


          class PostDTW93LocalValidationObserverTests(unittest.TestCase):
              def test_owner_and_action_local_identities_match_exactly(self):
                  outcomes = [
                      "ACCOUNT_NOT_FOUND",
                      "BASE_MINT_MISMATCH",
                      "POOL_OWNER_MISMATCH",
                  ]
                  owner = CampaignSixUnitOwner(
                      campaign_id=CAMPAIGN_ID,
                      run_id=RUN_ID,
                      cycle_id=CYCLE_ID,
                      started_at=NOW,
                  )
                  action = CampaignActionLocalLedger(
                      campaign_id=CAMPAIGN_ID,
                      run_id=RUN_ID,
                      cycle_id=CYCLE_ID,
                  )
                  events = []

                  def observer(identity):
                      events.append(("observer", identity.as_dict()))
                      action.observe_local_validation(identity)

                  def sink(evidence):
                      events.append(("sink", evidence["stage_id"]))
                      owner.ingest_stage_evidence(evidence)

                  report, connection = _run(
                      outcomes, observer=observer, sink=sink
                  )
                  self.addCleanup(connection.close)

                  self.assertEqual(report["source_requests"], 1)
                  self.assertEqual(report["transport_operations"], 0)
                  self.assertEqual(report["local_validation_steps"], len(outcomes))
                  self.assertEqual(len(action.local_validation_identities), len(outcomes))
                  self.assertEqual(len(owner.local_validation_identities), len(outcomes))
                  self.assertEqual(
                      owner.local_validation_identities,
                      action.local_validation_identities,
                  )
                  self.assertEqual(
                      [kind for kind, _ in events],
                      ["observer"] * len(outcomes) + ["sink"],
                  )

                  before = list(action.local_validation_identities)
                  owner.durable_evidence()
                  reconciliation = reconcile_full_run_owner_to_action_local(
                      owner,
                      action,
                      required_stage_kinds=("PROTOCOL_CONFIRMATION",),
                  )
                  self.assertTrue(reconciliation["equal"], reconciliation)
                  local = reconciliation["unit_results"][UNIT_LOCAL_VALIDATION_STEP]
                  self.assertEqual(local["owner_count"], len(outcomes))
                  self.assertEqual(local["action_local_count"], len(outcomes))
                  self.assertTrue(local["identity_sets_equal"])
                  self.assertEqual(action.local_validation_identities, before)

              def test_mixed_outcomes_preserve_exact_kind_subject_and_ordinal(self):
                  outcomes = [
                      "ACCOUNT_NOT_FOUND",
                      "BASE_MINT_MISMATCH",
                      "POOL_DATA_UNDECODABLE",
                  ]
                  observed = []
                  sealed = []
                  report, connection = _run(
                      outcomes,
                      observer=observed.append,
                      sink=sealed.append,
                  )
                  self.addCleanup(connection.close)
                  stage_id = (
                      f"{CAMPAIGN_ID}|{RUN_ID}|{CYCLE_ID}|PROTOCOL_CONFIRMATION|1"
                  )
                  expected = [
                      {
                          "stage_id": stage_id,
                          "subject_identity": (
                              f"Mint{index:02d}111111111111111111111111111111111:"
                              f"Pool{index:02d}111111111111111111111111111111111"
                          ),
                          "validation_kind": f"PUMPSWAP_ACCOUNT_{outcome}",
                          "validation_ordinal": index + 1,
                          "unit": UNIT_LOCAL_VALIDATION_STEP,
                      }
                      for index, outcome in enumerate(outcomes)
                  ]
                  self.assertEqual([item.as_dict() for item in observed], expected)
                  self.assertEqual(sealed[0]["local_validation_identities"], expected)
                  self.assertEqual(report["local_validation_steps"], len(expected))

              def test_source_failure_before_members_creates_no_validation_callback(self):
                  observed = []
                  sealed = []
                  report, connection = _run(
                      ["ACCOUNT_NOT_FOUND"],
                      failed=True,
                      observer=observed.append,
                      sink=sealed.append,
                  )
                  self.addCleanup(connection.close)
                  self.assertEqual(report["source_requests"], 1)
                  self.assertEqual(report["local_validation_steps"], 0)
                  self.assertEqual(observed, [])
                  self.assertEqual(sealed, [])

              def test_eligible_supply_early_and_residual_calls_propagate_observer(self):
                  source = textwrap.dedent(
                      inspect.getsource(
                          eligible_token_supply.run_persistent_eligible_token_supply
                      )
                  )
                  tree = ast.parse(source)
                  calls = []
                  for node in ast.walk(tree):
                      if not isinstance(node, ast.Call):
                          continue
                      if not isinstance(node.func, ast.Name):
                          continue
                      if node.func.id not in {
                          "_early_protocol",
                          "process_protocol_confirmation_queue",
                      }:
                          continue
                      calls.append(node)
                  self.assertEqual(len(calls), 2)
                  for call in calls:
                      keywords = {item.arg: item.value for item in call.keywords}
                      self.assertIn("local_validation_identity_observer", keywords)
                      value = keywords["local_validation_identity_observer"]
                      self.assertIsInstance(value, ast.Name)
                      self.assertEqual(value.id, "local_validation_identity_observer")

              def test_observer_does_not_change_source_or_transport_totals(self):
                  outcomes = ["ACCOUNT_NOT_FOUND", "POOL_OWNER_MISMATCH"]
                  baseline_sealed = []
                  baseline, baseline_connection = _run(
                      outcomes, sink=baseline_sealed.append
                  )
                  self.addCleanup(baseline_connection.close)
                  observed = []
                  observed_sealed = []
                  repaired, repaired_connection = _run(
                      outcomes,
                      observer=observed.append,
                      sink=observed_sealed.append,
                  )
                  self.addCleanup(repaired_connection.close)
                  for field in (
                      "source_requests",
                      "transport_operations",
                      "batch_count",
                      "source_request_ids",
                      "source_response_ids",
                      "source_failure_ids",
                  ):
                      self.assertEqual(repaired[field], baseline[field], field)
                  self.assertEqual(len(observed), len(outcomes))


          if __name__ == "__main__":
              unittest.main()
          ''').replace("\n          ", "\n").lstrip(), encoding="utf-8")
          PY

      - name: Focused offline verification
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q \
            src/printer_v1/discovery/permanent_discovery_availability.py \
            src/printer_v1/discovery/eligible_token_supply.py \
            tests/test_v2_9_8b_post_dtw93_local_validation_observer.py
          python -m unittest \
            tests.test_v2_9_8b_post_dtw93_local_validation_observer -v

      - name: Commit exact implementation and remove helper workflow
        shell: bash
        run: |
          git config user.name "DTW93 Observer Repair"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/dtw93-local-validation-observer-implementation.yml
          git add \
            src/printer_v1/discovery/permanent_discovery_availability.py \
            src/printer_v1/discovery/eligible_token_supply.py \
            tests/test_v2_9_8b_post_dtw93_local_validation_observer.py
          git diff --cached --check
          git commit -m "Repair protocol local validation observer wiring"
          git push origin HEAD:agent/v2-9-8b-post-dtw93-local-validation-observer-repair-implementation
