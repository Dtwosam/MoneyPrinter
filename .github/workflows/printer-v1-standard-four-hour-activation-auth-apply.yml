name: Printer V1 standard 4h activation authorization Slice B GREEN

on:
  pull_request:
    branches:
      - agent/v2-9-8b-post-dtw100-standard-four-hour-activation-auth-apply-base

permissions:
  contents: write

jobs:
  apply-and-green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout disposable apply base
        uses: actions/checkout@v4
        with:
          ref: agent/v2-9-8b-post-dtw100-standard-four-hour-activation-auth-apply-base
          fetch-depth: 0

      - name: Preserve patchers and checkout exact RED head
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/apply_standard_four_hour_activation_authorization_slice_b.py /tmp/apply_slice_b.py
          cp scripts/apply_standard_four_hour_activation_authorization_slice_b_command_binding.py /tmp/apply_slice_b_command_binding.py
          cp scripts/normalize_standard_four_hour_activation_authorization_patcher.py /tmp/normalize_slice_b_patcher.py
          git checkout --detach b19b122dc13cbf4bbc802bca3a0223dce7256f32
          test "$(git rev-parse HEAD)" = "b19b122dc13cbf4bbc802bca3a0223dce7256f32"
          test -z "$(git status --porcelain)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply approved Slice B patch and fixture correction
        run: |
          python /tmp/normalize_slice_b_patcher.py /tmp/apply_slice_b.py
          python /tmp/apply_slice_b.py
          python /tmp/apply_slice_b_command_binding.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_v2_9_8b_post_dtw100_standard_four_hour_activation_authorization.py')
          text = path.read_text(encoding='utf-8')
          old = '(self.repo / ".gitignore").write_text("*.sqlite3\\n", encoding="utf-8")'
          new = '(self.repo / ".gitignore").write_text("*.sqlite3\\n.venv/\\n", encoding="utf-8")'
          if old not in text:
              raise RuntimeError('standard 4h fixture gitignore anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Assert exact scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/actual-files.txt
          printf '%s\n' \
            src/printer_v1/operator_cli/git_provenance_authorization_manifest.py \
            src/printer_v1/operator_cli/operational_memory_factory_command.py \
            src/printer_v1/operator_cli/standard_four_hour_one_shot_wrapper.py \
            src/printer_v1/operator_cli/window_15m_child_terminal.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_activation_authorization.py \
            | sort > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Install project
        run: python -m pip install -e .

      - name: Compile directly affected modules
        run: |
          python -m py_compile \
            src/printer_v1/operator_cli/git_provenance_authorization_manifest.py \
            src/printer_v1/operator_cli/operational_memory_factory_command.py \
            src/printer_v1/operator_cli/standard_four_hour_one_shot_wrapper.py \
            src/printer_v1/operator_cli/window_15m_child_terminal.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_activation_authorization.py \
            tests/test_v2_9_8b_post_dtw100_standard_four_hour_operational_activation.py

      - name: Run Slice B authorization and one-use wrapper GREEN contract
        run: |
          python -m unittest -v \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_activation_authorization

      - name: Run activation-foundation and ordinary wrapper regressions
        run: |
          python -m unittest -v \
            tests.test_v2_9_8b_post_dtw100_standard_four_hour_operational_activation \
            tests.test_v2_9_8b_window_15m_one_shot_wrapper.ChildInterpreterSelectorUnitTests \
            tests.test_v2_9_8b_window_15m_one_shot_wrapper.LauncherShapeTests

      - name: Assert cross-mode and capability locks
        run: |
          python - <<'PY'
          from printer_v1.operator_cli import git_provenance_authorization_manifest as auth
          from printer_v1.operator_cli import operational_memory_factory_command as command
          from printer_v1.operator_cli import standard_four_hour_one_shot_wrapper as wrapper
          from printer_v1.operator_cli import window_15m_child_terminal as terminal
          from printer_v1.snapshots.cadence_policy import get_policy

          assert auth.ORDINARY_AUTHORIZATION_PROFILE.command_mode == "run"
          assert auth.STANDARD_FOUR_HOUR_AUTHORIZATION_PROFILE.command_mode == "standard-four-hour-run"
          assert command.STANDARD_FOUR_HOUR_MODE in command.GIT_PROVENANCE_MANIFEST_SUPPORTED_MODES
          assert wrapper.build_child_command('/x/python')[-2:] == ['standard-four-hour-run', '--operator-approved']
          assert terminal.CHILD_TERMINAL_MODE_SCHEMAS['run'] != terminal.CHILD_TERMINAL_MODE_SCHEMAS['standard-four-hour-run']
          for lane in ('TRACK_FAST','TRACK_NORMAL'):
              assert get_policy('WINDOW_12H', lane).enabled_for_real_collection is False
              assert get_policy('WINDOW_24H', lane).enabled_for_real_collection is False
          PY
          git diff --check

      - name: Create two-commit Slice B candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Printer V1 TDD Runner"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_v2_9_8b_post_dtw100_standard_four_hour_activation_authorization.py
          git commit -m "Fix standard four-hour wrapper fixture venv visibility"
          git add \
            src/printer_v1/operator_cli/git_provenance_authorization_manifest.py \
            src/printer_v1/operator_cli/operational_memory_factory_command.py \
            src/printer_v1/operator_cli/standard_four_hour_one_shot_wrapper.py \
            src/printer_v1/operator_cli/window_15m_child_terminal.py
          git commit -m "Implement standard four-hour one-shot authorization boundary"
          git push --force origin HEAD:refs/heads/agent/v2-9-8b-post-dtw100-standard-four-hour-activation-auth-candidate
