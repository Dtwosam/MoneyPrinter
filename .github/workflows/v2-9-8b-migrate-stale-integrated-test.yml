name: V2-9.8B migrate stale integrated test

on:
  push:
    branches:
      - agent/v2-9-8b-persistent-multisource-fresh-acquisition-implementation

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message || '', '[stale-test-migration]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Migrate stale integrated fingerprint test to atomic owner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_v2_9_8b_window_15m_final_integrated_readiness_repair.py')
          text = path.read_text()

          old_import = '''from printer_v1.operator_cli.lane_k_e2z_pipeline_wiring import (\n    _attach_fingerprint_for_episode,\n)'''
          new_import = 'from printer_v1.memory.clean_object_promotion import promote_clean_object'
          if old_import not in text:
              raise SystemExit('stale Lane K helper import not found')
          text = text.replace(old_import, new_import, 1)

          insert_after = '''from printer_v1.sources.geckoterminal import (\n    GECKOTERMINAL_SOURCE_NAME,\n    build_geckoterminal_adapter,\n    build_geckoterminal_token_pools_transport,\n)\n'''
          helper = '''\n\ndef _promote_fingerprint(db_path: Path, *, window_id: int) -> int:\n    conn = sqlite3.connect(db_path)\n    try:\n        return int(promote_clean_object(conn, window_id=window_id).fingerprint_id)\n    finally:\n        conn.close()\n'''
          if insert_after not in text:
              raise SystemExit('import insertion anchor not found')
          text = text.replace(insert_after, insert_after + helper, 1)

          episode_start_marker = '''            conn.execute(\n                \"\"\"INSERT INTO printer_episodes ('''
          episode_start = text.find(episode_start_marker)
          if episode_start < 0:
              raise SystemExit('obsolete pre-created episode fixture not found')
          commit_marker = '            conn.commit()\n        finally:'
          commit_at = text.find(commit_marker, episode_start)
          if commit_at < 0:
              raise SystemExit('episode fixture end anchor not found')
          text = text[:episode_start] + text[commit_at:]

          old_call = '_attach_fingerprint_for_episode(self.db, episode_id=1, window_id=1)'
          if text.count(old_call) != 2:
              raise SystemExit(f'expected 2 stale helper calls, found {text.count(old_call)}')
          text = text.replace(old_call, '_promote_fingerprint(self.db, window_id=1)')

          path.write_text(text)
          PY
          python -m pip install -q -e . pytest
          python -m compileall -q src/printer_v1
          PYTHONPATH=src python -m pytest -q tests/test_v2_9_8b_window_15m_final_integrated_readiness_repair.py
          git diff --check
          git config user.name "Printer V1 Verification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_v2_9_8b_window_15m_final_integrated_readiness_repair.py
          git commit -m "Migrate stale integrated readiness fingerprint test [stale-test-migration]"
          git push origin HEAD:agent/v2-9-8b-persistent-multisource-fresh-acquisition-implementation