name: V2-9.7E insufficient-pool baseline

on:
  pull_request:
    branches:
      - proof/v2-9-8b-insufficient-pool-baseline-ci

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Run insufficient-pool baseline regression
        run: python -m pytest -q tests/test_v2_9_7e_1_insufficient_pool_terminal_cleanup.py
