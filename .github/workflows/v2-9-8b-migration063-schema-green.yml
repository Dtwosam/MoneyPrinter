name: V2-9.8B migration063 schema GREEN

on:
  push:
    branches:
      - assistant/green-v2-9-8b-migration063-schema-gate

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch, verify, and publish atomically
        shell: bash
        run: |
          set -euo pipefail
          AUTHORITATIVE_BRANCH='assistant/v2-9-8b-later-cycle-mint-market-replay-repair'
          BASE='aff91ecae5519a4f802a2e3331aab00bd4c6695a'
          test "$(git ls-remote origin "refs/heads/${AUTHORITATIVE_BRANCH}" | awk '{print $1}')" = "$BASE"
          cp tools/migration063_schema_green.py /tmp/migration063_schema_green.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/migration063_schema_green.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('if count != 1:\n        raise SystemExit', 'if count < 1:\n        raise SystemExit', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git checkout --detach "$BASE"
          python /tmp/migration063_schema_green.py
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
          python -m pytest -q tests/test_v2_9_8b_migration063_schema_contract.py
          python -m pytest -q tests/test_v2_9_1_proof_db_schema_readiness.py
          python -m pytest -q tests/test_v2_9_8b_four_token_proof_zero_state_gate.py
          python -m pytest -q tests/test_v2_9_8b_pre_lifecycle_schema_gate_coherence.py -k 'zero_state_gate_reexports_helper_pin_63 or helper_migration_pins_are_explicit_literals_not_derived or disposable_schema_59 or disposable_schema_58 or migration_056_provenance_objects_exist'
          python -m pytest -q tests/test_v2_9_8b_post_lane4_schema_gate_coherence.py -k 'not authoritative_db_untouched_identity'
          python -m py_compile src/printer_v1/operator_cli/schema_admission_coherence.py src/printer_v1/operator_cli/proof_db_schema_readiness.py
          git diff --check
          test "$(git ls-remote origin "refs/heads/${AUTHORITATIVE_BRANCH}" | awk '{print $1}')" = "$BASE"
          git config user.name 'ChatGPT Repair CI'
          git config user.email 'actions@users.noreply.github.com'
          git add CURRENT_HANDOFF.md \
            src/printer_v1/operator_cli/schema_admission_coherence.py \
            src/printer_v1/operator_cli/proof_db_schema_readiness.py \
            tests/test_v2_9_8b_post_lane4_schema_gate_coherence.py \
            tests/test_v2_9_8b_pre_lifecycle_schema_gate_coherence.py \
            tests/test_v2_9_8b_migration063_schema_contract.py
          git diff --cached --check
          git commit -m 'fix: advance migration 063 schema admission contract'
          git push origin HEAD:"${AUTHORITATIVE_BRANCH}"
