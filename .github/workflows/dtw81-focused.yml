name: DTW-81 focused zero-runtime proof

on:
  pull_request:
    branches:
      - agent/v2-9-8b-unknown-liquidity-backup-transport-ownership-repair-design
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run DTW-81 focused tests
        env:
          PYTHONPATH: src
        run: python tests/test_dtw81_unknown_liquidity_backup_transport_ownership.py
